<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>SIMATA — Pemindai QR Presensi</title>
  <link rel="stylesheet" href="/css/notifications.css">
  <script src="/js/notifications.js"></script>
  <!-- jsQR Library via official jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --s-primary: #0F2419;
      --s-primary-hover: #163826;
      --s-accent: #4ADE80;
      --s-accent-soft: rgba(74, 222, 128, 0.15);
      --s-bg: #0F2419;
      --s-surface: #1B3527;
      --s-text: #FFFFFF;
      --s-text-muted: #A3B8AD;
      --s-danger: #EF4444;
      --s-warning: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--s-bg);
      color: var(--s-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .scanner-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--s-surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .scanner-title-group h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .scanner-title-group p {
      font-size: 11px;
      color: var(--s-text-muted);
      margin-top: 2px;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Viewport */
    .scanner-viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas#hiddenCanvas {
      display: none;
    }

    /* Target Box Overlay */
    .viewfinder-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .viewfinder-frame {
      width: min(260px, 72vw);
      height: min(260px, 72vw);
      position: relative;
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
    }

    /* Viewfinder corner brackets */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: var(--s-accent);
      border-style: solid;
      pointer-events: none;
    }

    .corner-tl {
      top: 0;
      left: 0;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 12px;
    }

    .corner-tr {
      top: 0;
      right: 0;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 12px;
    }

    .corner-bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 12px;
    }

    .corner-br {
      bottom: 0;
      right: 0;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 12px;
    }

    /* Laser scan line animation */
    .laser-line {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      background: var(--s-accent);
      box-shadow: 0 0 12px var(--s-accent);
      animation: scanLaser 2.2s infinite ease-in-out;
    }

    @keyframes scanLaser {
      0% { top: 8%; opacity: 0.2; }
      50% { top: 92%; opacity: 1; }
      100% { top: 8%; opacity: 0.2; }
    }

    /* Bottom Control Bar */
    .scanner-footer {
      padding: 16px 20px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
      background: var(--s-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--s-text-muted);
    }

    .status-badge.scanning {
      background: var(--s-accent-soft);
      color: var(--s-accent);
    }

    .status-badge.success {
      background: rgba(74, 222, 128, 0.25);
      color: #4ADE80;
      font-weight: 700;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .switch-cam-btn,
    .upload-qr-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .switch-cam-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .upload-qr-btn {
      background: rgba(74, 222, 128, 0.16);
      border-color: rgba(74, 222, 128, 0.42);
      color: #86efac;
    }

    .upload-qr-btn:hover {
      background: rgba(74, 222, 128, 0.25);
      border-color: rgba(74, 222, 128, 0.65);
      color: #bbf7d0;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 300px;
    }

    .error-actions .retry-btn,
    .error-actions .upload-qr-btn {
      flex: 1 1 120px;
      min-height: 40px;
    }

    .upload-feedback {
      font-size: 11.5px;
      color: #fca5a5;
      text-align: center;
      min-height: 16px;
      display: none;
    }

    /* Error Overlay Container */
    .error-container {
      position: absolute;
      inset: 20px;
      background: rgba(15, 36, 25, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
    }

    .error-container h2 {
      font-size: 16px;
      color: #F87171;
      margin-bottom: 8px;
    }

    .error-container p {
      font-size: 12px;
      color: var(--s-text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      max-width: 280px;
    }

    .retry-btn {
      background: var(--s-accent);
      color: var(--s-primary);
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="scanner-header">
    <div class="scanner-title-group">
      <h1>SIMATA Scanner</h1>
      <p>Arahkan kamera atau unggah gambar QR siswa</p>
    </div>
    <button class="close-btn" type="button" onclick="closeScannerWindow()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      Tutup
    </button>
  </header>

  <!-- Live Camera Viewport -->
  <main class="scanner-viewport">
    <video id="scannerVideo" autoplay playsinline muted></video>
    <canvas id="hiddenCanvas"></canvas>

    <!-- Viewfinder Box & Scan Guide -->
    <div class="viewfinder-overlay" id="viewfinderOverlay">
      <div class="viewfinder-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="laser-line" id="laserLine"></div>
      </div>
    </div>

    <!-- Error Notice Screen -->
    <div class="error-container" id="errorContainer">
      <div style="width:48px;height:48px;border-radius:50%;background:rgba(239,68,68,0.2);color:#EF4444;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 id="errorTitle">Akses Kamera Gagal</h2>
      <p id="errorMessage">Tidak dapat mengakses perangkat kamera.</p>
      <div class="error-actions">
        <button class="retry-btn" type="button" onclick="startCamera()">Coba Lagi</button>
        <button class="upload-qr-btn" type="button" onclick="triggerQrFileUpload()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          Upload Gambar QR
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Control Bar -->
  <footer class="scanner-footer">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Menyiapkan kamera...</span>
    </div>
    <div id="uploadFeedback" class="upload-feedback" role="alert"></div>

    <input type="file" id="qrFileInput" accept="image/*" style="display:none;" aria-label="Pilih gambar QR Code siswa dari file atau galeri">

    <div class="action-row">
      <button class="switch-cam-btn" type="button" id="switchCameraBtn" onclick="toggleCameraFacingMode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Ganti Kamera
      </button>
      <button class="upload-qr-btn" type="button" id="uploadQrBtn" onclick="triggerQrFileUpload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Upload QR / Galeri
      </button>
    </div>
  </footer>

  <script>
    // Security & Target Origin Resolution
    let trustedSimataOrigin = null;
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const originParam = urlParams.get('simataOrigin');
      if (originParam) {
        const parsedUrl = new URL(originParam);
        // Ensure origin is valid http or https
        if (parsedUrl.protocol === 'https:' || parsedUrl.protocol === 'http:') {
          trustedSimataOrigin = parsedUrl.origin;
        }
      }
    } catch (e) {
      console.warn("[SIMATA SCANNER] Gagal mem-parse simataOrigin:", e);
    }

    // State Variables
    let currentStream = null;
    let isScanning = false;
    let animationFrameId = null;
    let currentFacingMode = "environment"; // default rear camera
    let hasDetectedResult = false;

    const videoEl = document.getElementById('scannerVideo');
    const canvasEl = document.getElementById('hiddenCanvas');
    const canvasCtx = canvasEl.getContext('2d');
    const statusBadgeEl = document.getElementById('statusBadge');
    const statusTextEl = document.getElementById('statusText');
    const errorContainerEl = document.getElementById('errorContainer');
    const errorTitleEl = document.getElementById('errorTitle');
    const errorMessageEl = document.getElementById('errorMessage');
    const laserLineEl = document.getElementById('laserLine');

    function setStatus(text, state) {
      if (statusTextEl) statusTextEl.textContent = text;
      if (statusBadgeEl) {
        statusBadgeEl.className = "status-badge " + (state || "");
      }
    }

    function showError(title, msg) {
      stopCameraStream();
      if (errorTitleEl) errorTitleEl.textContent = title;
      if (errorMessageEl) errorMessageEl.textContent = msg;
      if (errorContainerEl) errorContainerEl.style.display = "flex";
      setStatus("Kamera Bermasalah", "error");
    }

    function hideError() {
      if (errorContainerEl) errorContainerEl.style.display = "none";
    }

    function resolveTargetOrigin() {
      return trustedSimataOrigin || window.location.origin;
    }

    function closeScannerWindow() {
      stopCameraStream();
      const targetOrigin = resolveTargetOrigin();
      const cancelPayload = { type: "SIMATA_QR_CANCEL" };
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(cancelPayload, targetOrigin); } catch (e) {}
      }
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(cancelPayload, targetOrigin); } catch (e) {}
      }
      try { window.close(); } catch (e) {}
    }

    function stopCameraStream() {
      isScanning = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(function(track) {
            track.stop();
          });
        } catch (e) {
          console.warn("[SIMATA SCANNER] Error stopping track:", e);
        }
        currentStream = null;
      }
      if (videoEl) {
        videoEl.srcObject = null;
      }
    }

    function toggleCameraFacingMode() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      startCamera();
    }

    function startCamera() {
      hideError();
      stopCameraStream();
      hasDetectedResult = false;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError(
          "Browser Tidak Didukung",
          "Browser ini tidak mendukung akses kamera langsung (getUserMedia). Gunakan browser Chrome/Safari modern berprotokol HTTPS."
        );
        return;
      }

      if (typeof jsQR !== "function") {
        showError(
          "Library Scanner Gagal",
          "Pustaka decoder jsQR gagal dimuat. Periksa koneksi internet Anda lalu coba lagi."
        );
        return;
      }

      setStatus("Meminta izin kamera...", "scanning");

      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(handleCameraSuccess)
        .catch(function(error) {
          console.warn("[SIMATA SCANNER] getUserMedia ideal facingMode failed, retrying generic video...", error);
          // Fallback to generic video constraints without ideal facingMode
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(handleCameraSuccess)
            .catch(handleCameraError);
        });
    }

    function handleCameraSuccess(stream) {
      currentStream = stream;
      videoEl.srcObject = stream;
      videoEl.setAttribute('playsinline', 'true');
      videoEl.setAttribute('autoplay', 'true');
      videoEl.muted = true;

      videoEl.play()
        .then(function() {
          isScanning = true;
          setStatus("Memindai QR...", "scanning");
          if (laserLineEl) laserLineEl.style.display = "block";
          animationFrameId = requestAnimationFrame(scanLoop);
        })
        .catch(function(playError) {
          console.warn("[SIMATA SCANNER] video.play error, retrying loop:", playError);
          isScanning = true;
          setStatus("Memindai QR...", "scanning");
          animationFrameId = requestAnimationFrame(scanLoop);
        });
    }

    function handleCameraError(error) {
      console.error("[SIMATA SCANNER] Camera error:", error);
      let title = "Akses Kamera Gagal";
      let msg = "Tidak dapat mengakses perangkat kamera.";

      if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
        title = "Izin Kamera Ditolak";
        msg = "Akses kamera diblokir oleh browser. Izinkan akses kamera pada ikon gembok/setelan situs di bilah alamat browser Anda, lalu klik Coba Lagi.";
      } else if (error.name === "NotFoundError" || error.name === "DevicesNotFoundError") {
        title = "Kamera Tidak Ditemukan";
        msg = "Perangkat kamera tidak terdeteksi pada perangkat ini.";
      } else if (error.name === "NotReadableError" || error.name === "TrackStartError") {
        title = "Kamera Sedang Digunakan";
        msg = "Kamera kemungkinan sedang digunakan oleh aplikasi lain.";
      }

      showError(title, msg);
    }

    function scanLoop() {
      if (!isScanning || hasDetectedResult) return;

      if (videoEl && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
        canvasEl.width = videoEl.videoWidth;
        canvasEl.height = videoEl.videoHeight;
        canvasCtx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

        const imageData = canvasCtx.getImageData(0, 0, canvasEl.width, canvasEl.height);
        let code = null;

        try {
          code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });
        } catch (e) {
          console.warn("[SIMATA SCANNER] jsQR decode exception:", e);
        }

        if (code && code.data && code.data.trim()) {
          const rawQr = code.data.trim();
          handleQrDetected(rawQr);
          return; // Stop animation loop immediately
        }
      }

      if (isScanning && !hasDetectedResult) {
        animationFrameId = requestAnimationFrame(scanLoop);
      }
    }

    function handleQrDetected(qrString) {
      hasDetectedResult = true;
      isScanning = false;
      stopCameraStream();

      setStatus("QR Berhasil: " + qrString, "success");
      if (laserLineEl) laserLineEl.style.display = "none";

      const targetOrigin = resolveTargetOrigin();
      if (!targetOrigin) {
        console.error("[SIMATA SCANNER] trustedSimataOrigin tidak valid. Pembacaan dibatalkan demi keamanan.");
        alert("Origin SIMATA tidak valid. Hubungi administrator.");
        return;
      }

      const payload = {
        type: "SIMATA_QR_RESULT",
        qrCodeId: qrString,
        transferId: Date.now() + "_" + Math.random().toString(36).slice(2)
      };

      let delivered = false;

      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(payload, targetOrigin);
          delivered = true;
        } catch (e) {}
      }

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(payload, targetOrigin);
          delivered = true;
        } catch (e) {}
      }

      if (window.location.origin === targetOrigin) {
        try {
          if (typeof BroadcastChannel !== "undefined") {
            const ch = new BroadcastChannel("simata_responder_channel");
            ch.postMessage(payload);
            ch.close();
            delivered = true;
          }
        } catch (e) {}
        try {
          localStorage.setItem("SIMATA_QR_RESULT_TRANSFER", JSON.stringify(payload));
          delivered = true;
        } catch (e) {}
      }

      if (delivered) {
        setTimeout(function() {
          try { window.close(); } catch (e) {}
        }, 300);
      } else {
        alert("QR Terdeteksi: " + qrString + "\n(Jendela induk SIMATA tidak ditemukan)");
      }
    }

    // Auto-start camera on page load
    window.addEventListener('DOMContentLoaded', function() {
      const fileInput = document.getElementById('qrFileInput');
      if (fileInput) {
        fileInput.addEventListener('change', handleQrFileSelected);
      }
      startCamera();
    });

    function setUploadFeedback(msg) {
      const el = document.getElementById('uploadFeedback');
      if (!el) return;
      if (msg) {
        el.textContent = msg;
        el.style.display = 'block';
      } else {
        el.textContent = '';
        el.style.display = 'none';
      }
    }

    function triggerQrFileUpload() {
      setUploadFeedback('');
      const fileInput = document.getElementById('qrFileInput');
      if (!fileInput) return;
      fileInput.value = '';
      fileInput.click();
    }

    function loadImageElementFromFile(file) {
      return new Promise(function(resolve, reject) {
        const objectUrl = (window.URL || window.webkitURL).createObjectURL(file);
        const img = new Image();
        img.onload = function() {
          try { (window.URL || window.webkitURL).revokeObjectURL(objectUrl); } catch (_) {}
          resolve(img);
        };
        img.onerror = function() {
          try { (window.URL || window.webkitURL).revokeObjectURL(objectUrl); } catch (_) {}
          reject(new Error('File gambar tidak dapat dibaca.'));
        };
        img.src = objectUrl;
      });
    }

    async function extractQrFromImage(img) {
      // Strategy 1: Native BarcodeDetector when supported (resilient on phone photos)
      if (typeof window.BarcodeDetector === 'function') {
        try {
          const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
          const detections = await detector.detect(img);
          if (detections && detections.length > 0 && detections[0].rawValue) {
            return String(detections[0].rawValue).trim();
          }
        } catch (_) {}
      }

      if (typeof jsQR !== 'function') {
        throw new Error('Pustaka pembaca QR (jsQR) belum termuat.');
      }

      const natW = img.naturalWidth || img.width;
      const natH = img.naturalHeight || img.height;
      if (!natW || !natH) return null;

      const maxDims = [1200, 800, 1800];
      for (let i = 0; i < maxDims.length; i++) {
        const maxDim = maxDims[i];
        const scale = Math.min(1, maxDim / Math.max(natW, natH));
        const w = Math.max(1, Math.round(natW * scale));
        const h = Math.max(1, Math.round(natH * scale));
        canvasEl.width = w;
        canvasEl.height = h;
        canvasCtx.fillStyle = '#FFFFFF';
        canvasCtx.fillRect(0, 0, w, h);
        canvasCtx.drawImage(img, 0, 0, w, h);
        const imageData = canvasCtx.getImageData(0, 0, w, h);
        const decoded = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
        if (decoded && decoded.data && decoded.data.trim()) {
          return decoded.data.trim();
        }
      }
      return null;
    }

    async function handleQrFileSelected(ev) {
      const file = ev && ev.target && ev.target.files && ev.target.files[0];
      if (!file) return;

      const prevStatusText = statusTextEl ? statusTextEl.textContent : '';
      const prevStatusClass = statusBadgeEl ? statusBadgeEl.className : 'status-badge';
      setUploadFeedback('');
      setStatus('Membaca QR dari gambar...', 'scanning');

      try {
        const img = await loadImageElementFromFile(file);
        const qrText = await extractQrFromImage(img);
        if (qrText) {
          handleQrDetected(qrText);
          return;
        }
        setUploadFeedback('QR Code tidak terbaca di gambar. Pastikan gambar jelas & tidak terpotong.');
        setStatus('QR Tidak Terbaca', 'error');
      } catch (err) {
        console.warn('[SIMATA SCANNER] Upload decode failed:', err);
        setUploadFeedback((err && err.message) ? err.message : 'Gagal membaca file gambar QR.');
        setStatus('Gagal Membaca Gambar', 'error');
      }

      if (isScanning && !hasDetectedResult) {
        setTimeout(function() {
          if (isScanning && !hasDetectedResult) {
            if (statusTextEl) statusTextEl.textContent = prevStatusText || 'Memindai QR...';
            if (statusBadgeEl) statusBadgeEl.className = prevStatusClass || 'status-badge scanning';
          }
        }, 2500);
      }
    }

    // Cleanup on window unload
    window.addEventListener('beforeunload', function() {
      stopCameraStream();
    });
  </script>
</body>
</html>
