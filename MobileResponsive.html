<style>
/**
 * SIMATA — Mobile Responsive Stylesheet
 * File: MobileResponsive.html
 * 
 * Target devices: 320px, 360px, 375px, 390px, 414px, 430px, 768px, 1024px+
 * Features off-canvas sidebar with hamburger button & backdrop on mobile (<=768px).
 * Preserves permanent sidebar and desktop layout (>768px).
 */

/* ==========================================================================
   1. GLOBAL RESET & BASE MOBILE VIEWPORT
   ========================================================================== */

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

.dashboard-layout {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.dashboard-layout .main {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

/* Desktop Defaults: Hide Mobile Navigation Controls on Screens > 768px */
.hamburger-btn {
  display: none;
}

.sidebar-close-btn {
  display: none;
}

.sidebar-backdrop {
  display: none;
}

/* ==========================================================================
   2. TOUCH TARGETS & FORM INPUT OPTIMIZATION (MOBILE)
   ========================================================================== */

/* Prevent iOS auto-zoom on input focus by ensuring >= 16px font-size */
@media (max-width: 768px) {
  .dashboard-layout .input-box,
  .dashboard-layout input[type="text"],
  .dashboard-layout input[type="date"],
  .dashboard-layout input[type="search"],
  .dashboard-layout input[type="password"],
  .dashboard-layout select.input-box,
  .dashboard-layout select,
  .dashboard-layout textarea.input-box,
  .dashboard-layout textarea {
    font-size: 16px;
    min-height: 44px;
    padding: 10px 14px;
    border-radius: 10px;
  }

  .dashboard-layout .login-button,
  .dashboard-layout button.login-button {
    min-height: 44px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
}

/* ==========================================================================
   3. TABLETS & LARGE MOBILE (max-width: 1024px)
   ========================================================================== */

@media (max-width: 1024px) {
  .dashboard-layout .sidebar {
    width: 220px;
  }

  .dashboard-layout .topbar {
    padding: 0 20px;
  }

  .dashboard-layout .content {
    padding: 24px 20px 36px;
  }

  .dashboard-layout .stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
}

/* ==========================================================================
   4. MOBILE STANDARD (max-width: 768px) — OFF-CANVAS SIDEBAR
   ========================================================================== */

@media (max-width: 768px) {

  /* --- Layout & Structure --- */
  .dashboard-layout {
    display: block;
    width: 100%;
    min-height: 100vh;
  }

  /* --- Mobile Backdrop --- */
  .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 9998;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  .sidebar-backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  /* --- Off-Canvas Sidebar Navigation --- */
  .dashboard-layout .sidebar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    bottom: 0 !important;
    width: min(290px, 84vw) !important;
    height: 100vh !important;
    min-height: 100vh !important;
    z-index: 9999 !important;
    transform: translateX(-100%) !important;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch !important;
    display: flex !important;
    flex-direction: column !important;
    box-shadow: 4px 0 24px rgba(0, 0, 0, 0.25) !important;
    background: linear-gradient(180deg, #166534 0%, #14532D 100%) !important;
  }

  .dashboard-layout .sidebar.mobile-open {
    transform: translateX(0) !important;
  }

  .dashboard-layout .sidebar-logo {
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .dashboard-layout .sidebar-logo img {
    width: 40px;
    height: 40px;
    margin-bottom: 0;
    flex-shrink: 0;
  }

  .dashboard-layout .sidebar-logo h2 {
    font-size: 18px;
    line-height: 1.2;
    margin: 0;
    color: #ffffff;
  }

  .dashboard-layout .sidebar-logo p {
    font-size: 11px;
    margin: 2px 0 0 0;
    color: rgba(255, 255, 255, 0.7);
  }

  .sidebar-close-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    min-width: 36px;
    min-height: 36px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #ffffff;
    cursor: pointer;
    margin-left: auto;
    padding: 0;
    touch-action: manipulation;
    transition: background 0.2s ease;
  }

  .sidebar-close-btn:hover,
  .sidebar-close-btn:focus-visible {
    background: rgba(255, 255, 255, 0.22);
    outline: none;
  }

  .dashboard-layout .sidebar-menu {
    padding: 12px 10px;
    flex: 1;
  }

  .dashboard-layout .sidebar-menu ul {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dashboard-layout .sidebar-menu li {
    margin: 0;
    min-height: 44px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    touch-action: manipulation;
  }

  .dashboard-layout .menu-icon svg {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
  }

  .dashboard-layout .sidebar-footer {
    padding: 12px 14px 20px;
    margin-top: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .dashboard-layout .logout-button {
    min-height: 44px;
    padding: 10px 16px;
    font-size: 13.5px;
    border-radius: 10px;
    justify-content: center;
    width: 100%;
  }

  /* --- Topbar & Hamburger Button --- */
  .dashboard-layout .topbar {
    min-height: 58px;
    height: auto;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .hamburger-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--text, #1F2937);
    cursor: pointer;
    padding: 0;
    margin-right: 8px;
    flex-shrink: 0;
    touch-action: manipulation;
    transition: background-color 0.15s ease;
  }

  .hamburger-btn:hover,
  .hamburger-btn:focus-visible {
    background: rgba(0, 0, 0, 0.06);
    outline: none;
  }

  .dashboard-layout .topbar-left {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .dashboard-layout .topbar-label {
    font-size: 10px;
    letter-spacing: 0.5px;
  }

  .dashboard-layout .topbar-left h1 {
    font-size: 16px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dashboard-layout .topbar-right {
    gap: 8px;
    flex-shrink: 0;
  }

  .dashboard-layout .user-profile {
    gap: 6px;
  }

  .dashboard-layout .user-avatar {
    width: 36px;
    height: 36px;
    font-size: 13px;
    font-weight: 700;
  }

  .dashboard-layout .live-clock,
  .dashboard-layout .user-info {
    display: none;
  }

  /* --- Main Content Container --- */
  .dashboard-layout .content {
    padding: 16px 14px 32px;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  /* --- Welcome Card --- */
  .dashboard-layout .welcome-card {
    min-height: auto;
    padding: 18px 16px;
    margin-bottom: 18px;
    border-radius: 16px;
  }

  .dashboard-layout .welcome-card h2 {
    font-size: 20px;
    line-height: 1.3;
  }

  .dashboard-layout .welcome-card p {
    font-size: 12px;
    margin-top: 4px;
    max-width: 100%;
  }

  .dashboard-layout .welcome-decoration {
    display: none;
  }

  /* --- Statistics Grid & Cards --- */
  .dashboard-layout .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
  }

  .dashboard-layout .stat-card {
    min-height: 85px;
    padding: 12px 10px;
    border-radius: 14px;
    gap: 10px;
  }

  .dashboard-layout .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .dashboard-layout .stat-icon svg {
    width: 18px;
    height: 18px;
  }

  .dashboard-layout .stat-data span {
    font-size: 11px;
    line-height: 1.2;
  }

  .dashboard-layout .stat-data strong {
    font-size: 18px;
    line-height: 1.2;
  }

  /* --- Section Headings & Action Bars --- */
  .dashboard-layout .section-heading {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 14px;
  }

  .dashboard-layout .section-heading > div,
  .dashboard-layout .section-heading .section-actions,
  .dashboard-layout .section-actions {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .dashboard-layout .section-heading h2 {
    font-size: 18px;
  }

  /* Overrides inline style="min-width:..." and style="margin-left:..." on search/buttons */
  .dashboard-layout .section-heading .input-box,
  .dashboard-layout .section-actions .input-box {
    flex: 1 1 100%;
    width: 100% !important;
    min-width: 0 !important;
  }

  .dashboard-layout .section-heading button,
  .dashboard-layout .section-heading .login-button,
  .dashboard-layout .section-actions button,
  .dashboard-layout .section-actions .login-button {
    width: 100%;
    margin-left: 0 !important;
    justify-content: center;
  }

  /* --- Tables & Horizontal Overflow Containers --- */
  /* Overrides inline style="margin-top:18px" to ensure table wrapper scrolls horizontally */
  .dashboard-layout .content .table-responsive,
  .dashboard-layout .content div[style*="margin-top:18px"],
  .dashboard-layout .content > div:has(> table),
  .dashboard-layout .content div:has(> table) {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    margin-top: 12px !important;
    border: 1px solid #e5e7eb;
    background: #ffffff;
  }

  .dashboard-layout .content table {
    min-width: 560px;
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  /* Overrides inline style="padding:8px" on dynamically rendered <td> and <th> */
  .dashboard-layout .content table th,
  .dashboard-layout .content table td {
    padding: 10px 8px !important;
    font-size: 12px;
    white-space: nowrap;
  }

  /* Overrides inline style="margin-right:6px" on row action buttons */
  .dashboard-layout .content table td button {
    padding: 6px 10px;
    font-size: 11px;
    min-height: 32px;
    border-radius: 6px;
    margin: 2px 4px 2px 0 !important;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* --- Modals Responsive Bounding (Overrides hardcoded inline min-width:420px & padding) --- */
  [id$="Modal"] {
    padding: 12px;
    box-sizing: border-box;
  }

  #attendanceModal > div,
  #teacherAttendanceModal > div,
  #journalModal > div,
  #gradeModal > div,
  #studentModal > div,
  #teacherModal > div,
  #classModal > div,
  [id$="Modal"] > div {
    min-width: 0 !important;
    width: 100% !important;
    max-width: 95vw !important;
    max-height: 88vh !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    padding: 16px !important;
    border-radius: 16px;
    box-sizing: border-box;
    margin: auto;
  }

  [id$="Modal"] h3 {
    font-size: 16px;
  }

  /* Overrides inline style="margin-top:12px" on modal action footer */
  [id$="Modal"] div[style*="justify-content:flex-end"] {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    margin-top: 14px !important;
  }

  [id$="Modal"] div[style*="justify-content:flex-end"] button {
    flex: 1 1 45%;
    min-height: 44px;
    justify-content: center;
  }

  /* --- Responder & QR Scanner Layout --- */
  .simata-responder {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 16px;
  }

  .simata-responder-panel {
    width: 100%;
    border-radius: 16px;
    box-sizing: border-box;
  }

  .simata-camera,
  .simata-camera-guide {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
  }

  .dashboard-layout #qrVideo,
  .dashboard-layout #responderVideo,
  .dashboard-layout #qrCanvas,
  .dashboard-layout #responderCanvas {
    max-width: 100%;
    width: 100%;
    height: auto;
    border-radius: 12px;
  }

  /* Overrides inline style="padding:32px 16px" on status panels */
  .dashboard-layout #cameraIdleView,
  .dashboard-layout #qrIdleView,
  .dashboard-layout #qrScanningView,
  .dashboard-layout #qrSuccessView,
  .dashboard-layout #qrDuplicateView,
  .dashboard-layout #qrNotFoundView,
  .dashboard-layout #qrErrorView,
  .dashboard-layout #qrLookupView {
    padding: 20px 12px !important;
    border-radius: 14px;
  }

  /* --- Toast Notification on Mobile --- */
  .toast {
    top: 16px;
    left: 16px;
    right: 16px;
    min-width: 0;
    width: auto;
    max-width: calc(100% - 32px);
    margin: auto;
    padding: 14px 16px;
    border-radius: 14px;
    z-index: 10002;
  }

  .toast-icon {
    width: 38px;
    height: 38px;
    font-size: 18px;
    flex-shrink: 0;
  }

  .toast-title {
    font-size: 14px;
  }

  .toast-message {
    font-size: 12px;
  }
}

/* ==========================================================================
   5. SMALL SMARTPHONES (max-width: 480px: 360px - 430px)
   ========================================================================== */

@media (max-width: 480px) {

  .dashboard-layout .content {
    padding: 12px 10px 28px;
  }

  .dashboard-layout .welcome-card {
    padding: 16px 14px;
  }

  .dashboard-layout .welcome-card h2 {
    font-size: 18px;
  }

  .dashboard-layout .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .dashboard-layout .stat-card {
    padding: 10px 8px;
    min-height: 80px;
  }

  .dashboard-layout .stat-data strong {
    font-size: 16px;
  }
}

/* ==========================================================================
   6. EXTRA SMALL SMARTPHONES (max-width: 360px e.g. 320px Galaxy Fold / SE)
   ========================================================================== */

@media (max-width: 360px) {

  .dashboard-layout .stats-grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .dashboard-layout .welcome-card h2 {
    font-size: 16px;
  }

  .dashboard-layout .topbar-left h1 {
    font-size: 14px;
  }

  .dashboard-layout .user-avatar {
    width: 32px;
    height: 32px;
    font-size: 12px;
  }

  [id$="Modal"] div[style*="justify-content:flex-end"] button {
    flex: 1 1 100%;
  }

  .student-qr-modal-card {
    max-width: 92% !important;
    padding: 16px !important;
    margin: 10px !important;
  }

  #studentQrContainer {
    min-width: 160px !important;
    min-height: 160px !important;
    padding: 10px !important;
  }
}

@media (max-width: 768px) {
  .student-qr-modal-card {
    max-width: 90% !important;
  }

  .batch-qr-modal-card {
    max-width: 95% !important;
    padding: 16px !important;
    margin: 8px !important;
    max-height: 94vh !important;
  }

  #batchPreviewGrid {
    grid-template-columns: 1fr !important;
  }

  .student-action-group {
    gap: 4px;
  }

  .btn-action {
    height: 28px;
    padding: 0 7px;
    font-size: 11px;
    gap: 3px;
  }

  .btn-action .btn-action-icon {
    width: 11px;
    height: 11px;
  }

  .table-responsive {
    border-radius: 8px !important;
  }

  .student-filter-bar {
    padding: 10px !important;
    gap: 8px !important;
  }

  #studentClassFilter {
    width: 100% !important;
  }

  /* --- Student Modal Redesign Mobile (Bug 9) --- */
  .student-form-grid {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }

  .student-col-span-2 {
    grid-column: span 1 !important;
  }

  .student-modal-card {
    max-width: 95vw !important;
    max-height: 90vh !important;
    padding: 0 !important;
    border-radius: 16px !important;
  }

  .student-modal-header {
    padding: 14px 16px !important;
  }

  .student-modal-body {
    padding: 14px 16px !important;
    gap: 14px !important;
  }

  .student-modal-footer {
    padding: 12px 16px !important;
  }

  .student-form-group .input-box {
    height: 44px !important;
    font-size: 14px !important;
  }
}
</style>
