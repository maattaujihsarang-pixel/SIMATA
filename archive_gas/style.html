<style>

/* ==========================
   GOOGLE FONT
========================== */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

/* ==========================
   ROOT COLOR
========================== */

:root{

    --primary:#166534;
    --secondary:#22C55E;
    --accent:#FACC15;

    --background:#EEF3F8;
    --surface:#FFFFFF;

    --text:#1F2937;
    --text-light:#6B7280;

    --radius:20px;

    --shadow:
        0 15px 40px rgba(15,23,42,.08);

}

/* ==========================
   RESET
========================== */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

/* ==========================
   BODY
========================== */

body{

    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--text);
    background:#eef3f8;
    overflow-x:hidden;

}

/* ==========================
   MAIN CONTAINER
========================== */

.container{

    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;

}

/* ==========================
   CARD
========================== */

.card{

    width:100%;
    max-width:520px;
    background:var(--surface);

    border-radius:24px;

    padding:34px 40px;

    box-shadow:var(--shadow);

}

/* ==========================
   TITLE
========================== */

.title{

    font-size:34px;
    font-weight:700;
    color:var(--primary);
    text-align:center;

}

/* ==========================
   SUBTITLE
========================== */

.subtitle{

    text-align:center;
    color:var(--text-light);
    margin-top:10px;
    line-height:1.6;
    font-size:15px;

}

/* ==========================
   SCHOOL LOGO
========================== */

.school-logo{

    width:120px;
    display:block;
    margin:0 auto 20px;
    transition:.35s ease;

}

.school-logo:hover{

    transform:scale(1.05);

}

/* ==========================
   LOGIN FORM
========================== */

.login-form{

    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:12px;

}

/* ==========================
   INPUT
========================== */

.input-box{

    width:100%;
    padding:16px 18px;
    border:2px solid #E5E7EB;
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.3s;
    background:#FAFAFA;
    transition: all .25s ease;
    height:56px;
    font-size:15px;

border-radius:14px;

}

.input-box:focus{

    border-color:var(--primary);
    background:white;
    box-shadow:0 0 0 4px rgba(27,94,32,.12);

}

/* ==========================
   BUTTON
========================== */

.login-button{

    margin-top:10px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;

}

.login-button:hover{

    background:var(--secondary);
    transform:translateY(-2px);

}

.login-button:active{

    transform:scale(.98);

}

.password-group{
    position: relative;
}

.toggle-password{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);

    border:none;
    background:transparent;
    outline:none;

    cursor:pointer;

    color:#94A3B8;
    font-size:18px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.25s;
}

.toggle-password:hover{
    color:var(--primary);
}

.error-message{
    color:#e53935;
    font-size:13px;
    margin-top:4px;
    margin-bottom:6px;
    min-height:0;
    font-weight:500;
}

/* Input Error */
.input-error{
    border:1.5px solid #e53935 !important;
    box-shadow:0 0 0 3px rgba(229,57,53,.10);
}

/* Input Normal */
.input-box{
    transition:all .25s ease;
}

/* ==========================
   SPLIT LAYOUT
========================== */

.login-layout{
    display:flex;
    min-height:100vh;
}

.branding-panel{
    flex:1;
    background:linear-gradient(135deg,#166534,#22c55e);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px;
    position:relative;
}

.branding-content{
    max-width:420px;
    z-index:2;
}

.brand-logo{
    width:110px;
    margin-bottom:24px;
}

.branding-content h1{
    font-size:54px;
    font-weight:800;
    margin-bottom:12px;
}

.branding-content h2{
    font-size:22px;
    font-weight:600;
    margin-bottom:18px;
}

.branding-content p{
    line-height:1.8;
    opacity:.9;
}

.login-panel{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:48px;
}

.login-footer{

    margin-top:34px;
    text-align:center;
    font-size:11px;
    font-weight:500;
    color:#94A3B8;
    opacity:.55;
    letter-spacing:.8px;
    user-select:none;

}

/* ==========================
   TOAST NOTIFICATION
========================== */

.toast{

    position:fixed;
    top:30px;
    right:30px;
    min-width:320px;
    background:#FFFFFF;
    border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.15);
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-20px);
    transition:.35s ease;
    z-index:9999;

}

.toast.show{

    opacity:1;
    visibility:visible;
    transform:translateY(0);

}

.toast-icon{

    width:46px;
    height:46px;
    border-radius:50%;
    background:#E8F5E9;
    color:#2E7D32;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;

}

.toast-title{

    font-size:15px;
    font-weight:700;
    color:#263238;

}

.toast-message{

    margin-top:3px;
    font-size:13px;
    color:#607D8B;

}

/* ==========================
   MODERN LOADING
========================== */

.loading-overlay{
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(5px);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:.35s;
    z-index:9999;
}

.loading-overlay.show{
    opacity:1;
    visibility:visible;
}

.spinner{
    width:55px;
    height:55px;

    border:5px solid #e5e7eb;
    border-top:5px solid #2563eb;
    border-radius:50%;

    animation:spin .8s linear infinite;
}

#globalLoadingOverlay .spinner{
    border-top-color:#166534;
}

.simata-loading-spinner{
    width:32px;
    height:32px;
    border:3px solid #e2e8f0;
    border-top-color:#166534;
    border-radius:50%;
    animation:simataSpin .75s linear infinite;
    display:inline-block;
}

.btn-spinner-icon svg{
    animation:simataSpin .75s linear infinite;
}

.loading-overlay p{
    margin-top:18px;
    color:#1f2937;
    font-weight:600;
    font-size:15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes simataSpin{
    to{
        transform:rotate(360deg);
    }
}

/* ==========================
   RIPPLE BUTTON
========================== */

.login-button{
    position: relative;
    overflow: hidden;
}

.ripple{
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple .6s linear;
    background: rgba(255,255,255,.45);
    pointer-events: none;
}

@keyframes ripple{

    to{
        transform: scale(4);
        opacity: 0;
    }

}

/* =====================================================
   SIMATA DASHBOARD
   Sprint 2 — Tahap 2.5
   Dashboard UI Redesign
===================================================== */


/* =====================================================
   DASHBOARD PAGE
===================================================== */

.dashboard-page{

    margin:0;
    background:#F4F6F4;
    color:#1F2937;
    font-family:'Plus Jakarta Sans',sans-serif;
    overflow-x:hidden;

}


/* =====================================================
   DASHBOARD LAYOUT
===================================================== */

.dashboard-layout{

    min-height:100vh;
    display:flex;

}


/* =====================================================
   SIDEBAR
===================================================== */

.dashboard-layout .sidebar{

    width:265px;
    min-height:100vh;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    background:
        linear-gradient(
            180deg,
            #0F2419 0%,
            #12301F 100%
        );

    color:#FFFFFF;
    position:relative;
    overflow:hidden;

}


/* Decorative glow */

.dashboard-layout .sidebar::before{

    content:"";
    position:absolute;
    width:260px;
    height:260px;
    top:-140px;
    right:-120px;
    background:rgba(34,197,94,.12);
    border-radius:50%;
    pointer-events:none;

}


/* =====================================================
   SIDEBAR LOGO
===================================================== */

.dashboard-layout .sidebar-logo{

    padding:32px 24px 28px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    position:relative;
    z-index:1;

}


.dashboard-layout .sidebar-logo img{

    width:72px;
    height:72px;
    object-fit:contain;
    display:block;
    margin:0 auto 16px;

}


.dashboard-layout .sidebar-logo h2{

    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;

}


.dashboard-layout .sidebar-logo p{

    margin:6px 0 0;
    color:rgba(255,255,255,.58);
    font-size:11px;
    font-weight:500;
    letter-spacing:.3px;

}


/* =====================================================
   SIDEBAR MENU
===================================================== */

.dashboard-layout .sidebar-menu{

    flex:1;
    padding:24px 14px;
    position:relative;
    z-index:1;

}


.dashboard-layout .sidebar-menu ul{

    list-style:none;
    padding:0;
    margin:0;

}


.dashboard-layout .sidebar-menu li{

    min-height:50px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    margin-bottom:6px;
    border-radius:12px;

    color:rgba(255,255,255,.72);

    cursor:pointer;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease;

}


.dashboard-layout .sidebar-menu li:hover{

    background:rgba(255,255,255,.07);
    color:#FFFFFF;
    transform:translateX(3px);

}


.dashboard-layout .sidebar-menu li.active{

    background:
        linear-gradient(
            90deg,
            rgba(34,197,94,.22),
            rgba(34,197,94,.08)
        );

    color:#FFFFFF;

    box-shadow:
        inset 3px 0 0 #22C55E;

}


/* =====================================================
   MENU ICON
===================================================== */

.dashboard-layout .menu-icon{

    width:21px;
    height:21px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;

}


.dashboard-layout .menu-icon svg{

    width:19px;
    height:19px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;

}


.dashboard-layout .sidebar-menu li.active .menu-icon{

    color:#4ADE80;

}


.dashboard-layout .menu-text{

    font-size:13px;
    font-weight:600;
    letter-spacing:.1px;

}


/* =====================================================
   SIDEBAR FOOTER
===================================================== */

.dashboard-layout .sidebar-footer{

    padding:18px 14px 24px;
    border-top:1px solid rgba(255,255,255,.08);
    position:relative;
    z-index:1;

}


.dashboard-layout .logout-button{

    width:100%;
    min-height:48px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    border:0;
    border-radius:12px;
    background:transparent;

    color:rgba(255,255,255,.65);

    font-family:inherit;
    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:
        background .25s ease,
        color .25s ease;

}


.dashboard-layout .logout-button:hover{

    background:rgba(250,204,21,.08);

    color:#FACC15;

}


.dashboard-layout .logout-button .menu-icon{

    color:currentColor;

}


.dashboard-layout .logout-button:disabled{

    opacity:.55;
    cursor:not-allowed;

}


/* =====================================================
   MAIN
===================================================== */

.dashboard-layout .main{

    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
    background:#F4F6F4;

}


/* =====================================================
   TOPBAR
===================================================== */

.dashboard-layout .topbar{

    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    padding:0 34px;
    background:#FFFFFF;
    border-bottom:1px solid #E7EBE8;

}


.dashboard-layout .topbar-left{

    display:flex;
    flex-direction:column;
    gap:3px;

}


.dashboard-layout .topbar-label{

    color:#789083;
    font-size:9px;
    font-weight:700;
    letter-spacing:1.5px;

}


.dashboard-layout .topbar-left h1{

    margin:0;
    color:#17241C;
    font-size:21px;
    font-weight:750;
    letter-spacing:-.4px;

}


/* =====================================================
   TOPBAR RIGHT
===================================================== */

.dashboard-layout .topbar-right{

    display:flex;
    align-items:center;
    gap:28px;

}


/* =====================================================
   LIVE CLOCK
===================================================== */

.dashboard-layout .live-clock{

    display:flex;
    align-items:center;
    gap:8px;
    color:#65766C;
    font-size:12px;
    font-weight:600;
    letter-spacing:.3px;

}


.dashboard-layout .clock-dot{

    width:7px;
    height:7px;
    border-radius:50%;
    background:#22C55E;

    box-shadow:
        0 0 0 4px rgba(34,197,94,.10);

}


/* =====================================================
   USER PROFILE
===================================================== */

.dashboard-layout .user-profile-wrapper {
    position: relative;
    display: inline-block;
}

.dashboard-layout .user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 1px solid transparent;
    padding: 4px 8px;
    border-radius: 9999px;
    cursor: pointer;
    text-align: left;
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
}

.dashboard-layout .user-profile:hover,
.dashboard-layout .user-profile[aria-expanded="true"] {
    background: #F3F4F6;
    border-color: #E5E7EB;
}

.dashboard-layout .user-profile:focus-visible {
    box-shadow: 0 0 0 2px #22C55E;
}

.dashboard-layout .user-avatar {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #166534, #22C55E);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 3px 8px rgba(22, 101, 52, .20);
    user-select: none;
}

.dashboard-layout .user-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.dashboard-layout .user-name {
    color: #1F2A23;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.2;
}

.dashboard-layout .user-info small {
    color: #849188;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.2;
}

.dashboard-layout .profile-chevron {
    width: 16px;
    height: 16px;
    color: #9CA3AF;
    transition: transform .2s ease, color .2s ease;
    flex-shrink: 0;
}

.dashboard-layout .user-profile:hover .profile-chevron,
.dashboard-layout .user-profile[aria-expanded="true"] .profile-chevron {
    color: #374151;
}

.dashboard-layout .user-profile[aria-expanded="true"] .profile-chevron {
    transform: rotate(180deg);
}

/* Dropdown Menu Box */
.dashboard-layout .profile-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 170px;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, .10), 0 8px 10px -6px rgba(0, 0, 0, .06);
    padding: 6px;
    z-index: 1050;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px) scale(0.97);
    transform-origin: top right;
    transition: opacity .16s cubic-bezier(0.16, 1, 0.3, 1), transform .16s cubic-bezier(0.16, 1, 0.3, 1), visibility .16s;
    pointer-events: none;
}

.dashboard-layout .profile-dropdown-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.dashboard-layout .profile-dropdown-divider {
    height: 1px;
    background-color: #F3F4F6;
    margin: 4px 0;
}

/* Dropdown Action Items */
.dashboard-layout .profile-dropdown-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #374151;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
    box-sizing: border-box;
    outline: none;
}

.dashboard-layout .profile-dropdown-item:hover,
.dashboard-layout .profile-dropdown-item:focus-visible {
    background: #F3F4F6;
    color: #111827;
}

.dashboard-layout .profile-dropdown-item .dropdown-item-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    color: #6B7280;
    flex-shrink: 0;
}

.dashboard-layout .profile-dropdown-item .dropdown-item-icon svg {
    width: 18px;
    height: 18px;
}

.dashboard-layout .profile-dropdown-item:hover .dropdown-item-icon {
    color: #111827;
}

/* Danger Item (Logout) */
.dashboard-layout .profile-dropdown-item-danger {
    color: #DC2626;
}

.dashboard-layout .profile-dropdown-item-danger .dropdown-item-icon {
    color: #DC2626;
}

.dashboard-layout .profile-dropdown-item-danger:hover,
.dashboard-layout .profile-dropdown-item-danger:focus-visible {
    background: #FEF2F2;
    color: #B91C1C;
}

.dashboard-layout .profile-dropdown-item-danger:hover .dropdown-item-icon {
    color: #B91C1C;
}

.dashboard-layout .profile-dropdown-item:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.dashboard-layout .profile-dropdown-item.loading {
    opacity: .7;
    pointer-events: none;
}


/* =====================================================
   CONTENT
===================================================== */

.dashboard-layout .content{

    flex:1;
    padding:32px 34px 45px;

}


/* =====================================================
   WELCOME CARD
===================================================== */

.dashboard-layout .welcome-card{

    min-height:185px;

    position:relative;

    overflow:hidden;
    display:flex;
    align-items:center;
    padding:36px 38px;
    margin-bottom:32px;
    border-radius:22px;

    background:
        linear-gradient(
            115deg,
            #123C24 0%,
            #166534 58%,
            #1E7A3D 100%
        );

    color:#FFFFFF;

    box-shadow:
        0 16px 35px rgba(15,61,31,.16);

}


/* Decorative shapes */

.dashboard-layout .welcome-card::before{

    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-80px;
    top:-150px;

}


.dashboard-layout .welcome-card::after{

    content:"";
    position:absolute;
    width:190px;
    height:190px;
    border:1px solid rgba(250,204,21,.13);
    border-radius:50%;
    right:55px;
    bottom:-125px;

}


/* =====================================================
   WELCOME CONTENT
===================================================== */

.dashboard-layout .welcome-content{

    position:relative;
    z-index:2;

}


.dashboard-layout .section-label{

    display:block;
    margin-bottom:8px;
    color:#6B806F;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.7px;

}


.dashboard-layout .welcome-card .section-label{

    color:rgba(255,255,255,.58);

}


.dashboard-layout .welcome-card h2{

    margin:0 0 8px;
    color:#FFFFFF;
    font-size:29px;
    font-weight:750;
    letter-spacing:-.8px;

}


.dashboard-layout .welcome-card p{

    max-width:620px;
    margin:0;
    color:rgba(255,255,255,.76);
    font-size:12px;
    line-height:1.8;

}


/* =====================================================
   WELCOME DECORATION
===================================================== */

.dashboard-layout .welcome-decoration{

    position:absolute;
    inset:0;
    pointer-events:none;

}


.dashboard-layout .decoration-circle{

    position:absolute;
    border-radius:50%;

}


.dashboard-layout .circle-one{

    width:120px;
    height:120px;
    right:120px;
    top:28px;
    border:1px solid rgba(255,255,255,.08);

}


.dashboard-layout .circle-two{

    width:60px;
    height:60px;
    right:160px;
    top:58px;
    background:rgba(250,204,21,.08);

}


/* =====================================================
   SECTION HEADING
===================================================== */

.dashboard-layout .section-heading{

    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:17px;

}


.dashboard-layout .section-heading h2{

    margin:0;
    color:#1C2A21;
    font-size:19px;
    font-weight:750;
    letter-spacing:-.4px;

}


/* =====================================================
   STATISTICS GRID
===================================================== */

.dashboard-layout .stats-grid{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:18px;

}


/* =====================================================
   STAT CARD
===================================================== */

.dashboard-layout .stat-card{

    min-height:142px;
    display:flex;
    align-items:center;
    gap:17px;
    padding:23px;
    position:relative;
    overflow:hidden;
    background:#FFFFFF;

/* ==========================================================================
   BUG 20 REFINED: MODAL PROCESSING OVERLAY & PREMIUM ANIMATED LOADER
   ========================================================================== */

.modal-processing-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    border-radius: inherit;
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
    transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1), transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    padding: 24px;
    box-sizing: border-box;
}

.modal-processing-overlay.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.modal-processing-overlay.closing {
    opacity: 0;
    transform: scale(0.98);
    pointer-events: none;
    transition: opacity 160ms cubic-bezier(0.4, 0, 1, 1), transform 160ms cubic-bezier(0.4, 0, 1, 1);
}

.modal-processing-overlay .premium-loader {
    position: relative;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}

.modal-processing-overlay .loader-ring-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3.5px solid rgba(22, 101, 52, 0.12);
    border-top-color: #166534;
    border-right-color: #22c55e;
    animation: simataPremiumOuter 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}

.modal-processing-overlay .loader-ring-inner {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 2.5px solid rgba(22, 101, 52, 0.08);
    border-bottom-color: #15803d;
    border-left-color: rgba(34, 197, 94, 0.35);
    animation: simataPremiumInner 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
}

.modal-processing-overlay .loader-core-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #166534;
    box-shadow: 0 0 8px rgba(22, 101, 52, 0.35);
    animation: simataCorePulse 1.1s ease-in-out infinite alternate;
}

.modal-processing-overlay .processing-title {
    font-size: 15.5px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
    text-align: center;
}

.modal-processing-overlay .processing-subtitle {
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
    margin: 0;
    text-align: center;
}

@keyframes simataPremiumOuter {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes simataPremiumInner {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes simataCorePulse {
    0% { transform: scale(0.85); opacity: 0.7; }
    100% { transform: scale(1.15); opacity: 1; }
}
