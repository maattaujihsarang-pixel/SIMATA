  /**
   * Auto-bind logo to any existing logo elements in DOM.
   */
  (function initSimataLogos() {
    function applyLogos() {
      var targets = document.querySelectorAll('.school-logo, .sidebar-logo img, [data-simata-asset="logo"]');
      for (var i = 0; i < targets.length; i++) {
        var el = targets[i];

      document.addEventListener('DOMContentLoaded', applyLogos);
    } else {
      applyLogos();
    }
