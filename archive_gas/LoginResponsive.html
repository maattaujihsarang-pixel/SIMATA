html, body {

.login-layout .subtitle {

}

.login-layout .form-group {

}

.login-layout .input-label {

}

.login-layout .input-box {

}

.login-layout .input-box.input-error {

  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
}

.login-layout .input-box.input-error ~ .input-icon {
  color: #EF4444;
}

/* --- Password Toggle Button --- */
.login-layout .password-group {
  position: relative;
  width: 100%;
}

.login-layout .password-group .input-box {
  padding-right: 44px;
}

.login-layout .toggle-password {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: #64748B;
  padding: 0;
  transition: all 0.2s ease;
  z-index: 2;
  touch-action: manipulation;
}

.login-layout .toggle-password:hover {
  color: #166534;
  background: rgba(22, 101, 52, 0.08);
}

/* Pure CSS Eye / Eye-Off Swap based on input type without JS modification */
#password[type="text"] ~ .toggle-password .icon-eye {
  display: none !important;
}

#password[type="text"] ~ .toggle-password .icon-eye-off {
  display: block !important;
}

#password[type="password"] ~ .toggle-password .icon-eye {
  display: block !important;
}

#password[type="password"] ~ .toggle-password .icon-eye-off {
  display: none !important;
}

/* --- Validation Error Messages --- */
.login-layout .error-message {
  font-size: 12px;
  color: #DC2626;
  font-weight: 500;
  margin-top: 2px;
  line-height: 1.3;
  min-height: 0;
  display: none;
}

.login-layout .error-message:not(:empty) {
  display: block;
  margin-top: 3px;
  margin-bottom: 2px;
}

/* --- Options Row (Ingatkan saya & Lupa Password) --- */
.login-layout .login-options-row {

}

}

.login-layout .remember-label:hover {

}

}

}

.login-layout .btn-forgot-password:hover {

}

}

.login-layout .forgot-notice .notice-icon {

  align-items: center;
}

}

/* --- Submit Button --- */
.login-layout .login-button {

}

.login-layout .login-button .btn-icon {

}

.login-layout .login-button:hover {

  box-shadow: 0 6px 16px rgba(22, 101, 52, 0.32);
}

.login-layout .login-button:hover .btn-icon {
  transform: translateX(2px);
}

.login-layout .login-button:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(22, 101, 52, 0.2);
}

.login-layout .login-button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 4px 12px rgba(22, 101, 52, 0.25);
}

.login-layout .login-button:disabled {
  opacity: 0.75;

  transform: none;
  box-shadow: none;
}

/* Button Ripple */
.login-layout .ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: rippleAnim 0.6s linear;
  background: rgba(255, 255, 255, 0.35);
  pointer-events: none;
}

@keyframes rippleAnim {

}

.login-layout .login-footer {

}

/* ==========================================================================

   ========================================================================== */

/* --- Toast --- */
.toast {
  position: fixed;
  top: 24px;
  right: 24px;
  min-width: 320px;
  max-width: 420px;
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 14px;
  box-shadow: 0 20px 30px -8px rgba(15, 23, 42, 0.12), 0 8px 12px -4px rgba(15, 23, 42, 0.06);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-16px);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 99999;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.toast-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  flex-shrink: 0;
}

.toast-content {
  display: flex;
  flex-direction: column;
}

.toast-title {
  font-size: 13.5px;
  font-weight: 700;
  color: #0F172A;
  line-height: 1.3;
}

.toast-message {
  font-size: 12.5px;
  color: #475569;
  margin-top: 2px;
  line-height: 1.4;
}

/* --- Loading Overlay --- */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s ease;
  z-index: 99999;
}

.loading-overlay.show {
  opacity: 1;
  visibility: visible;
}

.loading-overlay .spinner {
  width: 44px;
  height: 44px;
  border: 3.5px solid rgba(255, 255, 255, 0.25);
  border-top-color: #22C55E;
  border-radius: 50%;
  animation: loginSpin 0.75s linear infinite;
}

.loading-overlay p {
  margin-top: 14px;
  color: #FFFFFF;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}

@keyframes loginSpin {
  to {
    transform: rotate(360deg);
  }
}
