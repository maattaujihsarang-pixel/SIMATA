<script>

document.addEventListener("DOMContentLoaded", function() {

    initMobileSidebar();
    initProfileDropdown();
    guardDashboard();

});


/* =========================
   MOBILE SIDEBAR CONTROLLER
========================= */

function initMobileSidebar() {
    const hamburger = document.getElementById('hamburgerBtn');
    const backdrop = document.getElementById('sidebarBackdrop');
    const closeBtn = document.getElementById('sidebarCloseBtn');

    if (hamburger) {
        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMobileSidebar();
        });
    }

    if (backdrop) {
        backdrop.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    // Auto-close off-canvas sidebar when a menu item is clicked on mobile screen (<=768px)
    const menuItems = document.querySelectorAll('.dashboard-layout .sidebar-menu li');
    menuItems.forEach(function(item) {
        item.addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }
        });
    });

    // Close on Escape key press
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeMobileSidebar();
        }
    });
}


/* =========================
   USER PROFILE DROPDOWN CONTROLLER
========================= */

function closeProfileDropdown() {
    const trigger = document.getElementById('profileTrigger');
    const menu = document.getElementById('profileDropdownMenu');
    if (menu) menu.classList.remove('show');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
}

function openProfileDropdown() {
    const trigger = document.getElementById('profileTrigger');
    const menu = document.getElementById('profileDropdownMenu');
    if (menu) menu.classList.add('show');
    if (trigger) trigger.setAttribute('aria-expanded', 'true');
}

function toggleProfileDropdown(e) {
    if (e) {
        e.stopPropagation();
        e.preventDefault();
    }
    const menu = document.getElementById('profileDropdownMenu');
    if (menu && menu.classList.contains('show')) {
        closeProfileDropdown();
    } else {
        openProfileDropdown();
    }
}

function initProfileDropdown() {
    const trigger = document.getElementById('profileTrigger');
    const itemProfil = document.getElementById('profileMenuItemProfil');
    const itemLogout = document.getElementById('logout-button');

    if (trigger) {
        trigger.addEventListener('click', toggleProfileDropdown);
    }

    if (itemProfil) {
        itemProfil.addEventListener('click', function(e) {
            if (e) e.stopPropagation();
            closeProfileDropdown();
            if (window.innerWidth <= 768 && typeof closeMobileSidebar === 'function') {
                closeMobileSidebar();
            }
            showSettingsView('akun');
        });
    }

    if (itemLogout) {
        itemLogout.addEventListener('click', function(e) {
            if (e) e.stopPropagation();
            closeProfileDropdown();
            logoutSIMATA();
        });
    }

    // Click outside dropdown -> close menu
    document.addEventListener('click', function(e) {
        const wrapper = document.getElementById('profileDropdownWrapper');
        if (wrapper && !wrapper.contains(e.target)) {
            closeProfileDropdown();
        }
    });

    // Escape key -> close menu
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.key === 'Esc') {
            closeProfileDropdown();
        }
    });
}


function openMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const hamburger = document.getElementById('hamburgerBtn');
    if (sidebar) sidebar.classList.add('mobile-open');
    if (backdrop) backdrop.classList.add('active');
    if (hamburger) hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const hamburger = document.getElementById('hamburgerBtn');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (backdrop) backdrop.classList.remove('active');
    if (hamburger) hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
}

function toggleMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    if (sidebar && sidebar.classList.contains('mobile-open')) {
        closeMobileSidebar();
    } else {
        openMobileSidebar();
    }
}


/* =========================
   TOAST NOTIFICATION HELPER
========================= */

function showToast(type, title, message) {
    const toast = document.getElementById("toast");
    const icon = document.getElementById("toastIcon");
    const toastTitle = document.getElementById("toastTitle");
    const toastMessage = document.getElementById("toastMessage");

    if (!toast) return;

    if (toastTitle) toastTitle.textContent = title || "";
    if (toastMessage) toastMessage.textContent = message || "";

    if (icon) {
        if (type === "success") {
            icon.innerHTML = "✔";
            icon.style.background = "#E8F5E9";
            icon.style.color = "#2E7D32";
        } else if (type === "warning" || type === "info") {
            icon.innerHTML = "ℹ";
            icon.style.background = "#FEF3C7";
            icon.style.color = "#D97706";
        } else {
            icon.innerHTML = "✖";
            icon.style.background = "#FDECEC";
            icon.style.color = "#D32F2F";
        }
    }

    toast.classList.add("show");

    if (window._toastTimeout) {
        clearTimeout(window._toastTimeout);
    }

    window._toastTimeout = setTimeout(function() {
        toast.classList.remove("show");
    }, 3000);
}


/* =========================
   GLOBAL LOADING HELPERS (BUG 20)
========================= */

function showGlobalLoading(message) {
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) {
        overlay.classList.add('show');
        const txt = document.getElementById('globalLoadingText');
        if (txt && message) txt.textContent = message;
    }
}

function hideGlobalLoading() {
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) {
        overlay.classList.remove('show');
    }
}

function renderTableLoading(tbodyOrId, colspan, message) {
    const tbody = typeof tbodyOrId === 'string' ? document.getElementById(tbodyOrId) : tbodyOrId;
    if (!tbody) return;
    const col = colspan || 8;
    const msg = message || 'Memuat data...';
    tbody.innerHTML = '<tr><td colspan="' + col + '" style="text-align:center;padding:32px 16px;">' +
        '<div style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">' +
            '<div class="simata-loading-spinner" aria-hidden="true"></div>' +
            '<span style="font-size:0.875rem;color:#64748b;font-weight:500;">' + msg + '</span>' +
        '</div>' +
    '</td></tr>';
}

function setButtonLoading(btnOrId, isLoading, loadingText, defaultText) {
    const btn = typeof btnOrId === 'string' ? document.getElementById(btnOrId) : btnOrId;
    if (!btn) return;

    if (isLoading) {
        // Prevent double submit & guard original html strictly on first invocation
        if (!btn.dataset.originalHtml && btn.dataset.isLoading !== 'true') {
            btn.dataset.originalHtml = btn.innerHTML;
        }
        btn.dataset.isLoading = 'true';
        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        const text = loadingText || 'Menyimpan...';
        btn.innerHTML = '<span class="btn-spinner-icon" aria-hidden="true"></span>' + text;
    } else {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        if (btn.dataset.originalHtml) {
            btn.innerHTML = btn.dataset.originalHtml;
            delete btn.dataset.originalHtml;
        } else if (defaultText) {
            btn.innerHTML = defaultText;
        }
        delete btn.dataset.isLoading;
    }
}

function showModalProcessing(modalOrId, title, subtitle) {
    let modalEl = typeof modalOrId === 'string' ? document.getElementById(modalOrId) : modalOrId;
    if (!modalEl) return null;

    let cardEl = modalEl.querySelector('.student-modal-card, .modal-card, .settings-panel-card') || modalEl;

    if (window.getComputedStyle && window.getComputedStyle(cardEl).position === 'static') {
        cardEl.style.position = 'relative';
    }

    let overlay = cardEl.querySelector('.modal-processing-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'modal-processing-overlay';
        overlay.setAttribute('role', 'status');
        overlay.setAttribute('aria-live', 'polite');
        overlay.innerHTML =
            '<div class="premium-loader" aria-hidden="true">' +
                '<div class="loader-ring-outer"></div>' +
                '<div class="loader-ring-inner"></div>' +
                '<div class="loader-core-dot"></div>' +
            '</div>' +
            '<div class="processing-title"></div>' +
            '<div class="processing-subtitle"></div>';
        cardEl.appendChild(overlay);
    }

    const titleEl = overlay.querySelector('.processing-title');
    const subEl = overlay.querySelector('.processing-subtitle');
    if (titleEl) titleEl.textContent = title || 'Menyimpan...';
    if (subEl) subEl.textContent = subtitle || 'Mohon tunggu sebentar...';

    cardEl.setAttribute('aria-busy', 'true');
    const interactiveEls = cardEl.querySelectorAll('input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])');
    const lockedEls = [];
    interactiveEls.forEach(function(el) {
        if (el !== overlay && !overlay.contains(el)) {
            el.disabled = true;
            lockedEls.push(el);
        }
    });
    overlay._lockedElements = lockedEls;

    overlay.classList.remove('closing');
    if (typeof overlay.offsetWidth === 'number') {
        void overlay.offsetWidth;
    }
    overlay.classList.add('active');

    return overlay;
}

function hideModalProcessing(modalOrId) {
    let modalEl = typeof modalOrId === 'string' ? document.getElementById(modalOrId) : modalOrId;
    if (!modalEl) return;

    let cardEl = modalEl.querySelector('.student-modal-card, .modal-card, .settings-panel-card') || modalEl;
    if (cardEl && cardEl.removeAttribute) {
        cardEl.removeAttribute('aria-busy');
    }

    let overlay = cardEl ? cardEl.querySelector('.modal-processing-overlay') : null;
    if (!overlay) return;

    if (overlay._lockedElements && overlay._lockedElements.length > 0) {
        overlay._lockedElements.forEach(function(el) {
            el.disabled = false;
        });
        delete overlay._lockedElements;
    }

    overlay.classList.remove('active');
    overlay.classList.add('closing');

    setTimeout(function() {
        if (overlay.classList.contains('closing')) {
            overlay.classList.remove('closing');
            if (overlay.parentNode) {
                overlay.parentNode.removeChild(overlay);
            }
        }
    }, 180);
}


/* =========================
   DASHBOARD GUARD
========================= */

function guardDashboard() {

    const token = sessionStorage.getItem("SIMATA_TOKEN");

    if (!token) {
        console.warn("[SIMATA AUTH] Token tidak ditemukan. Redirect ke login.");
        hideGlobalLoading();
        redirectToLogin();
        return;
    }

    console.warn("[SIMATA AUTH] Token ditemukan, validasi session...");
    showGlobalLoading("Memverifikasi sesi...");

    simataClient
        .withSuccessHandler(function(result) {
            if (!result || result.valid !== true) {
                console.warn("[SIMATA AUTH] Session tidak valid. Redirect ke login.");
                sessionStorage.removeItem("SIMATA_TOKEN");
                hideGlobalLoading();
                redirectToLogin();
                return;
            }

            console.log("[SIMATA AUTH] Session valid. Dashboard diizinkan.");
            showDashboard();
            initDashboard();
            // initialize students & teachers modules
            try { initStudentsModule(); } catch (e) {}
            try { initTeachersModule(); } catch (e) {}
            try { initClassesModule(); } catch (e) {}
            try { initGradesModule(); } catch (e) {}
            try { initAttendanceModule(); } catch (e) {}
            // Teacher Attendance module will be initialized after dashboard data loads (role-based)
            startLiveClock();
            initDashboardSessionCheck();
        })
        .withFailureHandler(function(error) {
            console.error("[SIMATA AUTH] Gagal memvalidasi session:", error);
            sessionStorage.removeItem("SIMATA_TOKEN");
            hideGlobalLoading();
            redirectToLogin();
        })
        .validateSession(token);

}

let isCurrentUserAdmin = false;

function showDashboard() {
    document.body.style.display = "";
}


/* =========================
   DASHBOARD INIT
========================= */

function initDashboard() {

    const menuDashboard = document.getElementById('menu-dashboard');
    if (menuDashboard) {
        menuDashboard.addEventListener('click', function() {
            showDashboardView();
        });
    }

    loadDashboard();

}

// Attach additional UI handlers for pages (Students)
let allLoadedStudents = [];
let loadedClassesList = [];
let studentClassMap = {};

function initStudentsModule() {
    const menuStudents = document.getElementById('menu-students');
    if (menuStudents) {
        menuStudents.addEventListener('click', function() {
            showStudentsView();
        });
    }

    const addBtn = document.getElementById('addStudentButton');
    if (addBtn) {
        addBtn.addEventListener('click', function() { openStudentModal('create'); });
    }

    const batchBtn = document.getElementById('batchQrButton');
    if (batchBtn) {
        batchBtn.addEventListener('click', openBatchQrModal);
    }

    const searchInput = document.getElementById('studentSearch');
    if (searchInput) {
        let timer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(applyStudentFilters, 250);
        });
    }

    const classFilter = document.getElementById('studentClassFilter');
    if (classFilter) {
        classFilter.addEventListener('change', applyStudentFilters);
    }

    // Modal buttons
    const cancelBtn = document.getElementById('studentCancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', closeStudentModal);

    const saveBtn = document.getElementById('studentSaveBtn');
    if (saveBtn) saveBtn.addEventListener('click', saveStudentFromModal);
}

function showStudentsView() {
    hideAllViews();
    document.getElementById('studentsContent').style.display = '';
    // highlight menu
    document.querySelectorAll('.sidebar-menu li').forEach(function(li){ li.classList.remove('active'); });
    const menu = document.getElementById('menu-students'); if (menu) menu.classList.add('active');
    loadStudents();
}

function hideStudentsView() {
    document.getElementById('studentsContent').style.display = 'none';
    document.getElementById('dashboardContent').style.display = '';
    // restore dashboard menu active state
    document.querySelectorAll('.sidebar-menu li').forEach(function(li){ li.classList.remove('active'); });
    document.querySelector('.sidebar-menu li').classList.add('active');
}

function setStudentClassFilter(classId) {
    const select = document.getElementById('studentClassFilter');
    if (select) {
        select.value = classId || '';
        applyStudentFilters();
    }
}

function applyStudentFilters() {
    const tbody = document.getElementById('studentsTbody');
    if (!tbody) return;

    const searchInput = document.getElementById('studentSearch');
    const q = (searchInput ? searchInput.value : '').trim().toLowerCase();

    const classSelect = document.getElementById('studentClassFilter');
    const selectedClassId = classSelect ? classSelect.value : '';

    const countText = document.getElementById('studentFilterCountText');
    const summaryChips = document.getElementById('studentClassSummaryChips');

    // Calculate class counts across full dataset & render summary chips
    if (summaryChips && Array.isArray(loadedClassesList)) {
        summaryChips.innerHTML = loadedClassesList.map(function(c) {
            const count = allLoadedStudents.filter(function(s) { return s.classId === c.classId; }).length;
            const isSelected = selectedClassId === c.classId;
            const activeClass = isSelected ? ' active' : '';
            return '<button type="button" class="class-summary-chip' + activeClass + '" onclick="setStudentClassFilter(\'' + escapeAttr(c.classId) + '\')" title="Klik untuk memfilter ' + escapeHtml(c.className || c.classId) + '">' +
                '<span class="chip-label">' + escapeHtml(c.className || c.classId) + '</span>' +
                '<span class="chip-badge">' + count + '</span>' +
                '</button>';
        }).join('');
    }

    // Filter students in-memory
    let filtered = allLoadedStudents.slice();

    if (selectedClassId) {
        filtered = filtered.filter(function(s) {
            return s.classId === selectedClassId;
        });
    }

    if (q) {
        filtered = filtered.filter(function(s) {
            return (s.studentId || '').toLowerCase().includes(q) ||
                (s.name || '').toLowerCase().includes(q) ||
                (s.nis || '').toLowerCase().includes(q) ||
                (s.nisn || '').toLowerCase().includes(q);
        });
    }

    // Update count display
    if (countText) {
        if (selectedClassId) {
            countText.textContent = 'Menampilkan: ' + filtered.length + ' siswa';
        } else {
            countText.textContent = 'Total: ' + allLoadedStudents.length + ' siswa';
        }
    }

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">Tidak ada data siswa yang sesuai.</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(function(s, idx) {
        const no = idx + 1;
        const nis = escapeHtml(s.nis || '-');
        const nisn = escapeHtml(s.nisn || '-');
        const name = escapeHtml(s.name || '-');
        const gender = escapeHtml(s.gender || '-');
        const className = escapeHtml((studentClassMap && studentClassMap[s.classId]) || s.classId || '-');
        const status = (s.status || 'Active');
        const statusBadge = (status.toLowerCase() === 'active' || status.toLowerCase() === 'aktif')
            ? '<span class="status-badge status-badge-active">Aktif</span>'
            : '<span class="status-badge status-badge-inactive">Tidak Aktif</span>';

        return '<tr class="simata-table-row">' +
            '<td style="padding:10px 8px;text-align:center;color:#64748b;font-size:12.5px;">' + no + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;font-family:monospace;color:#334155;">' + nis + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;font-family:monospace;color:#334155;">' + nisn + '</td>' +
            '<td style="padding:10px 14px;text-align:left;font-size:13px;font-weight:600;color:#0f172a;">' + name + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + gender + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + className + '</td>' +
            '<td style="padding:10px 8px;text-align:center;">' + statusBadge + '</td>' +
            '<td style="padding:10px 12px;text-align:center;">' +
              '<div class="student-action-group" style="justify-content:center;">' +
                (isCurrentUserAdmin ? '<button type="button" class="btn-action btn-action-edit" onclick="openStudentModal(\'edit\', \'' + escapeAttr(s.studentId) + '\')" title="Edit Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                  '<span>Edit</span>' +
                '</button>' : '') +
                '<button type="button" class="btn-action btn-action-detail" onclick="openStudentModal(\'view\', \'' + escapeAttr(s.studentId) + '\')" title="Detail Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
                  '<span>Detail</span>' +
                '</button>' +
                '<button type="button" class="btn-action btn-action-qr" onclick="showStudentQrModal(\'' + escapeAttr(s.studentId) + '\')" title="Lihat QR Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
                  '<span>QR</span>' +
                '</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
    }).join('');
}

function loadStudents(filter) {
    const tbody = document.getElementById('studentsTbody');
    if (!tbody) return;
    renderTableLoading(tbody, 8, 'Memuat data siswa...');

    // load classes for class select and class name mapping
    simataClient.withSuccessHandler(function(classesRes) {
        if (classesRes && classesRes.success && Array.isArray(classesRes.classes)) {
            loadedClassesList = classesRes.classes;
            studentClassMap = {};
            classesRes.classes.forEach(function(c) {
                studentClassMap[c.classId] = c.className || c.classId;
            });

            const modalSelect = document.getElementById('f_classId');
            if (modalSelect) {
                modalSelect.innerHTML = '<option value="">(Pilih Kelas)</option>' + classesRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + '</option>';
                }).join('');
            }

            const filterSelect = document.getElementById('studentClassFilter');
            if (filterSelect) {
                const currentVal = filterSelect.value;
                filterSelect.innerHTML = '<option value="">Semua Kelas</option>' + classesRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + '</option>';
                }).join('');
                filterSelect.value = currentVal || '';
            }
        }
    }).withFailureHandler(function() { /* ignore */ }).getClasses();

    simataClient.withSuccessHandler(function(result) {
        if (!result || !result.success) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat data siswa.</td></tr>';
            return;
        }

        allLoadedStudents = result.students || [];
        applyStudentFilters();
    }).withFailureHandler(function() {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat data siswa.</td></tr>';
    }).getStudents(filter ? { search: filter } : {});
}

function openStudentModal(mode, studentId) {
    const modal = document.getElementById('studentModal');
    if (!modal) return;
    const title = document.getElementById('studentModalTitle');
    const idField = document.getElementById('f_studentId');
    const qrField = document.getElementById('f_qrCodeId');

    // reset fields
    ['f_studentId','f_nis','f_nisn','f_name','f_gender','f_classId','f_status','f_birthDate','f_qrCodeId'].forEach(function(fid) {
        const el = document.getElementById(fid);
        if (el) el.value = '';
    });

    if (mode === 'create') {
        title.textContent = 'Tambah Siswa';
        idField.disabled = true; idField.value = '';
        if (qrField) { qrField.disabled = true; qrField.value = ''; }
        modal.style.display = 'flex';
        return;
    }

    title.textContent = 'Edit Siswa';
    simataClient.withSuccessHandler(function(res) {
        if (!res || !res.success) {
            alert('Data siswa tidak ditemukan.');
            return;
        }
        const s = res.student;
        idField.value = s.studentId || '';
        idField.disabled = true;
        document.getElementById('f_nis').value = s.nis || '';
        document.getElementById('f_nisn').value = s.nisn || '';
        document.getElementById('f_name').value = s.name || '';
        document.getElementById('f_gender').value = s.gender || '';
        document.getElementById('f_classId').value = s.classId || '';
        document.getElementById('f_status').value = s.status || 'Active';
        document.getElementById('f_birthDate').value = s.birthDate || '';
        if (qrField) { qrField.value = s.qrCodeId || ''; qrField.disabled = true; }
        modal.style.display = 'flex';
    }).withFailureHandler(function(){ alert('Gagal memuat data siswa.'); }).getStudentById(studentId);
}

function closeStudentModal() {
    const m = document.getElementById('studentModal');
    if (m && m.querySelector('.modal-processing-overlay.active')) return;
    if (m) m.style.display = 'none';
}

function saveStudentFromModal() {
    const id = document.getElementById('f_studentId').value.trim();
    const nis = document.getElementById('f_nis').value.trim();
    const nisn = document.getElementById('f_nisn').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const gender = document.getElementById('f_gender').value;
    const classId = document.getElementById('f_classId').value;
    const status = document.getElementById('f_status').value;
    const birthDate = document.getElementById('f_birthDate').value;
    const qrCodeId = document.getElementById('f_qrCodeId').value.trim();

    if (!name) { alert('Name wajib diisi.'); return; }
    if (!classId) { alert('Class harus dipilih.'); return; }

    const payload = { studentId: id, nis: nis, nisn: nisn, name: name, gender: gender, classId: classId, status: status, birthDate: birthDate, qrCodeId: qrCodeId };

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) { alert("Sesi login tidak valid. Silakan login kembali."); return; }

    const saveBtn = document.getElementById('studentSaveBtn');
    setButtonLoading(saveBtn, true, 'Menyimpan...', 'Simpan');
    showModalProcessing('studentModal', id ? 'Menyimpan Perubahan Siswa...' : 'Menambahkan Siswa...', 'Mohon tunggu sebentar...');

    if (id) {
        // exists -> update
        simataClient.withSuccessHandler(function(uRes){
            hideModalProcessing('studentModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            if (uRes && uRes.success) {
                closeStudentModal(); loadStudents();
                showToast("success", "Berhasil", "Data siswa berhasil diperbarui");
            } else {
                alert((uRes && uRes.message) || 'Gagal memperbarui siswa.');
            }
        }).withFailureHandler(function(){
            hideModalProcessing('studentModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            alert('Gagal memperbarui siswa.');
        }).updateStudent(token, id, payload);
    } else {
        // create -> server generates studentId & qrCodeId
        simataClient.withSuccessHandler(function(cRes){
            hideModalProcessing('studentModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            if (cRes && cRes.success) {
                closeStudentModal(); loadStudents();
                showToast("success", "Berhasil", "Siswa berhasil ditambahkan.");
            } else {
                alert((cRes && cRes.message) || 'Gagal menambahkan siswa.');
            }
        }).withFailureHandler(function(){
            hideModalProcessing('studentModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            alert('Gagal menambahkan siswa.');
        }).createStudent(token, payload);
    }
}

let currentPreviewStudent = null;

function showStudentQrModal(studentId) {

        .withSuccessHandler(function(res) {

            const s = res.student;

let batchLoadedStudents = [];
let batchClassMap = {};

function openBatchQrModal() {
    const modal = document.getElementById('batchQrModal');
    if (!modal) return;

    const select = document.getElementById('batchClassSelect');
    const countBadge = document.getElementById('batchCountBadge');
    const warnNotice = document.getElementById('batchWarningNotice');
    const readyNotice = document.getElementById('batchReadyNotice');
    const emptyNotice = document.getElementById('batchPreviewEmpty');
    const grid = document.getElementById('batchPreviewGrid');
    const printBtn = document.getElementById('printBatchBtn');

    if (select) select.innerHTML = '<option value="">Memuat daftar kelas...</option>';
    if (countBadge) countBadge.textContent = '0 siswa';
    if (warnNotice) { warnNotice.style.display = 'none'; warnNotice.textContent = ''; }
    if (readyNotice) readyNotice.textContent = '';
    if (emptyNotice) { emptyNotice.style.display = 'block'; emptyNotice.textContent = 'Silakan pilih kelas dan klik Tampilkan QR untuk memuat pratinjau kartu.'; }
    if (grid) { grid.style.display = 'none'; grid.innerHTML = ''; }
    if (printBtn) printBtn.disabled = true;

    batchLoadedStudents = [];
    batchClassMap = {};

    modal.style.display = 'flex';

    // Fetch classes and students in parallel
    simataClient
        .withSuccessHandler(function(classRes) {
            if (!classRes || !classRes.success || !Array.isArray(classRes.classes)) {
                if (select) select.innerHTML = '<option value="">Gagal memuat kelas</option>';
                return;
            }

            batchClassMap = {};
            classRes.classes.forEach(function(c) {
                batchClassMap[c.classId] = c.className || c.classId;
            });

            if (select) {
                select.innerHTML = '<option value="">(Pilih Kelas)</option>' + classRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + ' (' + escapeHtml(c.classId) + ')</option>';
                }).join('');
            }

            // Also load students for quick count calculation
            simataClient
                .withSuccessHandler(function(sRes) {
                    if (sRes && sRes.success && Array.isArray(sRes.students)) {
                        batchLoadedStudents = sRes.students;
                    }
                })
                .getStudents();
        })
        .withFailureHandler(function() {
            if (select) select.innerHTML = '<option value="">Gagal memuat kelas</option>';
        })
        .getClasses();
}

function closeBatchQrModal() {
    const modal = document.getElementById('batchQrModal');
    if (modal) modal.style.display = 'none';
}

function renderBatchQrPreview() {
    const select = document.getElementById('batchClassSelect');
    const classId = select ? select.value : '';
    const warnNotice = document.getElementById('batchWarningNotice');
    const readyNotice = document.getElementById('batchReadyNotice');
    const emptyNotice = document.getElementById('batchPreviewEmpty');
    const grid = document.getElementById('batchPreviewGrid');
    const printBtn = document.getElementById('printBatchBtn');
    const countBadge = document.getElementById('batchCountBadge');

    if (!classId) {
        alert('Silakan pilih kelas terlebih dahulu.');
        return;
    }

    if (warnNotice) { warnNotice.style.display = 'none'; warnNotice.textContent = ''; }
    if (emptyNotice) { emptyNotice.style.display = 'block'; emptyNotice.textContent = 'Memuat data siswa kelas...'; }
    if (grid) { grid.style.display = 'none'; grid.innerHTML = ''; }
    if (printBtn) printBtn.disabled = true;

    // Fresh fetch of students to ensure latest state
    simataClient
        .withSuccessHandler(function(res) {
            if (!res || !res.success || !Array.isArray(res.students)) {
                if (emptyNotice) emptyNotice.textContent = 'Gagal memuat daftar siswa.';
                return;
            }

            batchLoadedStudents = res.students;
            const classStudents = batchLoadedStudents.filter(function(s) {
                return s.classId === classId;
            });

            if (countBadge) countBadge.textContent = classStudents.length + ' siswa';

            if (classStudents.length === 0) {
                if (emptyNotice) {
                    emptyNotice.style.display = 'block';
                    emptyNotice.textContent = 'Tidak ada siswa yang terdaftar pada kelas ini.';
                }
                return;
            }

            const validStudents = [];
            const invalidStudents = [];

            classStudents.forEach(function(s) {
                if (s.qrCodeId && String(s.qrCodeId).trim() !== '') {
                    validStudents.push(s);
                } else {
                    invalidStudents.push(s);
                }
            });

            if (invalidStudents.length > 0 && warnNotice) {
                warnNotice.style.display = 'block';
                warnNotice.textContent = invalidStudents.length + ' siswa dalam kelas ini belum memiliki QR Code ID dan tidak disertakan dalam pratinjau/cetak (' + invalidStudents.map(function(s){ return s.name; }).join(', ') + ').';
            }

            if (validStudents.length === 0) {
                if (emptyNotice) {
                    emptyNotice.style.display = 'block';
                    emptyNotice.textContent = 'Seluruh siswa pada kelas ini belum memiliki QR Code ID.';
                }
                return;
            }

            if (emptyNotice) emptyNotice.style.display = 'none';
            if (grid) {
                grid.style.display = 'grid';
                grid.innerHTML = '';
            }

            const classNameStr = batchClassMap[classId] || classId;

            validStudents.forEach(function(s, idx) {
                const card = document.createElement('div');
                card.className = 'batch-qr-card-preview';
                card.style.background = '#ffffff';
                card.style.border = '1px solid #cbd5e1';
                card.style.borderRadius = '8px';
                card.style.padding = '12px';
                card.style.textAlign = 'center';
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.style.alignItems = 'center';
                card.style.boxShadow = '0 1px 3px rgba(0,0,0,0.05)';

                const qrBox = document.createElement('div');
                qrBox.id = 'batch_qr_box_' + idx;
                qrBox.style.width = '140px';
                qrBox.style.height = '140px';
                qrBox.style.display = 'flex';
                qrBox.style.alignItems = 'center';
                qrBox.style.justifyContent = 'center';
                qrBox.style.marginBottom = '8px';

                card.appendChild(qrBox);

                const infoBox = document.createElement('div');
                infoBox.style.width = '100%';
                infoBox.style.fontSize = '0.8rem';
                infoBox.style.color = '#334155';
                infoBox.style.lineHeight = '1.4';
                infoBox.innerHTML = '<div style="font-weight:700;font-size:0.85rem;color:#0f172a;margin-bottom:2px;word-break:break-word;">' + escapeHtml(s.name) + '</div>' +
                    '<div><strong>ID:</strong> ' + escapeHtml(s.studentId) + ' | <strong>Kelas:</strong> ' + escapeHtml(classNameStr) + '</div>' +
                    '<div style="font-family:monospace;font-weight:600;color:#2563eb;font-size:0.8rem;margin-top:2px;">' + escapeHtml(s.qrCodeId) + '</div>';

                card.appendChild(infoBox);
                grid.appendChild(card);

                // Render QRCode using QRCode.js
                try {
                    new QRCode(qrBox, {
                        text: String(s.qrCodeId).trim(),
                        width: 140,
                        height: 140,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    console.error('Error rendering QR for student:', s.studentId, e);
                    qrBox.innerHTML = '<span style="color:#ef4444;font-size:0.75rem;">Gagal Render</span>';
                }
            });

            if (readyNotice) {
                readyNotice.textContent = validStudents.length + ' kartu siap dicetak.';
            }
            if (printBtn) {
                printBtn.disabled = false;
            }
        })
        .withFailureHandler(function() {
            if (emptyNotice) emptyNotice.textContent = 'Gagal menghubungi server untuk memuat siswa.';
        })
        .getStudents();
}

function escapeHtml(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>\"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function escapeAttr(s) { return (s||'').replace(/'/g, "\\'"); }

function loadTeachers(filter) {
    const tbody = document.getElementById('teachersTbody'); if (!tbody) return;
    renderTableLoading(tbody, 8, 'Memuat data guru...');

    simataClient.withSuccessHandler(function(result){
        if (!result || !result.success) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat guru.</td></tr>';
            return;
        }

        let teachers = result.teachers || [];
        if (filter) {
            const q = filter.toLowerCase();
            teachers = teachers.filter(function(t){
                return (t.teacherId||'').toLowerCase().includes(q) ||
                       (t.nik||'').toLowerCase().includes(q) ||
                       (t.name||'').toLowerCase().includes(q) ||
                       (t.gender||'').toLowerCase().includes(q) ||
                       (t.nip||'').toLowerCase().includes(q) ||
                       (t.nuptk||'').toLowerCase().includes(q) ||
                       (t.position||'').toLowerCase().includes(q) ||
                       (t.subject||'').toLowerCase().includes(q) ||
                       (t.village||'').toLowerCase().includes(q) ||
                       (t.district||'').toLowerCase().includes(q) ||
                       (t.regency||'').toLowerCase().includes(q);
            });
        }

        if (teachers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">Tidak ada data guru yang sesuai.</td></tr>';
            return;
        }

        tbody.innerHTML = teachers.map(function(t, idx){
            const no = idx + 1;
            const nik = escapeHtml(t.nik || '-');
            const name = escapeHtml(t.name || '-');
            let genderText = '-';
            if (t.gender) {
                const g = String(t.gender).trim().toUpperCase();
                if (g === 'L' || g === 'LAKI-LAKI' || g === 'LAKI LAKI') genderText = 'L';
                else if (g === 'P' || g === 'PEREMPUAN') genderText = 'P';
                else genderText = escapeHtml(t.gender);
            }
            const position = escapeHtml(t.position || '-');
            const subject = escapeHtml(t.subject || '-');
            const status = (t.status || 'Active');
            const statusBadge = (status.toLowerCase() === 'active' || status.toLowerCase() === 'aktif')
                ? '<span class="status-badge status-badge-active">Aktif</span>'
                : '<span class="status-badge status-badge-inactive">Tidak Aktif</span>';

            return '<tr class="simata-table-row">' +
                '<td style="padding:10px 8px;text-align:center;color:#64748b;font-size:12.5px;">' + no + '</td>' +
                '<td style="padding:10px 10px;text-align:center;font-size:12.5px;color:#334155;font-family:monospace;">' + nik + '</td>' +
                '<td style="padding:10px 14px;text-align:left;font-size:13px;font-weight:600;color:#0f172a;">' + name + '</td>' +
                '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + genderText + '</td>' +
                '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + position + '</td>' +
                '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + subject + '</td>' +
                '<td style="padding:10px 8px;text-align:center;">' + statusBadge + '</td>' +
                '<td style="padding:10px 12px;text-align:center;">' +
                  '<div class="student-action-group" style="justify-content:center;">' +
                    (isCurrentUserAdmin ? '<button type="button" class="btn-action btn-action-edit" onclick="openTeacherModal(\'edit\', \'' + escapeAttr(t.teacherId) + '\')" title="Edit Guru">' +
                      '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                      '<span>Edit</span>' +
                    '</button>' : '') +
                    '<button type="button" class="btn-action btn-action-detail" onclick="openTeacherModal(\'view\', \'' + escapeAttr(t.teacherId) + '\')" title="Detail Guru">' +
                      '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
                      '<span>Detail</span>' +
                    '</button>' +
                  '</div>' +
                '</td>' +
              '</tr>';
        }).join('');

    }).withFailureHandler(function(){
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat guru.</td></tr>';
    }).getTeachers();
}

        't_position', 't_subject', 't_teachingHours', 't_status'
    ];

    if (mode === 'create') {
        title.textContent = 'Tambah Guru';
        teacherInputIds.forEach(function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            if (id === 't_status') {
                el.value = 'Active';
            } else {
                el.value = '';
            }
            el.disabled = false;
        });

        if (saveBtn) { saveBtn.style.display = ''; saveBtn.disabled = false; saveBtn.textContent = 'Simpan'; }
        if (cancelBtn) cancelBtn.textContent = 'Batal';
        modal.style.display = 'flex';
        return;
    }

    if (!teacherId) return;
    const isView = (mode === 'view');
    title.textContent = isView ? 'Detail Guru' : 'Edit Guru';

    simataClient.withSuccessHandler(function(res){
        if (!res || !res.success || !res.teacher) { alert('Data guru tidak ditemukan.'); return; }
        const t = res.teacher;

        teacherInputIds.forEach(function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const fieldName = id.replace(/^t_/, '');
            el.value = (t[fieldName] !== undefined && t[fieldName] !== null) ? t[fieldName] : '';
            el.disabled = isView;
        });

        if (saveBtn) {
            saveBtn.style.display = isView ? 'none' : '';
            saveBtn.disabled = false;
            saveBtn.textContent = 'Simpan';
        }
        if (cancelBtn) cancelBtn.textContent = isView ? 'Tutup' : 'Batal';

        modal.style.display = 'flex';
    }).withFailureHandler(function(){
        alert('Gagal memuat data guru.');
    }).getTeacherById(teacherId);

let currentPreviewClass = null;
let currentBatchRosterData = null;

function showClassQrModal(classId) {
    if (!classId) return;

    simataClient
        .withSuccessHandler(function(res) {
            if (!res || !res.success || !res.class) {
                alert((res && res.message) || 'Data kelas tidak ditemukan.');
                return;
            }
            const c = res.class;
            currentPreviewClass = c;

            const nameEl = document.getElementById('cqr_className');
            if (nameEl) nameEl.textContent = c.className || '-';
            const lvlEl = document.getElementById('cqr_level');
            if (lvlEl) lvlEl.textContent = c.level || '-';
            const ayEl = document.getElementById('cqr_academicYear');
            if (ayEl) ayEl.textContent = c.academicYear || '-';
            const htEl = document.getElementById('cqr_homeroomTeacher');
            if (htEl) htEl.textContent = c.homeroomTeacherId || '-';

            const qrContainer = document.getElementById('classQrContainer');
            if (qrContainer) {
                qrContainer.innerHTML = '';
                // Locked constraint: QR Payload {"type":"class","classId":"<classId>"}
                const payload = JSON.stringify({ type: "class", classId: c.classId });
                try {
                    new QRCode(qrContainer, {
                        text: payload,
                        width: 180,
                        height: 180,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (err) {
                    console.error('Error generating Class QR code:', err);
                    qrContainer.innerHTML = '<span style="color:#ef4444;">Gagal membuat QR Code Kelas.</span>';
                }
            }

            const modal = document.getElementById('classQrModal');
            if (modal) modal.style.display = 'flex';
        })
        .withFailureHandler(function() {
            alert('Gagal memuat data kelas untuk QR.');
        })
        .getClassById(classId);
}

    const modal = document.getElementById('classQrModal');
    if (modal) modal.style.display = 'none';
    currentPreviewClass = null;

function getSelectedBatchPeriods() {
    const checked = Array.from(document.querySelectorAll('input[name="batch_period"]:checked, .batch-period-checkbox:checked'));
    const uniquePeriods = Array.from(new Set(checked.map(function(cb) { return cb.value.trim(); })))
        .filter(function(v) { return /^(?:[1-9]|10)$/.test(v); })
        .sort(function(a, b) { return Number(a) - Number(b); });
    return uniquePeriods;
}

function setBatchPeriodCheckboxes(periods) {
    const targetArr = Array.isArray(periods) ? periods : (periods ? [periods] : []);
    const targetSet = new Set(targetArr.map(function(p) { return String(p).trim(); }));
    const cbs = document.querySelectorAll('input[name="batch_period"], .batch-period-checkbox');
    cbs.forEach(function(cb) {
        cb.checked = targetSet.has(cb.value.trim());
    });
    updateBatchPeriodDisplay();
}

function toggleAllBatchPeriods(selectAll) {
    const cbs = document.querySelectorAll('input[name="batch_period"], .batch-period-checkbox');
    cbs.forEach(function(cb) {
        cb.checked = !!selectAll;
    });
    updateBatchPeriodDisplay();
}

function handleBatchPeriodChange() {
    updateBatchPeriodDisplay();
}

function updateBatchPeriodDisplay() {
    const selected = getSelectedBatchPeriods();
    const noticeEl = document.getElementById('batchPeriodSelectedNotice');
    const subtitleEl = document.getElementById('batchAttModalSubtitle');

    if (noticeEl) {
        if (selected.length === 0) {
            noticeEl.textContent = 'Belum dipilih (Pilih min. 1)';
            noticeEl.style.backgroundColor = '#fee2e2';
            noticeEl.style.color = '#dc2626';
        } else if (selected.length === 10) {
            noticeEl.textContent = 'Jam ke-1 s.d. 10 (Semua)';
            noticeEl.style.backgroundColor = '#d1fae5';
            noticeEl.style.color = '#059669';
        } else {
            noticeEl.textContent = selected.map(function(p) { return 'Jam ke-' + p; }).join(', ');
            noticeEl.style.backgroundColor = '#d1fae5';
            noticeEl.style.color = '#059669';
        }
    }

    if (subtitleEl && currentBatchRosterData) {
        const periodStr = selected.length > 0 ? selected.join(', ') : '-';
        subtitleEl.textContent = 'Tanggal: ' + (currentBatchRosterData.date || '-') + 
            ' | Tahun Ajaran: ' + ((currentBatchRosterData.class && currentBatchRosterData.class.academicYear) || '-') + 
            ' | Jam Pelajaran: ' + periodStr;
    }
}

function renderBatchClassAttendanceRoster(data) {
    currentBatchRosterData = data;

    const modalTitle = document.getElementById('batchAttModalTitle');
    if (modalTitle) modalTitle.textContent = 'Presensi ' + (data.class.className || data.class.classId);

    // Initial periods: priority to active responder session, else data.periods, else fallback ["1"]
    let initialPeriods = [];
    if (typeof responderLockedPeriods !== 'undefined' && responderLockedPeriods && responderLockedPeriods.length > 0) {
        initialPeriods = responderLockedPeriods;
    } else if (typeof currentResponderSession !== 'undefined' && currentResponderSession) {

        if (data.periods && Array.isArray(data.periods) && data.periods.length > 0) {

        } else {

        }
    }

                '<td style="padding:10px 12px;text-align:center;">' +
                  '<select class="batch-status-select" data-student-id="' + escapeAttr(s.studentId) + '" onchange="handleBatchStatusChange(this)" style="padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;border:1.5px solid #cbd5e1;cursor:pointer;outline:none;">' +
                    '<option value="Hadir"' + (statusVal === 'Hadir' ? ' selected' : '') + '>Hadir</option>' +
                    '<option value="Sakit"' + (statusVal === 'Sakit' ? ' selected' : '') + '>Sakit</option>' +
                    '<option value="Izin"' + (statusVal === 'Izin' ? ' selected' : '') + '>Izin</option>' +
                    '<option value="Alpa"' + (statusVal === 'Alpa' ? ' selected' : '') + '>Alpa</option>' +

    // Apply color styling to all select elements

        sel.style.backgroundColor = '#ecfdf5';
        sel.style.borderColor = '#10b981';
        sel.style.color = '#065f46';
    } else if (val === 'Sakit') {
        sel.style.backgroundColor = '#fffbeb';
        sel.style.borderColor = '#f59e0b';
        sel.style.color = '#92400e';
    } else if (val === 'Izin') {

        sel.style.borderColor = '#3b82f6';
        sel.style.color = '#1e40af';
    } else if (val === 'Alpa') {

function handleBatchStatusChange(sel) {

function markAllBatchAttendance(targetStatus) {
    const selects = document.querySelectorAll('#batchAttTbody .batch-status-select');

function updateBatchAttendanceCounters() {
    const selects = document.querySelectorAll('#batchAttTbody .batch-status-select');
    let cntHadir = 0, cntSakit = 0, cntIzin = 0, cntAlpa = 0;
    selects.forEach(function(sel) {
        const val = sel.value;
        if (val === 'Hadir') cntHadir++;
        else if (val === 'Sakit') cntSakit++;
        else if (val === 'Izin') cntIzin++;
        else if (val === 'Alpa') cntAlpa++;
    });

    const elHadir = document.getElementById('cnt_hadir');
    if (elHadir) elHadir.textContent = 'Hadir: ' + cntHadir;
    const elSakit = document.getElementById('cnt_sakit');
    if (elSakit) elSakit.textContent = 'Sakit: ' + cntSakit;
    const elIzin = document.getElementById('cnt_izin');
    if (elIzin) elIzin.textContent = 'Izin: ' + cntIzin;
    const elAlpa = document.getElementById('cnt_alpa');
    if (elAlpa) elAlpa.textContent = 'Alpa: ' + cntAlpa;
}

function filterBatchAttendanceRows(query) {
    const q = (query || '').trim().toLowerCase();
    const rows = document.querySelectorAll('#batchAttTbody .batch-att-row');
    rows.forEach(function(r) {
        if (!q) {
            r.style.display = '';
            return;
        }
        const name = r.getAttribute('data-name') || '';
        const nis = r.getAttribute('data-nis') || '';
        if (name.includes(q) || nis.includes(q)) {
            r.style.display = '';
        } else {
            r.style.display = 'none';
        }
    });
}

function submitBatchClassAttendance() {
    if (!currentBatchRosterData || !currentBatchRosterData.students) {
        alert('Data presensi kelas tidak valid.');
        return;
    }

    const selectedPeriods = getSelectedBatchPeriods();
    if (!selectedPeriods || selectedPeriods.length === 0) {
        alert('Pilih minimal satu jam pelajaran.');
        return;
    }

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        alert("Sesi login telah berakhir. Silakan login kembali.");
        return;
    }

    const btn = document.getElementById('btnSubmitBatchAttendance');
    const originalHtml = btn ? btn.innerHTML : '';
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;margin-right:6px;"></div> Menyimpan...';
    }

    const sessionId = (typeof currentResponderSession !== 'undefined' && currentResponderSession && currentResponderSession.sessionId)
        ? currentResponderSession.sessionId
        : "";

    const attendances = currentBatchRosterData.students.map(function(s) {
        const sel = document.querySelector('#batchAttTbody .batch-status-select[data-student-id="' + s.studentId + '"]');
        const noteInput = document.querySelector('#batchAttTbody .batch-note-input[data-student-id="' + s.studentId + '"]');
        return {
            studentId: s.studentId,
            status: sel ? sel.value : (s.status || 'Hadir'),
            note: noteInput ? noteInput.value.trim() : ''
        };
    });

    const payload = {
        classId: currentBatchRosterData.class.classId,
        academicYear: currentBatchRosterData.class.academicYear,
        date: currentBatchRosterData.date,
        periods: selectedPeriods,
        attendances: attendances
    };

    simataClient
        .withSuccessHandler(function(res) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
            if (!res || !res.success) {
                alert((res && res.message) || 'Gagal menyimpan presensi batch.');
                return;
            }
            if (typeof showToast === 'function') {
                showToast("success", "Presensi Berhasil", res.message);
            } else {
                alert(res.message);
            }
            closeBatchClassAttendanceModal();
            if (typeof loadRecentAttendances === 'function') loadRecentAttendances();
            if (typeof loadStudentAttendanceView === 'function') loadStudentAttendanceView();
        })
        .withFailureHandler(function(err) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
            alert('Gagal menyimpan presensi: ' + ((err && err.message) ? err.message : err));
        })
        .recordBatchClassAttendance(token, sessionId, payload);
}

function loadGrades(filter) {
    const tbody = document.getElementById('gradesTbody');
    if (!tbody) return;
    renderTableLoading(tbody, 11, 'Memuat data nilai...');

    const filters = {};
    const searchTerm = filter !== undefined ? filter : (document.getElementById('gradeSearch') ? document.getElementById('gradeSearch').value.trim() : '');

    const studentId = document.getElementById('gradeStudentFilter') ? document.getElementById('gradeStudentFilter').value : '';
    const classId = document.getElementById('gradeClassFilter') ? document.getElementById('gradeClassFilter').value : '';
    const subject = document.getElementById('gradeSubjectFilter') ? document.getElementById('gradeSubjectFilter').value : '';
    const assessmentType = document.getElementById('gradeAssessmentTypeFilter') ? document.getElementById('gradeAssessmentTypeFilter').value : '';
    const semester = document.getElementById('gradeSemesterFilter') ? document.getElementById('gradeSemesterFilter').value : '';
    const academicYear = document.getElementById('gradeAcademicYearFilter') ? document.getElementById('gradeAcademicYearFilter').value : '';

    if (studentId) filters.studentId = studentId;
    if (classId) filters.classId = classId;
    if (subject) filters.subject = subject;
    if (assessmentType) filters.assessmentType = assessmentType;
    if (semester) filters.semester = semester;
    if (academicYear) filters.academicYear = academicYear;

    simataClient.withSuccessHandler(function(result){
        if (!result || !result.success) {
            tbody.innerHTML = '<tr><td colspan="11">Gagal memuat nilai.</td></tr>';
            return;
        }

        let grades = result.grades || [];
        if (searchTerm) {
            const q = searchTerm.toLowerCase();
            grades = grades.filter(function(g){
                return (g.gradeId || '').toLowerCase().includes(q) ||
                    (g.studentId || '').toLowerCase().includes(q) ||
                    (g.classId || '').toLowerCase().includes(q) ||
                    (g.subject || '').toLowerCase().includes(q) ||
                    (g.assessmentType || '').toLowerCase().includes(q) ||
                    (g.semester || '').toLowerCase().includes(q) ||
                    (g.academicYear || '').toLowerCase().includes(q) ||
                    (g.remarks || '').toLowerCase().includes(q);
            });
        }

        if (grades.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11">Tidak ada data.</td></tr>';
            return;
        }

        const subjectFilter = document.getElementById('gradeSubjectFilter');
        const assessmentFilter = document.getElementById('gradeAssessmentTypeFilter');
        const semesterFilter = document.getElementById('gradeSemesterFilter');
        if (subjectFilter) {
            const subjects = Array.from(new Set(grades.map(function(g){ return g.subject || ''; }).filter(Boolean))).sort();
            subjectFilter.innerHTML = '<option value="">(Semua Subject)</option>' + subjects.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (subject) subjectFilter.value = subject;
        }
        if (assessmentFilter) {
            const types = Array.from(new Set(grades.map(function(g){ return g.assessmentType || ''; }).filter(Boolean))).sort();
            assessmentFilter.innerHTML = '<option value="">(Semua Assessment)</option>' + types.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (assessmentType) assessmentFilter.value = assessmentType;
        }
        if (semesterFilter) {
            const semesters = Array.from(new Set(grades.map(function(g){ return g.semester || ''; }).filter(Boolean))).sort();
            semesterFilter.innerHTML = '<option value="">(Semua Semester)</option>' + semesters.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (semester) semesterFilter.value = semester;
        }

        tbody.innerHTML = grades.map(function(g){
            return '<tr>' +
                '<td style="padding:8px">'+escapeHtml(g.gradeId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.studentId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.classId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.subject)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.assessmentType)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.score)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.semester)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.academicYear)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.date)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.remarks)+'</td>' +
                '<td style="padding:8px">' +
                  '<button onclick="openGradeModal(\'edit\', \' '+escapeAttr(g.gradeId)+'\')" style="margin-right:6px;">Edit</button>' +
                  '<button onclick="openGradeModal(\'view\', \' '+escapeAttr(g.gradeId)+'\')">Detail</button>' +
                '</td>' +
              '</tr>';
        }).join('');
    }).withFailureHandler(function(){ tbody.innerHTML = '<tr><td colspan="11">Gagal memuat nilai.</td></tr>'; }).getGrades(filters);

function openGradeModal(mode, gradeId) {
    const modal = document.getElementById('gradeModal'); if (!modal) return;
    const title = document.getElementById('gradeModalTitle');
    const gradeIdField = document.getElementById('g_gradeId');
    const studentField = document.getElementById('g_studentId');
    const classField = document.getElementById('g_classId');
    const saveBtn = document.getElementById('gradeSaveBtn');

    if (mode === 'create') {
        title.textContent = 'Tambah Nilai';
        gradeIdField.disabled = false; gradeIdField.value = '';
        studentField.disabled = false; studentField.value = '';
        classField.disabled = false; classField.value = '';
        ['g_subject','g_assessmentType','g_score','g_semester','g_academicYear','g_date','g_remarks'].forEach(function(k){
            const el = document.getElementById(k); if (el) el.value = '';
        });
        if (saveBtn) saveBtn.style.display = '';
        window.currentGradeModalMode = 'create';
        modal.style.display = 'flex';
        return;
    }

    if (!gradeId) return;

    title.textContent = mode === 'edit' ? 'Edit Nilai' : 'Detail Nilai';
    window.currentGradeModalMode = mode;

    simataClient.withSuccessHandler(function(res){
        if (!res || !res.success) { alert('Data nilai tidak ditemukan.'); return; }
        const g = res.grade;
        gradeIdField.value = g.gradeId || '';
        studentField.value = g.studentId || '';
        classField.value = g.classId || '';
        document.getElementById('g_subject').value = g.subject || '';
        document.getElementById('g_assessmentType').value = g.assessmentType || '';
        document.getElementById('g_score').value = g.score || '';
        document.getElementById('g_semester').value = g.semester || '';
        document.getElementById('g_academicYear').value = g.academicYear || '';
        document.getElementById('g_date').value = g.date || '';
        document.getElementById('g_remarks').value = g.remarks || '';

        const disableAll = mode === 'view';
        gradeIdField.disabled = true;
        studentField.disabled = true;
        classField.disabled = true;

        ['g_subject','g_assessmentType','g_score','g_semester','g_academicYear','g_date','g_remarks'].forEach(function(k){
            const el = document.getElementById(k); if (el) el.disabled = disableAll;
        });

        if (saveBtn) saveBtn.style.display = mode === 'view' ? 'none' : '';
        modal.style.display = 'flex';
    }).withFailureHandler(function(){ alert('Gagal memuat data nilai.'); }).getGradeById(gradeId);
}

    const m = document.getElementById('gradeModal');
    if (m && m.querySelector('.modal-processing-overlay.active')) return;

function saveGradeFromModal() {
    const mode = window.currentGradeModalMode || 'create';
    const gradeId = document.getElementById('g_gradeId').value.trim();

    const classId = document.getElementById('g_classId').value;

    const semester = document.getElementById('g_semester').value.trim();
    const academicYear = document.getElementById('g_academicYear').value.trim();
    const date = document.getElementById('g_date').value;
    const remarks = document.getElementById('g_remarks').value.trim();

    if (!gradeId) { alert('gradeId wajib diisi.'); return; }
    if (!studentId) { alert('studentId wajib dipilih.'); return; }
    if (!classId) { alert('classId wajib dipilih.'); return; }
    if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('date harus dalam format YYYY-MM-DD.'); return; }

    const payload = {
        gradeId: gradeId,
        studentId: studentId,
        classId: classId,
        subject: subject,
        assessmentType: assessmentType,
        score: score,
        semester: semester,
        academicYear: academicYear,
        date: date,
        remarks: remarks
    };

    const saveBtn = document.getElementById('gradeSaveBtn');
    setButtonLoading(saveBtn, true, 'Menyimpan...', 'Simpan');
    showModalProcessing('gradeModal', mode === 'create' ? 'Menambahkan Nilai...' : 'Menyimpan Perubahan Nilai...', 'Mohon tunggu sebentar...');

    if (mode === 'create') {
        simataClient.withSuccessHandler(function(res){
            hideModalProcessing('gradeModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            if (res && res.success) {
                closeGradeModal(); loadGrades(); alert('Nilai berhasil ditambahkan.');
            } else {
                alert((res && res.message) || 'Gagal menambahkan nilai.');
            }
        }).withFailureHandler(function(){
            hideModalProcessing('gradeModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            alert('Gagal menambahkan nilai.');
        }).createGrade(payload);
    } else {
        simataClient.withSuccessHandler(function(res){
            hideModalProcessing('gradeModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            if (res && res.success) {
                closeGradeModal(); loadGrades(); alert('Data nilai berhasil diperbarui.');
            } else {
                alert((res && res.message) || 'Gagal memperbarui nilai.');
            }
        }).withFailureHandler(function(){
            hideModalProcessing('gradeModal');
            setButtonLoading(saveBtn, false, '', 'Simpan');
            alert('Gagal memperbarui nilai.');
        }).updateGrade(payload);
    }
}

let attendanceStudentLookup = {}; // studentId -> { name, nis, gender, classId }
let attendanceStudentsMasterList = []; // all student master records for print roster

function parseAttendanceDateComponents(input) {
    if (input === null || input === undefined) return null;
    if (input instanceof Date) {
        if (isNaN(input.getTime())) return null;
        return {
            year: input.getFullYear(),
            month: input.getMonth() + 1,
            day: input.getDate(),
            dayOfWeek: input.getDay()
        };
    }

    const str = String(input).trim();
    if (!str) return null;

    // Pattern 1: ISO YYYY-MM-DD or YYYY-M-D (with optional time)
    const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (isoMatch) {
        const y = parseInt(isoMatch[1], 10);
        const m = parseInt(isoMatch[2], 10);
        const d = parseInt(isoMatch[3], 10);
        if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
            const dt = new Date(y, m - 1, d);
            return {
                year: y,
                month: m,
                day: d,
                dayOfWeek: dt.getDay()
            };
        }
    }

    // Pattern 2: Date string like 'Sat Sep 05 2026' or 'Sat Sep 5 2026'
    const gmtTextMatch = str.match(/([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/);
    if (gmtTextMatch) {
        const months = { 'jan':1, 'feb':2, 'mar':3, 'apr':4, 'mei':5, 'may':5, 'jun':6, 'jul':7, 'agu':8, 'aug':8, 'sep':9, 'okt':10, 'oct':10, 'nov':11, 'des':12, 'dec':12 };
        const mStr = gmtTextMatch[1].toLowerCase();
        if (months[mStr]) {
            const y = parseInt(gmtTextMatch[3], 10);
            const m = months[mStr];
            const d = parseInt(gmtTextMatch[2], 10);
            const dt = new Date(y, m - 1, d);
            return {
                year: y,
                month: m,
                day: d,
                dayOfWeek: dt.getDay()
            };
        }
    }

    // Pattern 3: Fallback Date parse with year range sanity check
    const parsed = new Date(str);
    if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2000 && parsed.getFullYear() <= 2100) {
        return {
            year: parsed.getFullYear(),
            month: parsed.getMonth() + 1,
            day: parsed.getDate(),
            dayOfWeek: parsed.getDay()
        };
    }

    return null;
}

function formatAttendanceDate(dateStr) {
    let comp = typeof parseAttendanceDateComponents === 'function' ? parseAttendanceDateComponents(dateStr) : null;
    if (!comp && dateStr) {
        if (dateStr instanceof Date && !isNaN(dateStr.getTime())) {
            comp = { year: dateStr.getFullYear(), month: dateStr.getMonth() + 1, day: dateStr.getDate(), dayOfWeek: dateStr.getDay() };
        } else {
            const str = String(dateStr).trim();
            const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (isoMatch) {
                const y = parseInt(isoMatch[1], 10), m = parseInt(isoMatch[2], 10), d = parseInt(isoMatch[3], 10);
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    const dt = new Date(y, m - 1, d);
                    comp = { year: y, month: m, day: d, dayOfWeek: dt.getDay() };
                }
            } else {
                const gmtMatch = str.match(/([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/);
                if (gmtMatch) {
                    const monthsMap = { 'jan':1, 'feb':2, 'mar':3, 'apr':4, 'mei':5, 'may':5, 'jun':6, 'jul':7, 'agu':8, 'aug':8, 'sep':9, 'okt':10, 'oct':10, 'nov':11, 'des':12, 'dec':12 };
                    const mVal = monthsMap[gmtMatch[1].toLowerCase()];
                    if (mVal) {
                        const yG = parseInt(gmtMatch[3], 10), dG = parseInt(gmtMatch[2], 10);
                        const dtG = new Date(yG, mVal - 1, dG);
                        comp = { year: yG, month: mVal, day: dG, dayOfWeek: dtG.getDay() };
                    }
                } else {
                    const parsed = new Date(str);
                    if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2000 && parsed.getFullYear() <= 2100) {
                        comp = { year: parsed.getFullYear(), month: parsed.getMonth() + 1, day: parsed.getDate(), dayOfWeek: parsed.getDay() };
                    }
                }
            }
        }
    }
    if (!comp) return '-';
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const day = String(comp.day).padStart(2, '0');
    const month = months[comp.month - 1] || String(comp.month).padStart(2, '0');
    return day + ' ' + month + ' ' + comp.year;
}

function formatAttendanceTime(timestampStr) {
    if (timestampStr === null || timestampStr === undefined || timestampStr === '') return '-';

    // Epoch milliseconds (number) — produced by normalizeTimestampValue() for datetime cells
    if (typeof timestampStr === 'number') {
        if (isNaN(timestampStr) || !isFinite(timestampStr)) return '-';
        const d = new Date(timestampStr);
        if (isNaN(d.getTime())) return '-';
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    // Native Date object (legacy path, kept for safety)
    if (timestampStr instanceof Date) {
        if (!isNaN(timestampStr.getTime())) {
            const h = String(timestampStr.getHours()).padStart(2, '0');
            const m = String(timestampStr.getMinutes()).padStart(2, '0');
            return h + ':' + m;
        }
        return '-';
    }

    const str = String(timestampStr).trim();
    if (!str) return '-';

    // ISO strings with T or space separator — extract HH:mm directly without Date parsing
    const timeMatch = str.match(/(?:[T\s]|^)(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (timeMatch) {
        const h = parseInt(timeMatch[1], 10);
        const m = parseInt(timeMatch[2], 10);
        if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }
    }

    try {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return h + ':' + m;
        }
    } catch(e) {}

    return '-';
}

function formatAttendancePeriod(period) {
    if (period === undefined || period === null || String(period).trim() === '') return '-';
    const num = parseInt(period, 10);
    if (!isNaN(num) && num >= 1 && num <= 10) {
        return 'Jam ke-' + num;
    }
    return escapeHtml(String(period));
}

}

    const idField = document.getElementById('a_attendanceId');
    if (mode === 'create') {
        title.textContent = 'Tambah Presensi'; idField.disabled = false; idField.value = '';
        ['a_date','a_academicYear','a_studentId','a_classId','a_status','a_method','a_note'].forEach(function(k){ const el = document.getElementById(k); if (el) el.value = ''; });
        document.getElementById('a_method').value = 'Manual';
        document.querySelectorAll('input[name="sa_period"]').forEach(function(cb){ cb.checked = false; cb.disabled = false; });
        modal.style.display = 'flex'; return;
    }
    if (!attendanceId) return;
    title.textContent = mode === 'edit' ? 'Edit Presensi' : 'Detail Presensi';
    simataClient.withSuccessHandler(function(res){
        if (!res || !res.success) { alert('Data presensi tidak ditemukan.'); return; }
        const a = res.attendance;
        idField.value = a.attendanceId || ''; idField.disabled = true;
        document.getElementById('a_date').value = a.date || '';
        document.getElementById('a_academicYear').value = a.academicYear || '';
        document.getElementById('a_studentId').value = a.studentId || '';
        document.getElementById('a_classId').value = a.classId || '';
        document.getElementById('a_status').value = a.status || 'Hadir';
        document.getElementById('a_method').value = a.method || 'Manual';
        document.getElementById('a_note').value = a.note || '';

        const currentPeriod = a.period ? String(a.period) : '';
        document.querySelectorAll('input[name="sa_period"]').forEach(function(cb){
            cb.checked = (cb.value === currentPeriod);
        });

        if (mode === 'view') {
            Array.from(modal.querySelectorAll('input,select,textarea,button')).forEach(function(el){ if (el.id !== 'attendanceCancelBtn') el.disabled = true; });
        } else {
            Array.from(modal.querySelectorAll('input,select,textarea,button')).forEach(function(el){ el.disabled = false; });
            document.getElementById('attendanceCancelBtn').disabled = false;
        }
        modal.style.display = 'flex';

function saveAttendanceFromModal() {
    const saveBtn = document.getElementById('attendanceSaveBtn');
    const id = document.getElementById('a_attendanceId').value.trim();
    const date = document.getElementById('a_date').value;
    const academicYear = document.getElementById('a_academicYear').value.trim();
    const studentId = document.getElementById('a_studentId').value;
    const classId = document.getElementById('a_classId').value;
    const status = document.getElementById('a_status').value;
    const method = document.getElementById('a_method').value;
    const note = document.getElementById('a_note').value.trim();
    const checkedPeriods = Array.from(document.querySelectorAll('input[name="sa_period"]:checked')).map(function(cb){ return cb.value; });

    if (!id) { alert('attendanceId wajib diisi.'); return; }
    if (!date) { alert('date wajib diisi.'); return; }
    if (!academicYear) { alert('academicYear wajib diisi.'); return; }
    if (!studentId) { alert('studentId wajib dipilih.'); return; }
    if (!classId) { alert('classId wajib dipilih.'); return; }
    if (!status) { alert('status wajib diisi.'); return; }
    if (checkedPeriods.length === 0) { alert('Pilih minimal 1 jam pelajaran.'); return; }

    const payload = {
        attendanceId: id,
        date: date,
        academicYear: academicYear,
        studentId: studentId,
        classId: classId,
        status: status,
        method: method,
        timestamp: new Date().toISOString(),
        note: note,
        periods: checkedPeriods,
        period: checkedPeriods[0]
    };

    setButtonLoading(saveBtn, true, 'Menyimpan...', 'Simpan');
    showModalProcessing('attendanceModal', 'Menyimpan Presensi Siswa...', 'Mohon tunggu sebentar...');

    // determine create or update by trying to fetch
    simataClient.withSuccessHandler(function(res){
        if (res && res.success) {
            // exists -> update
            if (checkedPeriods.length > 1) {
                hideModalProcessing('attendanceModal');
                setButtonLoading(saveBtn, false, '', 'Simpan');
                alert('Untuk edit presensi, pilih tepat 1 jam pelajaran.');
                return;
            }
            simataClient.withSuccessHandler(function(uRes){
                hideModalProcessing('attendanceModal');
                setButtonLoading(saveBtn, false, '', 'Simpan');
                if (uRes && uRes.success) {
                    closeAttendanceModal(); loadStudentAttendance(); alert('Presensi berhasil diperbarui.');
                } else {
                    alert((uRes && uRes.message) || 'Gagal memperbarui presensi.');
                }
            }).withFailureHandler(function(){
                hideModalProcessing('attendanceModal');
                setButtonLoading(saveBtn, false, '', 'Simpan');
                alert('Gagal memperbarui presensi.');
            }).updateStudentAttendance(payload);
        } else {
            // create
            simataClient.withSuccessHandler(function(cRes){
                hideModalProcessing('attendanceModal');
                setButtonLoading(saveBtn, false, '', 'Simpan');
                if (cRes && cRes.success) {
                    closeAttendanceModal(); loadStudentAttendance(); alert('Presensi berhasil ditambahkan.');
                } else {
                    alert((cRes && cRes.message) || 'Gagal menambahkan presensi.');
                }
            }).withFailureHandler(function(){
                hideModalProcessing('attendanceModal');
                setButtonLoading(saveBtn, false, '', 'Simpan');
                alert('Gagal menambahkan presensi.');
            }).createStudentAttendance(payload);
        }
    }).withFailureHandler(function(){
        hideModalProcessing('attendanceModal');
        setButtonLoading(saveBtn, false, '', 'Simpan');
        alert('Gagal memeriksa keberadaan presensi.');
    }).getStudentAttendanceById(id);
}
