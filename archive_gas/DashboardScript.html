    if (pNote) {
        pNote.textContent = isAdmin
            ? 'Akun ini memiliki hak akses Administrator penuh untuk mengelola pengguna, master data (Guru, Siswa, Kelas), presensi sekolah, dan bertindak sebagai Responder presensi.'
            : 'Akun ini memiliki hak akses Guru untuk menjalankan tugas Responder presensi, pengisian jurnal mengajar, dan mengakses informasi akun personal.';
    }

    // Menu: Pengaturan (Single sidebar item untuk ADMIN dan GURU)
    const settingsMenu = document.getElementById('menu-settings');
    if (settingsMenu) {
        settingsMenu.style.display = '';
        settingsMenu.onclick = function() { showSettingsView('akun'); };
    }

    // Role-dependent UI in Settings Page
    const keamananTab = document.getElementById('settingsTab_keamanan');
    if (keamananTab) {
        keamananTab.style.display = isAdmin ? '' : 'none';
    }
    const aksesAdminBox = document.getElementById('aksesAdminContainer');
    if (aksesAdminBox) {
        aksesAdminBox.style.display = isAdmin ? '' : 'none';
    }
    const aksesGuruBox = document.getElementById('aksesGuruContainer');
    if (aksesGuruBox) {
        aksesGuruBox.style.display = isAdmin ? 'none' : '';
    }

    // Master Data mutasi buttons: Nonaktif/Sembunyikan untuk GURU
    const addTeacherBtn = document.getElementById('addTeacherButton');
    if (addTeacherBtn) addTeacherBtn.style.display = isAdmin ? '' : 'none';

    const addStudentBtn = document.getElementById('addStudentButton');
    if (addStudentBtn) addStudentBtn.style.display = isAdmin ? '' : 'none';

    const addClassBtn = document.getElementById('addClassButton');
    if (addClassBtn) addClassBtn.style.display = isAdmin ? '' : 'none';

    // Hook Save Account Form button
    const saveAccBtn = document.getElementById('saveAccountBtn');
    if (saveAccBtn) {
        saveAccBtn.onclick = function() { saveAccountFromForm(); };
    }

    // Role-based visibility and init for Responder (Admin + Guru)
    try {
        const rMenu = document.getElementById('menu-responder');
        if (rMenu) {
            if (isAdmin || isGuru) {
                rMenu.style.display = '';
                try { initResponderModule(data.user); } catch (e) { console.error('initResponderModule failed', e); }
            } else {
                rMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for responder', e);
    }

    // Role-based visibility and init for Teacher Attendance (ADMIN only)
    try {
        const taMenu = document.getElementById('menu-teacher-attendance');
        if (taMenu) {
            if (isAdmin) {
                taMenu.style.display = '';
                try { initTeacherAttendanceModule(); } catch (e) { console.error('initTeacherAttendanceModule failed', e); }
            } else {
                taMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for teacher attendance', e);
    }

    // Role-based visibility and init for Journal (Admin + Guru)
    try {
        const jMenu = document.getElementById('menu-journal');
        if (jMenu) {
            if (isAdmin || isGuru) {
                jMenu.style.display = '';
                try { initJournalModule(); } catch (e) { console.error('initJournalModule failed', e); }
            } else {
                jMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for journal', e);
    }

    hideGlobalLoading();

}

function showSettingsView(initialCategory) {
    hideAllViews();
    const el = document.getElementById('settingsContent');
    if (el) el.style.display = '';

    document.querySelectorAll('.sidebar-menu li').forEach(function(li) {
        li.classList.remove('active');
    });
    const m = document.getElementById('menu-settings');
    if (m) m.classList.add('active');

    // Configure role-based tab visibility
    const tabKeamanan = document.getElementById('settingsTab_keamanan');
    if (tabKeamanan) tabKeamanan.style.display = isCurrentUserAdmin ? '' : 'none';

    const tabBuktiFoto = document.getElementById('settingsTab_bukti_foto');
    if (tabBuktiFoto) tabBuktiFoto.style.display = isCurrentUserAdmin ? '' : 'none';

    // Default to 'akun' or requested category (guarantees NO BLANK STATE)
    switchSettingsCategory(initialCategory || 'akun');
}

function switchSettingsCategory(catKey) {
    const tabs = ['akun', 'akses', 'keamanan', 'bukti_foto'];
    let target = (tabs.indexOf(catKey) !== -1) ? catKey : 'akun';

    // Role security check: Non-admin cannot access 'keamanan' or 'bukti_foto'
    if (!isCurrentUserAdmin && (target === 'keamanan' || target === 'bukti_foto')) {
        target = 'akun';
    }

    tabs.forEach(function(key) {
        const tabBtn = document.getElementById('settingsTab_' + key);
        const panel = document.getElementById('settingsPanel_' + key);
        if (tabBtn) {
            if (key === target) {
                tabBtn.classList.add('active');
                tabBtn.setAttribute('aria-selected', 'true');
            } else {
                tabBtn.classList.remove('active');
                tabBtn.setAttribute('aria-selected', 'false');
            }
        }
        if (panel) {
            panel.style.display = (key === target) ? '' : 'none';
        }
    });

    // Auto-load accounts table when Admin switches to 'akses'
    if (target === 'akses' && isCurrentUserAdmin) {
        loadAccountsTable();
    }

    // Auto-init Bukti Foto when Admin switches to 'bukti_foto'
    if (target === 'bukti_foto' && isCurrentUserAdmin) {
        initTeacherPhotoEvidence();
    }
}

function saveAccountFromForm() {
    const uEl = document.getElementById('acc_username');
    const pEl = document.getElementById('acc_password');
    const nEl = document.getElementById('acc_name');
    const rEl = document.getElementById('acc_role');

    const username = uEl ? uEl.value.trim() : '';
    const password = pEl ? pEl.value.trim() : '';
    const name = nEl ? nEl.value.trim() : '';
    const role = rEl ? rEl.value.trim() : '';

    if (!username) { alert('Username wajib diisi.'); if (uEl) uEl.focus(); return; }
    if (!password) { alert('Password wajib diisi.'); if (pEl) pEl.focus(); return; }
    if (!name) { alert('Nama Lengkap wajib diisi.'); if (nEl) nEl.focus(); return; }
    if (!role) { alert('Pilih role akun (Admin atau Guru).'); if (rEl) rEl.focus(); return; }

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) { alert('Sesi login tidak valid. Silakan login kembali.'); return; }

    const btn = document.getElementById('saveAccountBtn');
    setButtonLoading(btn, true, 'Menyimpan...', 'Simpan Akun');
    showModalProcessing('addAccountCard', 'Menyimpan Akun...', 'Sedang memproses pendaftaran akun baru...');

    simataClient
        .withSuccessHandler(function(res) {
            hideModalProcessing('addAccountCard');
            setButtonLoading(btn, false, '', 'Simpan Akun');
            if (res && res.success) {
                alert(res.message || 'Akun berhasil ditambahkan.');
                if (uEl) uEl.value = '';
                if (pEl) pEl.value = '';
                if (nEl) nEl.value = '';
                if (rEl) rEl.value = '';
                loadAccountsTable();
            } else {
                alert((res && res.message) || 'Gagal menambahkan akun.');
            }
        })
        .withFailureHandler(function(err) {
            hideModalProcessing('addAccountCard');
            setButtonLoading(btn, false, '', 'Simpan Akun');
            alert('Terjadi kesalahan saat menambahkan akun: ' + (err && err.message ? err.message : err));
        })
        .createAccount(token, { username: username, password: password, name: name, role: role });
}

function togglePasswordVisibility(inputId, btnEl) {
    const input = document.getElementById(inputId);
    if (!input) return;

    const isCurrentlyPassword = (input.type === 'password');
    input.type = isCurrentlyPassword ? 'text' : 'password';

    if (btnEl) {
        const eyeOpen = btnEl.querySelector('.eye-open');
        const eyeClosed = btnEl.querySelector('.eye-closed');
        if (eyeOpen && eyeClosed) {
            eyeOpen.style.display = isCurrentlyPassword ? 'none' : '';
            eyeClosed.style.display = isCurrentlyPassword ? '' : 'none';
        }
    }
}

function loadAccountsTable() {
    const tbody = document.getElementById('accountsTbody');
    if (!tbody) return;
    renderTableLoading(tbody, 5, 'Memuat data akun...');

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) return;

    simataClient
        .withSuccessHandler(function(res) {
            if (!res || !res.success || !Array.isArray(res.accounts)) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:16px;color:#ef4444;">Gagal memuat akun.</td></tr>';
                return;
            }
            if (res.accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:16px;color:#64748b;">Belum ada akun.</td></tr>';
                return;
            }

            const currentCaller = (res.currentUsername || '').trim().toLowerCase();

            tbody.innerHTML = res.accounts.map(function(acc, idx) {
                const rClean = String(acc.role).toUpperCase();
                const badgeCls = (rClean === 'ADMIN') ? 'simata-badge-success' : 'simata-badge-info';
                const isSelf = (String(acc.username).trim().toLowerCase() === currentCaller);

                const deleteBtnHtml = isSelf
                    ? '<button type="button" disabled style="font-size:12px;padding:4px 10px;background:#f1f5f9;color:#94a3b8;border:1px solid #cbd5e1;border-radius:6px;cursor:not-allowed;" title="Akun yang sedang aktif tidak dapat dihapus">Aktif</button>'
                    : '<button type="button" onclick="confirmDeleteAccount(\'' + escapeAttr(acc.username) + '\', this)" style="font-size:12px;padding:4px 10px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:6px;cursor:pointer;">Hapus</button>';

                const editBtnHtml = '<button type="button" onclick="openEditAccountModal(\'' + escapeAttr(acc.username) + '\', \'' + escapeAttr(acc.name) + '\', \'' + escapeAttr(acc.role) + '\')" style="font-size:12px;padding:4px 10px;background:#f8fafc;color:#0284c7;border:1px solid #bae6fd;border-radius:6px;cursor:pointer;margin-right:6px;">Edit</button>';

                return '<tr class="simata-table-row">' +
                    '<td style="padding:10px 12px;text-align:center;color:#64748b;font-size:12.5px;">' + (idx + 1) + '</td>' +
                    '<td style="padding:10px 14px;font-family:monospace;font-size:12.5px;color:#334155;font-weight:600;">' + escapeHtml(acc.username) + '</td>' +
                    '<td style="padding:10px 14px;font-size:13px;color:#0f172a;">' + escapeHtml(acc.name) + '</td>' +
                    '<td style="padding:10px 14px;text-align:center;"><span class="simata-badge ' + badgeCls + '">' + escapeHtml(acc.role) + '</span></td>' +
                    '<td style="padding:10px 14px;text-align:center;white-space:nowrap;">' + editBtnHtml + deleteBtnHtml + '</td>' +
                '</tr>';
            }).join('');
        })
        .withFailureHandler(function() {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:16px;color:#ef4444;">Gagal memuat akun.</td></tr>';
        })
        .getAccounts(token);
}

    const uEl = document.getElementById('edit_acc_username');

        pEl.value = '';

    if (toggleBtn) {
        const eyeOpen = toggleBtn.querySelector('.eye-open');

            eyeOpen.style.display = '';
            eyeClosed.style.display = 'none';
        }
    }

function closeEditAccountModal() {
    const modal = document.getElementById('editAccountModal');
    if (modal && modal.querySelector('.modal-processing-overlay.active')) return;

function saveEditAccount() {
    const origEl = document.getElementById('edit_acc_orig_username');
    const uEl = document.getElementById('edit_acc_username');
    const pEl = document.getElementById('edit_acc_password');
    const nEl = document.getElementById('edit_acc_name');
    const rEl = document.getElementById('edit_acc_role');

    const originalUsername = origEl ? origEl.value.trim() : '';
    const newUsername = uEl ? uEl.value.trim() : '';
    const newPassword = pEl ? pEl.value.trim() : '';
    const name = nEl ? nEl.value.trim() : '';
    const role = rEl ? rEl.value.trim() : '';

    if (!originalUsername) { alert('Data akun tidak valid.'); return; }
    if (!newUsername) { alert('Username wajib diisi.'); if (uEl) uEl.focus(); return; }
    if (!name) { alert('Nama Lengkap wajib diisi.'); if (nEl) nEl.focus(); return; }
    if (!role) { alert('Pilih role akun (Admin atau Guru).'); if (rEl) rEl.focus(); return; }

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) { alert('Sesi login tidak valid. Silakan login kembali.'); return; }

    const saveBtn = document.getElementById('editAccountSaveBtn');
    setButtonLoading(saveBtn, true, 'Menyimpan...', 'Simpan Perubahan');
    showModalProcessing('editAccountModal', 'Menyimpan Perubahan Akun...', 'Mohon tunggu sebentar...');

    simataClient
        .withSuccessHandler(function(res) {
            hideModalProcessing('editAccountModal');
            setButtonLoading(saveBtn, false, '', 'Simpan Perubahan');
            if (res && res.success) {
                closeEditAccountModal();
                alert(res.message || 'Akun berhasil diperbarui.');

                // If user updated their own username, force clean re-login
                if (res.requiresRelogin) {
                    sessionStorage.removeItem('SIMATA_TOKEN');
                    redirectToLogin();
                    return;
                }

                loadAccountsTable();
            } else {
                alert((res && res.message) || 'Gagal memperbarui akun.');
            }
        })
        .withFailureHandler(function(err) {
            hideModalProcessing('editAccountModal');
            setButtonLoading(saveBtn, false, '', 'Simpan Perubahan');
            alert('Terjadi kesalahan saat memperbarui akun: ' + (err && err.message ? err.message : err));
        })
        .updateAccount(token, {
            originalUsername: originalUsername,
            username: newUsername,
            password: newPassword,
            name: name,
            role: role
        });
}

function confirmDeleteAccount(username, btnEl) {
    if (!username) return;
    const confirmMessage = "Apakah Anda yakin ingin menghapus akun '" + username + "'?\nTindakan ini tidak dapat dibatalkan.";
    if (!confirm(confirmMessage)) return;

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) { alert('Sesi login tidak valid. Silakan login kembali.'); return; }

    setButtonLoading(btnEl, true, 'Menghapus...', 'Hapus');
    showModalProcessing('accountsTableCard', 'Menghapus Akun...', 'Sedang menghapus akun ' + username + '...');

    simataClient
        .withSuccessHandler(function(res) {
            hideModalProcessing('accountsTableCard');
            setButtonLoading(btnEl, false, '', 'Hapus');
            if (res && res.success) {
                alert(res.message || 'Akun berhasil dihapus.');
                loadAccountsTable();
            } else {
                alert((res && res.message) || 'Gagal menghapus akun.');
            }
        })
        .withFailureHandler(function(err) {
            hideModalProcessing('accountsTableCard');
            setButtonLoading(btnEl, false, '', 'Hapus');
            alert('Terjadi kesalahan saat menghapus akun: ' + (err && err.message ? err.message : err));
        })
        .deleteAccount(token, username);
}

========================= */

function initTeacherPhotoEvidence() {
    const dateInput = document.getElementById('bfr_dateFilter');
    if (dateInput && !dateInput.value) {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        dateInput.value = y + '-' + m + '-' + d;
    }

    // Wire filter button if not already wired
    const filterBtn = document.getElementById('bfr_filterBtn');
    if (filterBtn && !filterBtn.dataset.wired) {
        filterBtn.dataset.wired = 'true';
        filterBtn.addEventListener('click', function() {
            loadTeacherPhotoEvidenceList();
        });
    }

    loadTeacherPhotoEvidenceList();
}

function loadTeacherPhotoEvidenceList() {
    const dateInput = document.getElementById('bfr_dateFilter');
    const selectedDate = dateInput ? dateInput.value.trim() : '';

    if (!selectedDate) {
        alert('Pilih tanggal terlebih dahulu.');
        return;
    }

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) {
        alert('Sesi login tidak valid. Silakan login kembali.');
        return;
    }

    const loadingEl = document.getElementById('bfr_loadingState');
    const tableContainer = document.getElementById('bfr_tableContainer');
    const emptyEl = document.getElementById('bfr_emptyState');
    const errorEl = document.getElementById('bfr_errorState');
    const filterBtn = document.getElementById('bfr_filterBtn');

    if (loadingEl) loadingEl.style.display = 'block';
    if (tableContainer) tableContainer.style.display = 'none';
    if (emptyEl) emptyEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'none';
    if (filterBtn) filterBtn.disabled = true;

    simataClient
        .withSuccessHandler(function(res) {
            if (loadingEl) loadingEl.style.display = 'none';
            if (filterBtn) filterBtn.disabled = false;

            if (!res || !res.success) {
                if (errorEl) {
                    errorEl.textContent = (res && res.message) || 'Gagal memuat bukti foto.';
                    errorEl.style.display = 'block';
                }
                return;
            }

            const records = res.records || [];
            if (records.length === 0) {
                if (emptyEl) emptyEl.style.display = 'block';
                return;
            }

            renderTeacherPhotoEvidenceTable(records, selectedDate);
            if (tableContainer) tableContainer.style.display = 'block';
        })
        .withFailureHandler(function(err) {
            if (loadingEl) loadingEl.style.display = 'none';
            if (filterBtn) filterBtn.disabled = false;
            if (errorEl) {
                errorEl.textContent = 'Terjadi kesalahan saat memuat data: ' + ((err && err.message) ? err.message : err);
                errorEl.style.display = 'block';
            }
        })
        .getTeacherPhotoEvidenceByDate(token, selectedDate);
}

function renderTeacherPhotoEvidenceTable(records, date) {
    const tbody = document.getElementById('bfr_tableBody');
    if (!tbody) return;

    tbody.innerHTML = records.map(function(rec, idx) {
        const periodLabel = formatAttendancePeriod(rec.period);
        const mapelText = rec.subject ? '<div style="font-size:11px;color:#64748b;margin-top:2px;">' + escapeHtml(rec.subject) + '</div>' : '';

        // Status badge
        const statusBadge = renderAttendanceStatusBadge(rec.status);

        // Bukti foto badge
        const fotoBadge = rec.hasPhoto
            ? '<span class="simata-badge simata-badge-success" style="font-size:11px;padding:3px 8px;font-weight:600;">Foto Tersedia</span>'
            : '<span style="color:#64748b;font-size:12px;">Tidak ada bukti foto</span>';

        // Action button
        const actionHtml = rec.hasPhoto
            ? '<button type="button" class="login-button" style="min-height:30px;padding:0 12px;font-size:11.5px;font-weight:600;background:#15803d;" onclick="openTeacherPhotoModal(\'' + escapeAttr(rec.attendanceId) + '\', \'' + escapeAttr(rec.teacherName) + '\', \'' + escapeAttr(rec.period) + '\', \'' + escapeAttr(rec.className) + '\', \'' + escapeAttr(rec.timestamp) + '\', \'' + escapeAttr(rec.status) + '\', \'' + escapeAttr(rec.subject || '') + '\', \'' + escapeAttr(rec.materi || '') + '\')">Lihat Foto</button>'
            : '<span style="color:#94a3b8;font-size:12px;">-</span>';

        const timeDisplay = formatAttendanceTime(rec.timestamp) || rec.timestamp || '-';

        return '<tr class="simata-table-row">' +
            '<td style="padding:10px 12px;text-align:center;color:#64748b;font-size:12.5px;">' + (idx + 1) + '</td>' +
            '<td style="padding:10px 14px;font-size:13px;color:#0f172a;font-weight:600;">' + escapeHtml(rec.teacherName) + mapelText + '</td>' +
            '<td style="padding:10px 14px;font-family:monospace;font-size:12px;color:#475569;">' + escapeHtml(rec.nik || '-') + '</td>' +
            '<td style="padding:10px 14px;text-align:center;font-weight:700;color:#166534;font-size:12.5px;">' + escapeHtml(periodLabel) + '</td>' +
            '<td style="padding:10px 14px;text-align:center;font-size:12.5px;font-weight:600;color:#1e293b;">' + escapeHtml(rec.className || '-') + '</td>' +
            '<td style="padding:10px 14px;text-align:center;">' + statusBadge + '</td>' +
            '<td style="padding:10px 14px;text-align:center;font-size:12px;color:#475569;">' + escapeHtml(timeDisplay) + '</td>' +
            '<td style="padding:10px 14px;text-align:center;">' + fotoBadge + '</td>' +
            '<td style="padding:10px 14px;text-align:center;white-space:nowrap;">' + actionHtml + '</td>' +
        '</tr>';
    }).join('');
}

function openTeacherPhotoModal(attendanceId, teacherName, period, className, timeStr, status, subject, materi) {
    const modal = document.getElementById('teacherPhotoEvidenceModal');
    if (!modal) return;

    // Set metadata fields
    const nameEl = document.getElementById('tpm_teacherName');
    const pcEl = document.getElementById('tpm_periodClass');
    const timeEl = document.getElementById('tpm_time');
    const statusEl = document.getElementById('tpm_status');
    const smEl = document.getElementById('tpm_subjectMateri');

    if (nameEl) nameEl.textContent = teacherName || '-';
    if (pcEl) pcEl.textContent = formatAttendancePeriod(period) + ' • ' + (className || '-');
    if (timeEl) timeEl.textContent = timeStr || '-';
    if (statusEl) statusEl.innerHTML = renderAttendanceStatusBadge(status);
    if (smEl) smEl.textContent = (subject || '-') + ' — ' + (materi || '-');

    const photoImg = document.getElementById('tpm_photoImg');
    const photoLoading = document.getElementById('tpm_photoLoading');

    if (photoImg) {
        photoImg.src = '';
        photoImg.style.display = 'none';
    }
    if (photoLoading) {
        photoLoading.innerHTML = '<div class="simata-spinner" style="margin:20px auto;"></div><div style="font-size:13px;color:#64748b;margin-top:8px;">Memuat foto dari Google Drive...</div>';
        photoLoading.style.display = 'block';
    }

    modal.style.display = 'flex';

    const token = sessionStorage.getItem('SIMATA_TOKEN');
    if (!token) {
        if (photoLoading) photoLoading.innerHTML = '<span style="color:#ef4444;">Sesi login tidak valid.</span>';
        return;
    }

    simataClient
        .withSuccessHandler(function(res) {
            if (res && res.success && res.photoDataUrl) {
                if (photoImg) {
                    photoImg.src = res.photoDataUrl;
                    photoImg.style.display = 'block';
                }
                if (photoLoading) photoLoading.style.display = 'none';
            } else {
                if (photoLoading) {
                    photoLoading.innerHTML = '<span style="color:#ef4444;font-size:13px;font-weight:600;">' + escapeHtml((res && res.message) || 'Foto tidak dapat ditampilkan.') + '</span>';
                }
            }
        })
        .withFailureHandler(function(err) {
            if (photoLoading) {
                photoLoading.innerHTML = '<span style="color:#ef4444;font-size:13px;font-weight:600;">Gagal mengambil foto dari server: ' + escapeHtml((err && err.message) ? err.message : String(err)) + '</span>';
            }
        })
        .getTeacherPhotoDetail(token, attendanceId);
}

function closeTeacherPhotoModal() {
    const modal = document.getElementById('teacherPhotoEvidenceModal');
    if (!modal) return;
    modal.style.display = 'none';

    const photoImg = document.getElementById('tpm_photoImg');
    if (photoImg) {
        photoImg.src = '';
    }
}

function updateAvatar(name) {

    if (!name) return;

    const words = name.trim().split(" ");

    let initials = words[0].charAt(0);

    if (words.length > 1) {

        initials +=
            words[words.length - 1].charAt(0);

    }

    document.getElementById("userAvatar")
        .textContent = initials.toUpperCase();

}


/* =========================
   LIVE CLOCK
========================= */

function startLiveClock() {

    updateLiveClock();

    setInterval(updateLiveClock, 1000);

}


function updateLiveClock() {

    const clock =
        document.getElementById("liveClock");

    if (!clock) return;


    const now = new Date();

    const time =
        now.toLocaleTimeString("id-ID", {

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"

        });


    clock.textContent = time;

}


/* =========================
   SESSION VALIDATION
========================= */

const DASHBOARD_SESSION_CHECK_INTERVAL = 5 * 60 * 1000;
let dashboardSessionCheckTimer = null;
let dashboardSessionFocusListener = null;

function initDashboardSessionCheck() {

    if (dashboardSessionCheckTimer === null) {
        dashboardSessionCheckTimer = setInterval(
            checkDashboardSession,
            DASHBOARD_SESSION_CHECK_INTERVAL
        );
    }

    if (!dashboardSessionFocusListener) {
        dashboardSessionFocusListener = function() {
            checkDashboardSession();
        };
        window.addEventListener("focus", dashboardSessionFocusListener);
    }

}

function checkDashboardSession() {

    const token =
        sessionStorage.getItem("SIMATA_TOKEN");

    if (!token) {

        console.warn("[SIMATA AUTH] Token tidak ditemukan saat session check. Redirect ke login.");
        redirectToLogin();

        return;

    }


    simataClient

        .withSuccessHandler(function(result) {

            if (!result || result.valid !== true) {

                console.warn("[SIMATA AUTH] Session tidak valid saat session check. Redirect ke login.");
                sessionStorage.removeItem("SIMATA_TOKEN");
                redirectToLogin();

            }

        })

        .withFailureHandler(function(error) {

            console.error("[SIMATA AUTH] Gagal melakukan session check:", error);

        })

        .validateSession(token);

}


/* =========================
   LOGOUT
========================= */

function logoutSIMATA() {

    const token =
        sessionStorage.getItem("SIMATA_TOKEN");

    const button =
        document.getElementById("logout-button");


    if (button) {

        button.disabled = true;

        button.classList.add("loading");

    }


    if (!token) {

        redirectToLogin();

        return;

    }


    simataClient

        .withSuccessHandler(function(success) {

            if (success) {

                sessionStorage.removeItem(
                    "SIMATA_TOKEN"
                );

                redirectToLogin();

            } else {

                if (button) {

                    button.disabled = false;

                    button.classList.remove("loading");

                }

                showToast(
                    "error",
                    "Logout Gagal",
                    "Token tidak valid atau sesi sudah berakhir."
                );

            }

        })

        .withFailureHandler(function(error) {

            console.error(error);


            if (button) {

                button.disabled = false;

                button.classList.remove("loading");

            }


            showToast(
                "error",
                "Logout Gagal",
                "Terjadi kesalahan saat menghubungi server."
            );

        })

        .logout(token);

}


/* =========================
   REDIRECT
========================= */

function redirectToLogin() {

    const appUrl =
        '<?!= ScriptApp.getService().getUrl(); ?>';

    sessionStorage.removeItem(
        "SIMATA_TOKEN"
    );

    window.top.location.replace(appUrl + "?page=login");

}


/* =========================
   FALLBACK ERROR
========================= */

function onDashboardError(error) {

    hideGlobalLoading();

    console.error(
        "Dashboard Error:",
        error
    );


    showToast(
        "error",
        "Dashboard Gagal",
        "Data dashboard tidak dapat dimuat."
    );

}
