<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMATA — Kamera Presensi Guru</title>
  <style>
    :root {
      --s-primary: #0F2419;
      --s-primary-hover: #163826;
      --s-accent: #4ADE80;
      --s-accent-hover: #22C55E;
      --s-accent-soft: rgba(74, 222, 128, 0.15);
      --s-bg: #0F2419;
      --s-surface: #1B3527;
      --s-text: #FFFFFF;
      --s-text-muted: #A3B8AD;
      --s-danger: #EF4444;
      --s-warning: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      height: 100dvh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--s-bg);
      color: var(--s-text);
      height: 100%;
      height: 100dvh;
      min-height: 100%;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
    }

    /* Top Bar */
    .camera-header {
      flex-shrink: 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--s-surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }

    .camera-title-group h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .camera-title-group p {
      font-size: 11px;
      color: var(--s-text-muted);
      margin-top: 2px;
    }

    .cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Viewport */
    .camera-viewport {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    video#cameraVideo,
    img#photoPreview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Mirror preview if front camera */
    .mirror {
      transform: scaleX(-1);
    }

    canvas#hiddenCanvas {
      display: none;
    }

    /* Viewfinder Portrait Overlay */
    .viewfinder-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .viewfinder-frame {
      width: min(260px, 72vw);
      height: min(320px, 50vh);
      max-height: calc(100% - 24px);
      position: relative;
      border-radius: 20px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
    }

    /* Viewfinder corner brackets */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: var(--s-accent);
      border-style: solid;
      pointer-events: none;
    }

    .corner-tl {
      top: 0;
      left: 0;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 16px;
    }

    .corner-tr {
      top: 0;
      right: 0;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 16px;
    }

    .corner-bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 16px;
    }

    .corner-br {
      bottom: 0;
      right: 0;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 16px;
    }

    /* Bottom Control Bar */
    .camera-footer {
      flex-shrink: 0;
      position: relative;
      z-index: 100;
      padding: 12px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--s-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--s-text-muted);
    }

    .status-badge.active {
      background: var(--s-accent-soft);
      color: var(--s-accent);
    }

    .status-badge.success {
      background: rgba(74, 222, 128, 0.25);
      color: #4ADE80;
      font-weight: 700;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .control-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      align-items: center;
      justify-content: space-between;
    }

    .btn-secondary {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-primary {
      flex: 1.2;
      min-width: 0;
      background: var(--s-accent);
      border: none;
      color: var(--s-primary);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--s-accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Shutter button style */
    .shutter-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--s-accent);
      border: 4px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--s-primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, background 0.2s;
      flex-shrink: 0;
      position: relative;
      z-index: 101;
      visibility: visible;
      opacity: 1;
    }

    .shutter-btn:hover {
      background: var(--s-accent-hover);
      transform: scale(1.05);
    }

    .shutter-btn:active {
      transform: scale(0.95);
    }

    /* Error Overlay Container */
    .error-container {
      position: absolute;
      inset: 20px;
      background: rgba(15, 36, 25, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
    }

    .error-container h2 {
      font-size: 16px;
      color: #F87171;
      margin-bottom: 8px;
    }

    .error-container p {
      font-size: 12px;
      color: var(--s-text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      max-width: 280px;
    }

    .retry-btn {
      background: var(--s-accent);
      color: var(--s-primary);
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Responsive for Short / Landscape Screens */
    @media (max-height: 520px) {
      .camera-header {
        padding: 8px 14px;
      }
      .camera-header h1 {
        font-size: 13px;
      }
      .camera-header p {
        display: none;
      }
      .camera-footer {
        padding: 8px 12px;
        gap: 8px;
      }
      .status-badge {
        padding: 3px 10px;
        font-size: 11px;
      }
      .shutter-btn {
        width: 48px;
        height: 48px;
      }
      .btn-secondary, .btn-primary {
        padding: 8px 10px;
        font-size: 12px;
      }
      .viewfinder-frame {
        height: min(180px, calc(100% - 16px));
        width: min(220px, 45vw);
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="camera-header">
    <div class="camera-title-group">
      <h1>Kamera Presensi Guru</h1>
      <p>Arahkan kamera ke guru yang hadir</p>
    </div>
    <button class="cancel-btn" type="button" onclick="cancelAndClose()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      Batal
    </button>
  </header>

  <!-- Live Camera Viewport / Captured Preview -->
  <main class="camera-viewport">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <img id="photoPreview" alt="Preview Foto Guru" />
    <canvas id="hiddenCanvas"></canvas>

    <!-- Viewfinder Box (Live Mode Only) -->
    <div class="viewfinder-overlay" id="viewfinderOverlay">
      <div class="viewfinder-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
      </div>
    </div>

    <!-- Error Notice Screen -->
    <div class="error-container" id="errorContainer">
      <div style="width:48px;height:48px;border-radius:50%;background:rgba(239,68,68,0.2);color:#EF4444;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 id="errorTitle">Akses Kamera Gagal</h2>
      <p id="errorMessage">Tidak dapat mengakses perangkat kamera.</p>
      <button class="retry-btn" type="button" onclick="startCamera()">Coba Lagi</button>
    </div>
  </main>

  <!-- Bottom Control Bar -->
  <footer class="camera-footer">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Menyiapkan kamera...</span>
    </div>

    <!-- MODE 1: LIVE STREAM CONTROLS -->
    <div class="control-row" id="liveControls" style="display: flex;">
      <button class="btn-secondary" type="button" onclick="toggleCameraFacingMode()" title="Ganti Kamera">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Ganti Kamera
      </button>

      <button class="shutter-btn" type="button" onclick="takeSnapshot()" title="Ambil Foto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </button>

      <button class="btn-secondary" type="button" onclick="cancelAndClose()" title="Batal">
        Batal
      </button>
    </div>

    <!-- MODE 2: REVIEW CAPTURED PHOTO CONTROLS -->
    <div class="control-row" id="reviewControls" style="display: none;">
      <button class="btn-secondary" type="button" onclick="retakeSnapshot()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Ambil Ulang
      </button>

      <button class="btn-primary" type="button" onclick="useCapturedPhoto()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Gunakan Foto
      </button>
    </div>
  </footer>

  <script>
    // 1. Security & Target Origin Resolution (Identical to scanner.html)
    let trustedSimataOrigin = null;
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const originParam = urlParams.get('simataOrigin');
      if (originParam) {
        const parsedUrl = new URL(originParam);
        if (parsedUrl.protocol === 'https:' || parsedUrl.protocol === 'http:') {
          trustedSimataOrigin = parsedUrl.origin;
        }
      }
    } catch (e) {
      console.warn("[SIMATA CAMERA] Gagal mem-parse simataOrigin:", e);
    }

    // 2. State Variables
    let currentStream = null;
    let currentFacingMode = "environment"; // default rear camera
    let capturedPhotoDataUrl = null;

    const videoEl = document.getElementById('cameraVideo');
    const photoPreviewEl = document.getElementById('photoPreview');
    const canvasEl = document.getElementById('hiddenCanvas');
    const canvasCtx = canvasEl.getContext('2d');
    const viewfinderOverlay = document.getElementById('viewfinderOverlay');
    const statusBadgeEl = document.getElementById('statusBadge');
    const statusTextEl = document.getElementById('statusText');
    const liveControlsEl = document.getElementById('liveControls');
    const reviewControlsEl = document.getElementById('reviewControls');
    const errorContainerEl = document.getElementById('errorContainer');
    const errorTitleEl = document.getElementById('errorTitle');
    const errorMessageEl = document.getElementById('errorMessage');

    function setStatus(text, state) {
      if (statusTextEl) statusTextEl.textContent = text;
      if (statusBadgeEl) {
        statusBadgeEl.className = "status-badge " + (state || "");
      }
    }

    function showError(title, msg) {
      stopCameraStream();
      if (errorTitleEl) errorTitleEl.textContent = title;
      if (errorMessageEl) errorMessageEl.textContent = msg;
      if (errorContainerEl) errorContainerEl.style.display = "flex";
      setStatus("Kamera Bermasalah", "error");
      if (liveControlsEl) liveControlsEl.style.display = "flex";
      if (reviewControlsEl) reviewControlsEl.style.display = "none";
    }

    function hideError() {
      if (errorContainerEl) errorContainerEl.style.display = "none";
    }

    function stopCameraStream() {
      if (currentStream) {
        try {
          currentStream.getTracks().forEach(function(track) {
            track.stop();
          });
        } catch (e) {
          console.warn("[SIMATA CAMERA] Error stopping track:", e);
        }
        currentStream = null;
      }
      if (videoEl) {
        videoEl.srcObject = null;
      }
    }

    function cancelAndClose() {
      stopCameraStream();
      capturedPhotoDataUrl = null;
      window.close();
    }

    function toggleCameraFacingMode() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      if (currentFacingMode === "user") {
        videoEl.classList.add('mirror');
      } else {
        videoEl.classList.remove('mirror');
      }
      startCamera();
    }

    function startCamera() {
      hideError();
      stopCameraStream();

      // Ensure video is visible and preview is hidden
      videoEl.style.display = "block";
      photoPreviewEl.style.display = "none";
      if (viewfinderOverlay) viewfinderOverlay.style.display = "flex";
      liveControlsEl.style.display = "flex";
      reviewControlsEl.style.display = "none";

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError(
          "Browser Tidak Didukung",
          "Browser ini tidak mendukung akses kamera langsung (getUserMedia). Gunakan browser modern berprotokol HTTPS."
        );
        return;
      }

      setStatus("Meminta izin kamera...", "active");

      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(handleCameraSuccess)
        .catch(function(error) {
          console.warn("[SIMATA CAMERA] getUserMedia ideal failed, retrying generic video...", error);
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(handleCameraSuccess)
            .catch(handleCameraError);
        });
    }

    function handleCameraSuccess(stream) {
      currentStream = stream;
      videoEl.srcObject = stream;
      videoEl.setAttribute('playsinline', 'true');
      videoEl.setAttribute('autoplay', 'true');
      videoEl.muted = true;

      videoEl.play()
        .then(function() {
          setStatus("Arahkan kamera ke guru", "active");
        })
        .catch(function(playError) {
          console.warn("[SIMATA CAMERA] video.play error:", playError);
          setStatus("Arahkan kamera ke guru", "active");
        });
    }

    function handleCameraError(error) {
      console.error("[SIMATA CAMERA] Camera error:", error);
      let title = "Akses Kamera Gagal";
      let msg = "Tidak dapat mengakses perangkat kamera.";

      if (error.name === "NotAllowedError" || error.name === "PermissionDeniedError") {
        title = "Izin Kamera Ditolak";
        msg = "Akses kamera diblokir oleh browser. Izinkan akses kamera pada ikon gembok/setelan situs di bilah alamat browser Anda, lalu klik Coba Lagi.";
      } else if (error.name === "NotFoundError" || error.name === "DevicesNotFoundError") {
        title = "Kamera Tidak Ditemukan";
        msg = "Perangkat kamera tidak terdeteksi pada perangkat ini.";
      } else if (error.name === "NotReadableError" || error.name === "TrackStartError") {
        title = "Kamera Sedang Digunakan";
        msg = "Kamera kemungkinan sedang digunakan oleh aplikasi lain.";
      }

      showError(title, msg);
    }

    function takeSnapshot() {
      if (!videoEl || !videoEl.videoWidth || !videoEl.videoHeight) {
        alert("Kamera belum siap. Tunggu beberapa saat.");
        return;
      }

      const rawW = videoEl.videoWidth;
      const rawH = videoEl.videoHeight;

      // Scale down image to reasonable dimensions (max 640x480)
      const MAX_WIDTH = 640;
      const MAX_HEIGHT = 480;
      let targetW = rawW;
      let targetH = rawH;

      if (targetW > MAX_WIDTH || targetH > MAX_HEIGHT) {
        const ratio = Math.min(MAX_WIDTH / targetW, MAX_HEIGHT / targetH);
        targetW = Math.round(targetW * ratio);
        targetH = Math.round(targetH * ratio);
      }

      canvasEl.width = targetW;
      canvasEl.height = targetH;

      // Handle horizontal flip if front camera is used
      if (currentFacingMode === "user") {
        canvasCtx.save();
        canvasCtx.translate(targetW, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(videoEl, 0, 0, targetW, targetH);
        canvasCtx.restore();
      } else {
        canvasCtx.drawImage(videoEl, 0, 0, targetW, targetH);
      }

      // Compress to reasonable JPEG quality (0.75) ~ 30-50KB
      capturedPhotoDataUrl = canvasEl.toDataURL('image/jpeg', 0.75);

      // Stop camera stream immediately to save power & release hardware
      stopCameraStream();

      // Show preview
      videoEl.style.display = "none";
      photoPreviewEl.src = capturedPhotoDataUrl;
      photoPreviewEl.style.display = "block";
      if (viewfinderOverlay) viewfinderOverlay.style.display = "none";

      liveControlsEl.style.display = "none";
      reviewControlsEl.style.display = "flex";

      setStatus("Foto Berhasil Diambil", "success");
    }

    function retakeSnapshot() {
      capturedPhotoDataUrl = null;
      photoPreviewEl.src = "";
      startCamera();
    }

    function useCapturedPhoto() {
      if (!capturedPhotoDataUrl || typeof capturedPhotoDataUrl !== "string") {
        alert("Foto belum diambil.");
        return;
      }

      if (window.opener && !window.opener.closed) {
        if (!trustedSimataOrigin) {
          console.error("[SIMATA CAMERA] trustedSimataOrigin tidak valid.");
          alert("Origin SIMATA tidak valid. Hubungi administrator.");
          return;
        }

        const payload = {
          type: "SIMATA_TEACHER_PHOTO",
          photoDataUrl: capturedPhotoDataUrl
        };

        // Post message strictly to the verified parent origin (NEVER "*")
        window.opener.postMessage(payload, trustedSimataOrigin);

        // Visual confirmation before auto-close
        setStatus("Foto Terkirim ke SIMATA", "success");
        setTimeout(function() {
          stopCameraStream();
          capturedPhotoDataUrl = null;
          window.close();
        }, 300);
      } else {
        alert("Foto siap diambil!\n(Jendela induk SIMATA tidak ditemukan atau telah ditutup)");
      }
    }

    // Auto-start camera on DOM load
    window.addEventListener('DOMContentLoaded', function() {
      startCamera();
    });

    // Cleanup tracks on page unload
    window.addEventListener('beforeunload', function() {
      stopCameraStream();
    });
  </script>
</body>
</html>
