<style>
/**
 * SIMATA — Mobile Responsive Stylesheet for Login Page
 * File: LoginResponsive.html
 * 
 * Target devices: 320px, 360px, 375px, 390px, 414px, 430px, 768px, 1024px+
 * Scoped strictly to login page elements (.login-layout, .toast, .loading-overlay).
 * Desktop (>768px) remains identical to baseline.
 */

/* ==========================================================================
   1. GLOBAL RESET & VIEWPORT INTEGRITY
   ========================================================================== */

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ==========================================================================
   2. MOBILE BREAKPOINT (max-width: 768px)
   ========================================================================== */

@media (max-width: 768px) {

  /* --- Container & Layout --- */
  .login-layout {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100vh;
    background: #EEF3F8;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Hide large desktop branding hero panel on mobile */
  .login-layout .branding-panel {
    display: none;
  }

  /* Full-width centered login panel */
  .login-layout .login-panel {
    flex: 1;
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    box-sizing: border-box;
  }

  /* --- Login Card --- */
  .login-layout .card {
    width: 100%;
    max-width: 440px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 28px 20px 24px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    box-sizing: border-box;
    margin: auto;
  }

  /* --- School Logo --- */
  .login-layout .school-logo {
    width: 80px;
    height: auto;
    display: block;
    margin: 0 auto 16px;
  }

  /* --- Typography --- */
  .login-layout .title {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
    color: var(--primary, #166534);
    margin: 0;
  }

  .login-layout .subtitle {
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
    color: var(--text-light, #6B7280);
    margin: 6px 0 0;
  }

  /* --- Form & Inputs --- */
  .login-layout .login-form {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  /* Font-size 16px prevents iOS auto-zoom on focus */
  .login-layout .input-box {
    width: 100%;
    height: 50px;
    min-height: 48px;
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 12px;
    border: 2px solid #E5E7EB;
    background: #FAFAFA;
    box-sizing: border-box;
  }

  .login-layout .input-box:focus {
    border-color: var(--primary, #166534);
    background: #FFFFFF;
  }

  .login-layout .input-group.password-group {
    position: relative;
    width: 100%;
  }

  .login-layout .toggle-password {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    touch-action: manipulation;
    padding: 0;
  }

  /* --- Validation Errors --- */
  .login-layout .error-message {
    font-size: 12px;
    color: #E53935;
    margin-top: 2px;
    margin-bottom: 4px;
    line-height: 1.3;
    font-weight: 500;
  }

  /* --- Submit Button --- */
  .login-layout .login-button {
    width: 100%;
    height: 50px;
    min-height: 48px;
    margin-top: 8px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--primary, #166534);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    transition: background 0.2s ease;
  }

  .login-layout .login-button:hover,
  .login-layout .login-button:focus-visible {
    background: var(--secondary, #22C55E);
    outline: none;
  }

  /* --- Footer --- */
  .login-layout .login-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    color: #94A3B8;
  }

  /* --- Responsive Toast Notification on Mobile --- */
  .toast {
    top: 16px;
    left: 16px;
    right: 16px;
    min-width: 0;
    width: auto;
    max-width: calc(100% - 32px);
    margin: auto;
    padding: 14px 16px;
    border-radius: 14px;
  }

  .toast-icon {
    width: 38px;
    height: 38px;
    font-size: 18px;
    flex-shrink: 0;
  }

  .toast-title {
    font-size: 14px;
  }

  .toast-message {
    font-size: 12px;
  }
}

/* ==========================================================================
   3. EXTRA SMALL MOBILE (max-width: 360px: 320px - 360px)
   ========================================================================== */

@media (max-width: 360px) {

  .login-layout .login-panel {
    padding: 16px 10px;
  }

  .login-layout .card {
    padding: 22px 14px 18px;
    border-radius: 16px;
  }

  .login-layout .school-logo {
    width: 68px;
    margin-bottom: 12px;
  }

  .login-layout .title {
    font-size: 21px;
  }

  .login-layout .subtitle {
    font-size: 12px;
  }

  .login-layout .input-box {
    height: 46px;
    padding: 10px 14px;
    font-size: 16px;
  }

  .login-layout .login-button {
    height: 46px;
    font-size: 14px;
  }
}
</style>
