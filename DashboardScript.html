    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        if (typeof showToast === 'function') {
            showToast("error", "Autentikasi Diperlukan", "Token sesi tidak ditemukan. Silakan login kembali.");
        } else {
            alert("Token sesi tidak ditemukan. Silakan login kembali.");
        }
        return;
    }

    const finishBtn = document.getElementById('finishResponderBtn');
    if (finishBtn) {
        finishBtn.disabled = true;
        finishBtn.textContent = "Menyelesaikan...";
    }

    const sessionId = currentResponderSession.sessionId;

    google.script.run
        .withSuccessHandler(function(result) {
            if (finishBtn) {
                finishBtn.disabled = false;
                finishBtn.textContent = "Selesai Sesi";
            }

            if (!result || !result.success) {
                const msg = (result && result.message) || "Gagal menyelesaikan sesi responder.";
                if (typeof showToast === 'function') {
                    showToast("error", "Gagal Selesai", msg);
                } else {
                    alert(msg);
                }
                return;
            }

            // Clear local session state & stop camera stream
            currentResponderSession = null;
            resetResponderCameraState();

            // Return to normal dashboard
            hideResponderView();

            if (typeof showToast === 'function') {
                showToast("success", "Sesi Selesai", "Sesi responder telah diselesaikan.");
            }
        })
        .withFailureHandler(function(error) {
            if (finishBtn) {
                finishBtn.disabled = false;
                finishBtn.textContent = "Selesai Sesi";
            }
            console.error("[SIMATA RESPONDER] Gagal menyelesaikan sesi:", error);
            if (typeof showToast === 'function') {
                showToast("error", "Koneksi Gagal", "Gagal menghubungi server untuk menyelesaikan sesi.");
            } else {
                alert("Gagal menghubungi server untuk menyelesaikan sesi.");
            }
        })
        .finishResponderSession(token, sessionId);
}

function hideResponderView() {
    stopResponderCameraStream();
    const respEl = document.getElementById('responderContent');
    if (respEl) respEl.style.display = 'none';

    showDashboardView();
}

function showDashboardView() {
    hideAllViews();

    const dashEl = document.getElementById('dashboardContent');
    if (dashEl) dashEl.style.display = '';

    document.querySelectorAll('.sidebar-menu li').forEach(function(li) {
        li.classList.remove('active');
    });
    const dashMenu = document.getElementById('menu-dashboard') || document.querySelector('.sidebar-menu li');
    if (dashMenu) dashMenu.classList.add('active');
}


/* =========================
   DASHBOARD DATA
========================= */

function onDashboardLoaded(data) {

    if (!data || !data.success) {

        sessionStorage.removeItem("SIMATA_TOKEN");

        redirectToLogin();

        return;

    }


    document.getElementById("userName").textContent =
        data.user.name;

    document.getElementById("userRole").textContent =
        data.user.role;


    document.getElementById("totalStudents").textContent =
        data.statistics.students;

    document.getElementById("totalTeachers").textContent =
        data.statistics.teachers;

    document.getElementById("todayAttendance").textContent =
        data.statistics.attendance;

    document.getElementById("totalClasses").textContent =
        data.statistics.classes;


    updateAvatar(data.user.name);

    // Role-based visibility and init for Responder (Admin + Guru)
    try {
        const role = (data.user && data.user.role) ? String(data.user.role).toLowerCase() : '';
        const rMenu = document.getElementById('menu-responder');
        if (rMenu) {
            if (role === 'admin' || role === 'administrator' || role === 'guru' || role === 'teacher') {
                rMenu.style.display = '';
                try { initResponderModule(data.user); } catch (e) { console.error('initResponderModule failed', e); }
            } else {
                rMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for responder', e);
    }

    // Role-based visibility and init for Teacher Attendance (ADMIN only)
    try {
        const role = (data.user && data.user.role) ? String(data.user.role).toLowerCase() : '';
        const taMenu = document.getElementById('menu-teacher-attendance');
        if (taMenu) {
            if (role === 'admin' || role === 'administrator') {
                taMenu.style.display = '';
                try { initTeacherAttendanceModule(); } catch (e) { console.error('initTeacherAttendanceModule failed', e); }
            } else {
                taMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for teacher attendance', e);
    }

    // Role-based visibility and init for Journal (Admin + Teacher)
    try {
        const role = (data.user && data.user.role) ? String(data.user.role).toLowerCase() : '';
        const jMenu = document.getElementById('menu-journal');
        if (jMenu) {
            if (role === 'admin' || role === 'administrator' || role === 'teacher') {
                jMenu.style.display = '';
                try { initJournalModule(); } catch (e) { console.error('initJournalModule failed', e); }
            } else {
                jMenu.style.display = 'none';
            }
        }
    } catch (e) {
        console.error('Error processing role for journal', e);
    }

}


/* =========================
   USER AVATAR
========================= */

function updateAvatar(name) {

    if (!name) return;

    const words = name.trim().split(" ");

    let initials = words[0].charAt(0);

    if (words.length > 1) {

        initials +=
            words[words.length - 1].charAt(0);

    }

    document.getElementById("userAvatar")
        .textContent = initials.toUpperCase();

}


/* =========================
   LIVE CLOCK
========================= */

function startLiveClock() {

    updateLiveClock();

    setInterval(updateLiveClock, 1000);

}


function updateLiveClock() {

    const clock =
        document.getElementById("liveClock");

    if (!clock) return;


    const now = new Date();

    const time =
        now.toLocaleTimeString("id-ID", {

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"

        });


    clock.textContent = time;

}


/* =========================
   SESSION VALIDATION
========================= */

const DASHBOARD_SESSION_CHECK_INTERVAL = 5 * 60 * 1000;
let dashboardSessionCheckTimer = null;
let dashboardSessionFocusListener = null;

function initDashboardSessionCheck() {

    if (dashboardSessionCheckTimer === null) {
        dashboardSessionCheckTimer = setInterval(
            checkDashboardSession,
            DASHBOARD_SESSION_CHECK_INTERVAL
        );
    }

    if (!dashboardSessionFocusListener) {
        dashboardSessionFocusListener = function() {
            checkDashboardSession();
        };
        window.addEventListener("focus", dashboardSessionFocusListener);
    }

}

function checkDashboardSession() {

    const token =
        sessionStorage.getItem("SIMATA_TOKEN");

    if (!token) {

        console.warn("[SIMATA AUTH] Token tidak ditemukan saat session check. Redirect ke login.");
        redirectToLogin();

        return;

    }


    google.script.run

        .withSuccessHandler(function(result) {

            if (!result || result.valid !== true) {

                console.warn("[SIMATA AUTH] Session tidak valid saat session check. Redirect ke login.");
                sessionStorage.removeItem("SIMATA_TOKEN");
                redirectToLogin();

            }

        })

        .withFailureHandler(function(error) {

            console.error("[SIMATA AUTH] Gagal melakukan session check:", error);

        })

        .validateSession(token);

}


/* =========================
   LOGOUT
========================= */

function logoutSIMATA() {

    const token =
        sessionStorage.getItem("SIMATA_TOKEN");

    const button =
        document.getElementById("logout-button");


    if (button) {

        button.disabled = true;

        button.classList.add("loading");

    }


    if (!token) {

        redirectToLogin();

        return;

    }


    google.script.run

        .withSuccessHandler(function(success) {

            if (success) {

                sessionStorage.removeItem(
                    "SIMATA_TOKEN"
                );

                redirectToLogin();

            } else {

                if (button) {

                    button.disabled = false;

                    button.classList.remove("loading");

                }

                showToast(
                    "error",
                    "Logout Gagal",
                    "Token tidak valid atau sesi sudah berakhir."
                );

            }

        })

        .withFailureHandler(function(error) {

            console.error(error);


            if (button) {

                button.disabled = false;

                button.classList.remove("loading");

            }


            showToast(
                "error",
                "Logout Gagal",
                "Terjadi kesalahan saat menghubungi server."
            );

        })

        .logout(token);

}


/* =========================
   REDIRECT
========================= */

function redirectToLogin() {

    const appUrl =
        '<?!= ScriptApp.getService().getUrl(); ?>';

    sessionStorage.removeItem(
        "SIMATA_TOKEN"
    );

    window.top.location.replace(appUrl + "?page=login");

}


/* =========================
   FALLBACK ERROR
========================= */

function onDashboardError(error) {

    console.error(
        "Dashboard Error:",
        error
    );


    showToast(
        "error",
        "Dashboard Gagal",
        "Data dashboard tidak dapat dimuat."
    );

}

window.addEventListener('beforeunload', function() {
    stopResponderCameraStream();
    stopQrScannerStream();
});
