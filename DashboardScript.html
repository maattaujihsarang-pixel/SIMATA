<script>

document.addEventListener("DOMContentLoaded", function() {

    initMobileSidebar();
    guardDashboard();

});


/* =========================
   MOBILE SIDEBAR CONTROLLER
========================= */

function initMobileSidebar() {
    const hamburger = document.getElementById('hamburgerBtn');
    const backdrop = document.getElementById('sidebarBackdrop');
    const closeBtn = document.getElementById('sidebarCloseBtn');

    if (hamburger) {
        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMobileSidebar();
        });
    }

    if (backdrop) {
        backdrop.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    // Auto-close off-canvas sidebar when a menu item is clicked on mobile screen (<=768px)
    const menuItems = document.querySelectorAll('.dashboard-layout .sidebar-menu li');
    menuItems.forEach(function(item) {
        item.addEventListener('click', function() {
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }
        });
    });

    // Close on Escape key press
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeMobileSidebar();
        }
    });
}

function openMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const hamburger = document.getElementById('hamburgerBtn');
    if (sidebar) sidebar.classList.add('mobile-open');
    if (backdrop) backdrop.classList.add('active');
    if (hamburger) hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    const hamburger = document.getElementById('hamburgerBtn');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (backdrop) backdrop.classList.remove('active');
    if (hamburger) hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
}

function toggleMobileSidebar() {
    const sidebar = document.querySelector('.dashboard-layout .sidebar');
    if (sidebar && sidebar.classList.contains('mobile-open')) {
        closeMobileSidebar();
    } else {
        openMobileSidebar();
    }
}


/* =========================
   TOAST NOTIFICATION HELPER
========================= */

function showToast(type, title, message) {
    const toast = document.getElementById("toast");
    const icon = document.getElementById("toastIcon");
    const toastTitle = document.getElementById("toastTitle");
    const toastMessage = document.getElementById("toastMessage");

    if (!toast) return;

    if (toastTitle) toastTitle.textContent = title || "";
    if (toastMessage) toastMessage.textContent = message || "";

    if (icon) {
        if (type === "success") {
            icon.innerHTML = "✔";
            icon.style.background = "#E8F5E9";
            icon.style.color = "#2E7D32";
        } else if (type === "warning" || type === "info") {
            icon.innerHTML = "ℹ";
            icon.style.background = "#FEF3C7";
            icon.style.color = "#D97706";
        } else {
            icon.innerHTML = "✖";
            icon.style.background = "#FDECEC";
            icon.style.color = "#D32F2F";
        }
    }

    toast.classList.add("show");

    if (window._toastTimeout) {
        clearTimeout(window._toastTimeout);
    }

    window._toastTimeout = setTimeout(function() {
        toast.classList.remove("show");
    }, 3000);
}


/* =========================
   DASHBOARD GUARD
========================= */

function guardDashboard() {

    const token = sessionStorage.getItem("SIMATA_TOKEN");

    if (!token) {
        console.warn("[SIMATA AUTH] Token tidak ditemukan. Redirect ke login.");
        redirectToLogin();
        return;
    }

    console.warn("[SIMATA AUTH] Token ditemukan, validasi session...");

    google.script.run
        .withSuccessHandler(function(result) {
            if (!result || result.valid !== true) {
                console.warn("[SIMATA AUTH] Session tidak valid. Redirect ke login.");
                sessionStorage.removeItem("SIMATA_TOKEN");
                redirectToLogin();
                return;
            }

            console.log("[SIMATA AUTH] Session valid. Dashboard diizinkan.");
            showDashboard();
            initDashboard();
            // initialize students & teachers modules
            try { initStudentsModule(); } catch (e) {}
            try { initTeachersModule(); } catch (e) {}
            try { initClassesModule(); } catch (e) {}
            try { initGradesModule(); } catch (e) {}
            try { initAttendanceModule(); } catch (e) {}
            // Teacher Attendance module will be initialized after dashboard data loads (role-based)
            startLiveClock();
            initDashboardSessionCheck();
        })
        .withFailureHandler(function(error) {
            console.error("[SIMATA AUTH] Gagal memvalidasi session:", error);
            sessionStorage.removeItem("SIMATA_TOKEN");
            redirectToLogin();
        })
        .validateSession(token);

}

function showDashboard() {
    document.body.style.display = "";
}


/* =========================
   DASHBOARD INIT
========================= */

function initDashboard() {

    const menuDashboard = document.getElementById('menu-dashboard');
    if (menuDashboard) {
        menuDashboard.addEventListener('click', function() {
            showDashboardView();
        });
    }

    loadDashboard();

}

// Attach additional UI handlers for pages (Students)
let allLoadedStudents = [];
let loadedClassesList = [];
let studentClassMap = {};

function initStudentsModule() {
    const menuStudents = document.getElementById('menu-students');
    if (menuStudents) {
        menuStudents.addEventListener('click', function() {
            showStudentsView();
        });
    }

    const addBtn = document.getElementById('addStudentButton');
    if (addBtn) {
        addBtn.addEventListener('click', function() { openStudentModal('create'); });
    }

    const batchBtn = document.getElementById('batchQrButton');
    if (batchBtn) {
        batchBtn.addEventListener('click', openBatchQrModal);
    }

    const searchInput = document.getElementById('studentSearch');
    if (searchInput) {
        let timer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(applyStudentFilters, 250);
        });
    }

    const classFilter = document.getElementById('studentClassFilter');
    if (classFilter) {
        classFilter.addEventListener('change', applyStudentFilters);
    }

    // Modal buttons
    const cancelBtn = document.getElementById('studentCancelBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', closeStudentModal);

    const saveBtn = document.getElementById('studentSaveBtn');
    if (saveBtn) saveBtn.addEventListener('click', saveStudentFromModal);
}

function showStudentsView() {
    hideAllViews();
    document.getElementById('studentsContent').style.display = '';
    // highlight menu
    document.querySelectorAll('.sidebar-menu li').forEach(function(li){ li.classList.remove('active'); });
    const menu = document.getElementById('menu-students'); if (menu) menu.classList.add('active');
    loadStudents();
}

function hideStudentsView() {
    document.getElementById('studentsContent').style.display = 'none';
    document.getElementById('dashboardContent').style.display = '';
    // restore dashboard menu active state
    document.querySelectorAll('.sidebar-menu li').forEach(function(li){ li.classList.remove('active'); });
    document.querySelector('.sidebar-menu li').classList.add('active');
}

function setStudentClassFilter(classId) {
    const select = document.getElementById('studentClassFilter');
    if (select) {
        select.value = classId || '';
        applyStudentFilters();
    }
}

function applyStudentFilters() {
    const tbody = document.getElementById('studentsTbody');
    if (!tbody) return;

    const searchInput = document.getElementById('studentSearch');
    const q = (searchInput ? searchInput.value : '').trim().toLowerCase();

    const classSelect = document.getElementById('studentClassFilter');
    const selectedClassId = classSelect ? classSelect.value : '';

    const countText = document.getElementById('studentFilterCountText');
    const summaryChips = document.getElementById('studentClassSummaryChips');

    // Calculate class counts across full dataset & render summary chips
    if (summaryChips && Array.isArray(loadedClassesList)) {
        summaryChips.innerHTML = loadedClassesList.map(function(c) {
            const count = allLoadedStudents.filter(function(s) { return s.classId === c.classId; }).length;
            const isSelected = selectedClassId === c.classId;
            const activeClass = isSelected ? ' active' : '';
            return '<button type="button" class="class-summary-chip' + activeClass + '" onclick="setStudentClassFilter(\'' + escapeAttr(c.classId) + '\')" title="Klik untuk memfilter ' + escapeHtml(c.className || c.classId) + '">' +
                '<span class="chip-label">' + escapeHtml(c.className || c.classId) + '</span>' +
                '<span class="chip-badge">' + count + '</span>' +
                '</button>';
        }).join('');
    }

    // Filter students in-memory
    let filtered = allLoadedStudents.slice();

    if (selectedClassId) {
        filtered = filtered.filter(function(s) {
            return s.classId === selectedClassId;
        });
    }

    if (q) {
        filtered = filtered.filter(function(s) {
            return (s.studentId || '').toLowerCase().includes(q) ||
                (s.name || '').toLowerCase().includes(q) ||
                (s.nis || '').toLowerCase().includes(q) ||
                (s.nisn || '').toLowerCase().includes(q);
        });
    }

    // Update count display
    if (countText) {
        if (selectedClassId) {
            countText.textContent = 'Menampilkan: ' + filtered.length + ' siswa';
        } else {
            countText.textContent = 'Total: ' + allLoadedStudents.length + ' siswa';
        }
    }

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">Tidak ada data siswa yang sesuai.</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(function(s, idx) {
        const no = idx + 1;
        const nis = escapeHtml(s.nis || '-');
        const nisn = escapeHtml(s.nisn || '-');
        const name = escapeHtml(s.name || '-');
        const gender = escapeHtml(s.gender || '-');
        const className = escapeHtml((studentClassMap && studentClassMap[s.classId]) || s.classId || '-');
        const status = (s.status || 'Active');
        const statusBadge = (status.toLowerCase() === 'active' || status.toLowerCase() === 'aktif')
            ? '<span class="status-badge status-badge-active">Aktif</span>'
            : '<span class="status-badge status-badge-inactive">Tidak Aktif</span>';

        return '<tr class="simata-table-row">' +
            '<td style="padding:10px 8px;text-align:center;color:#64748b;font-size:12.5px;">' + no + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;font-family:monospace;color:#334155;">' + nis + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;font-family:monospace;color:#334155;">' + nisn + '</td>' +
            '<td style="padding:10px 14px;text-align:left;font-size:13px;font-weight:600;color:#0f172a;">' + name + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + gender + '</td>' +
            '<td style="padding:10px 8px;text-align:center;font-size:12.5px;color:#334155;">' + className + '</td>' +
            '<td style="padding:10px 8px;text-align:center;">' + statusBadge + '</td>' +
            '<td style="padding:10px 12px;text-align:center;">' +
              '<div class="student-action-group" style="justify-content:center;">' +
                '<button type="button" class="btn-action btn-action-edit" onclick="openStudentModal(\'edit\', \'' + escapeAttr(s.studentId) + '\')" title="Edit Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                  '<span>Edit</span>' +
                '</button>' +
                '<button type="button" class="btn-action btn-action-detail" onclick="openStudentModal(\'view\', \'' + escapeAttr(s.studentId) + '\')" title="Detail Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
                  '<span>Detail</span>' +
                '</button>' +
                '<button type="button" class="btn-action btn-action-qr" onclick="showStudentQrModal(\'' + escapeAttr(s.studentId) + '\')" title="Lihat QR Siswa">' +
                  '<svg viewBox="0 0 24 24" class="btn-action-icon"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
                  '<span>QR</span>' +
                '</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
    }).join('');
}

function loadStudents(filter) {
    const tbody = document.getElementById('studentsTbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">Memuat data siswa...</td></tr>';

    // load classes for class select and class name mapping
    google.script.run.withSuccessHandler(function(classesRes) {
        if (classesRes && classesRes.success && Array.isArray(classesRes.classes)) {
            loadedClassesList = classesRes.classes;
            studentClassMap = {};
            classesRes.classes.forEach(function(c) {
                studentClassMap[c.classId] = c.className || c.classId;
            });

            const modalSelect = document.getElementById('f_classId');
            if (modalSelect) {
                modalSelect.innerHTML = '<option value="">(Pilih Kelas)</option>' + classesRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + '</option>';
                }).join('');
            }

            const filterSelect = document.getElementById('studentClassFilter');
            if (filterSelect) {
                const currentVal = filterSelect.value;
                filterSelect.innerHTML = '<option value="">Semua Kelas</option>' + classesRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + '</option>';
                }).join('');
                filterSelect.value = currentVal || '';
            }
        }
    }).withFailureHandler(function() { /* ignore */ }).getClasses();

    google.script.run
        .withSuccessHandler(function(result) {
            if (!result || !result.success) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat siswa.</td></tr>';
                return;
            }

            allLoadedStudents = result.students || [];
            if (filter) {
                const searchInput = document.getElementById('studentSearch');
                if (searchInput) searchInput.value = filter;
            }
            applyStudentFilters();
        })
        .withFailureHandler(function() {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Gagal memuat siswa.</td></tr>';
        })
        .getStudents();
}

function openStudentModal(mode, studentId) {
    const modal = document.getElementById('studentModal');
    const title = document.getElementById('studentModalTitle');
    const idField = document.getElementById('f_studentId');
    const qrField = document.getElementById('f_qrCodeId');

    if (!modal) return;

    if (mode === 'create') {
        title.textContent = 'Tambah Siswa';
        idField.disabled = true; idField.value = '';
        if (qrField) { qrField.disabled = true; qrField.value = ''; }
        ['f_nis','f_nisn','f_name','f_gender','f_classId','f_status','f_birthDate'].forEach(function(k){
            const el = document.getElementById(k); if (el) el.value = '';
        });
        modal.style.display = 'flex';
        return;
    }

    if (!studentId) return;

    title.textContent = mode === 'edit' ? 'Edit Siswa' : 'Detail Siswa';
    // fetch student
    google.script.run.withSuccessHandler(function(res){
        if (!res || !res.success) { alert('Data siswa tidak ditemukan.'); return; }
        const s = res.student;
        idField.value = s.studentId || '';
        idField.disabled = true;
        document.getElementById('f_nis').value = s.nis || '';
        document.getElementById('f_nisn').value = s.nisn || '';
        document.getElementById('f_name').value = s.name || '';
        document.getElementById('f_gender').value = s.gender || '';
        document.getElementById('f_classId').value = s.classId || '';
        document.getElementById('f_status').value = s.status || 'Active';
        document.getElementById('f_birthDate').value = s.birthDate || '';
        if (qrField) { qrField.value = s.qrCodeId || ''; qrField.disabled = true; }
        modal.style.display = 'flex';
    }).withFailureHandler(function(){ alert('Gagal memuat data siswa.'); }).getStudentById(studentId);
}

function closeStudentModal() { const m = document.getElementById('studentModal'); if (m) m.style.display = 'none'; }

function saveStudentFromModal() {
    const id = document.getElementById('f_studentId').value.trim();
    const nis = document.getElementById('f_nis').value.trim();
    const nisn = document.getElementById('f_nisn').value.trim();
    const name = document.getElementById('f_name').value.trim();
    const gender = document.getElementById('f_gender').value;
    const classId = document.getElementById('f_classId').value;
    const status = document.getElementById('f_status').value;
    const birthDate = document.getElementById('f_birthDate').value;
    const qrCodeId = document.getElementById('f_qrCodeId').value.trim();

    if (!name) { alert('Name wajib diisi.'); return; }
    if (!classId) { alert('Class harus dipilih.'); return; }

    const payload = { studentId: id, nis: nis, nisn: nisn, name: name, gender: gender, classId: classId, status: status, birthDate: birthDate, qrCodeId: qrCodeId };

    if (id) {
        // exists -> update
        google.script.run.withSuccessHandler(function(uRes){
            if (uRes && uRes.success) {
                closeStudentModal(); loadStudents();
                showToast("success", "Berhasil", "Data siswa berhasil diperbarui");
            } else {
                alert((uRes && uRes.message) || 'Gagal memperbarui siswa.');
            }
        }).withFailureHandler(function(){ alert('Gagal memperbarui siswa.'); }).updateStudent(id, payload);
    } else {
        // create -> server generates studentId & qrCodeId
        google.script.run.withSuccessHandler(function(cRes){
            if (cRes && cRes.success) {
                closeStudentModal(); loadStudents();
                showToast("success", "Berhasil", "Siswa berhasil ditambahkan.");
            } else {
                alert((cRes && cRes.message) || 'Gagal menambahkan siswa.');
            }
        }).withFailureHandler(function(){ alert('Gagal menambahkan siswa.'); }).createStudent(payload);
    }
}

let currentPreviewStudent = null;

function showStudentQrModal(studentId) {
    if (!studentId) return;

    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success || !res.student) {
                alert((res && res.message) || 'Data siswa tidak ditemukan.');
                return;
            }
            const s = res.student;
            currentPreviewStudent = s;

            document.getElementById('sqr_name').textContent = s.name || '-';
            document.getElementById('sqr_studentId').textContent = s.studentId || '-';
            document.getElementById('sqr_qrCodeId').textContent = s.qrCodeId || '-';

            const qrContainer = document.getElementById('studentQrContainer');
            qrContainer.innerHTML = '';

            const qrValue = (s.qrCodeId || '').trim();
            if (!qrValue) {
                qrContainer.innerHTML = '<span style="color:#ef4444;font-size:0.9rem;">QR Code ID tidak tersedia.</span>';
            } else {
                try {
                    new QRCode(qrContainer, {
                        text: qrValue,
                        width: 180,
                        height: 180,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (err) {
                    console.error('Error generating QR code:', err);
                    qrContainer.innerHTML = '<span style="color:#ef4444;">Gagal membuat QR Code.</span>';
                }
            }

            const modal = document.getElementById('studentQrModal');
            if (modal) modal.style.display = 'flex';
        })
        .withFailureHandler(function() {
            alert('Gagal memuat data siswa untuk QR.');
        })
        .getStudentById(studentId);
}

function closeStudentQrModal() {
    const modal = document.getElementById('studentQrModal');
    if (modal) modal.style.display = 'none';
    currentPreviewStudent = null;
}

function printStudentQr() {
    if (!currentPreviewStudent) {
        alert('Data siswa tidak tersedia untuk dicetak.');
        return;
    }

    const qrContainer = document.getElementById('studentQrContainer');
    const qrImg = qrContainer.querySelector('img') || qrContainer.querySelector('canvas');
    if (!qrImg) {
        alert('QR code belum siap untuk dicetak.');
        return;
    }

    let qrSrc = '';
    if (qrImg.tagName.toLowerCase() === 'img') {
        qrSrc = qrImg.src;
    } else if (qrImg.tagName.toLowerCase() === 'canvas') {
        qrSrc = qrImg.toDataURL('image/png');
    }

    const s = currentPreviewStudent;
    const printWindow = window.open('', '_blank', 'width=450,height=550');
    if (!printWindow) {
        alert('Popup diblokir oleh browser. Izinkan popup untuk mencetak QR.');
        return;
    }

    const html = '<!DOCTYPE html>' +
        '<html><head><title>Cetak QR Siswa - ' + escapeHtml(s.name) + '</title>' +
        '<style>' +
        '@page { size: auto; margin: 15mm; }' +
        'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #fff; }' +
        '.qr-card { border: 2px solid #0f172a; border-radius: 12px; padding: 24px; text-align: center; width: 280px; box-sizing: border-box; page-break-inside: avoid; }' +
        '.school-header { font-size: 14px; font-weight: bold; color: #0f172a; margin-bottom: 2px; }' +
        '.school-sub { font-size: 11px; color: #64748b; margin-bottom: 16px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; }' +
        '.qr-img { width: 180px; height: 180px; margin: 0 auto 16px auto; display: block; }' +
        '.student-name { font-size: 16px; font-weight: bold; color: #0f172a; margin-bottom: 6px; word-break: break-word; }' +
        '.student-meta { font-size: 12px; color: #475569; line-height: 1.5; }' +
        '.qr-id { font-family: monospace; font-weight: bold; color: #1e40af; font-size: 13px; margin-top: 4px; }' +
        '</style></head><body>' +
        '<div class="qr-card">' +
        '<div class="school-header">SIMATA - MA AT-TAUJIH</div>' +
        '<div class="school-sub">KARTU IDENTITAS PRESENSI SISWA</div>' +
        '<img class="qr-img" src="' + qrSrc + '" alt="QR Code" />' +
        '<div class="student-name">' + escapeHtml(s.name) + '</div>' +
        '<div class="student-meta">' +
        '<div><strong>Student ID:</strong> ' + escapeHtml(s.studentId) + '</div>' +
        '<div><strong>Kelas:</strong> ' + escapeHtml(s.classId || '-') + '</div>' +
        '<div class="qr-id">' + escapeHtml(s.qrCodeId || '-') + '</div>' +
        '</div></div>' +
        '<script>' +
        'window.onload = function() { window.print(); setTimeout(function() { window.close(); }, 500); };' +
        '<' + '/script>' +
        '</body></html>';

    printWindow.document.open();
    printWindow.document.write(html);
    printWindow.document.close();
}

/* =========================
   BATCH STUDENT QR PER CLASS
========================= */

let batchLoadedStudents = [];
let batchClassMap = {};

function openBatchQrModal() {
    const modal = document.getElementById('batchQrModal');
    if (!modal) return;

    const select = document.getElementById('batchClassSelect');
    const countBadge = document.getElementById('batchCountBadge');
    const warnNotice = document.getElementById('batchWarningNotice');
    const readyNotice = document.getElementById('batchReadyNotice');
    const emptyNotice = document.getElementById('batchPreviewEmpty');
    const grid = document.getElementById('batchPreviewGrid');
    const printBtn = document.getElementById('printBatchBtn');

    if (select) select.innerHTML = '<option value="">Memuat daftar kelas...</option>';
    if (countBadge) countBadge.textContent = '0 siswa';
    if (warnNotice) { warnNotice.style.display = 'none'; warnNotice.textContent = ''; }
    if (readyNotice) readyNotice.textContent = '';
    if (emptyNotice) { emptyNotice.style.display = 'block'; emptyNotice.textContent = 'Silakan pilih kelas dan klik Tampilkan QR untuk memuat pratinjau kartu.'; }
    if (grid) { grid.style.display = 'none'; grid.innerHTML = ''; }
    if (printBtn) printBtn.disabled = true;

    batchLoadedStudents = [];
    batchClassMap = {};

    modal.style.display = 'flex';

    // Fetch classes and students in parallel
    google.script.run
        .withSuccessHandler(function(classRes) {
            if (!classRes || !classRes.success || !Array.isArray(classRes.classes)) {
                if (select) select.innerHTML = '<option value="">Gagal memuat kelas</option>';
                return;
            }

            batchClassMap = {};
            classRes.classes.forEach(function(c) {
                batchClassMap[c.classId] = c.className || c.classId;
            });

            if (select) {
                select.innerHTML = '<option value="">(Pilih Kelas)</option>' + classRes.classes.map(function(c) {
                    return '<option value="' + escapeAttr(c.classId) + '">' + escapeHtml(c.className || c.classId) + ' (' + escapeHtml(c.classId) + ')</option>';
                }).join('');
            }

            // Also load students for quick count calculation
            google.script.run
                .withSuccessHandler(function(sRes) {
                    if (sRes && sRes.success && Array.isArray(sRes.students)) {
                        batchLoadedStudents = sRes.students;
                    }
                })
                .getStudents();
        })
        .withFailureHandler(function() {
            if (select) select.innerHTML = '<option value="">Gagal memuat kelas</option>';
        })
        .getClasses();
}

function closeBatchQrModal() {

function renderBatchQrPreview() {
    const select = document.getElementById('batchClassSelect');
    const classId = select ? select.value : '';
    const warnNotice = document.getElementById('batchWarningNotice');
    const readyNotice = document.getElementById('batchReadyNotice');
    const emptyNotice = document.getElementById('batchPreviewEmpty');
    const grid = document.getElementById('batchPreviewGrid');
    const printBtn = document.getElementById('printBatchBtn');
    const countBadge = document.getElementById('batchCountBadge');

    if (!classId) {
        alert('Silakan pilih kelas terlebih dahulu.');
        return;
    }

    if (warnNotice) { warnNotice.style.display = 'none'; warnNotice.textContent = ''; }
    if (emptyNotice) { emptyNotice.style.display = 'block'; emptyNotice.textContent = 'Memuat data siswa kelas...'; }
    if (grid) { grid.style.display = 'none'; grid.innerHTML = ''; }
    if (printBtn) printBtn.disabled = true;

    // Fresh fetch of students to ensure latest state
    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success || !Array.isArray(res.students)) {
                if (emptyNotice) emptyNotice.textContent = 'Gagal memuat daftar siswa.';
                return;
            }

            batchLoadedStudents = res.students;
            const classStudents = batchLoadedStudents.filter(function(s) {
                return s.classId === classId;
            });

            if (countBadge) countBadge.textContent = classStudents.length + ' siswa';

            if (classStudents.length === 0) {
                if (emptyNotice) {
                    emptyNotice.style.display = 'block';
                    emptyNotice.textContent = 'Tidak ada siswa yang terdaftar pada kelas ini.';
                }
                return;
            }

            const validStudents = [];
            const invalidStudents = [];

            classStudents.forEach(function(s) {
                if (s.qrCodeId && String(s.qrCodeId).trim() !== '') {
                    validStudents.push(s);
                } else {
                    invalidStudents.push(s);
                }
            });

            if (invalidStudents.length > 0 && warnNotice) {
                warnNotice.style.display = 'block';
                warnNotice.textContent = invalidStudents.length + ' siswa dalam kelas ini belum memiliki QR Code ID dan tidak disertakan dalam pratinjau/cetak (' + invalidStudents.map(function(s){ return s.name; }).join(', ') + ').';
            }

            if (validStudents.length === 0) {
                if (emptyNotice) {
                    emptyNotice.style.display = 'block';
                    emptyNotice.textContent = 'Seluruh siswa pada kelas ini belum memiliki QR Code ID.';
                }
                return;
            }

            if (emptyNotice) emptyNotice.style.display = 'none';
            if (grid) {
                grid.style.display = 'grid';
                grid.innerHTML = '';
            }

            const classNameStr = batchClassMap[classId] || classId;

            validStudents.forEach(function(s, idx) {
                const card = document.createElement('div');
                card.className = 'batch-qr-card-preview';
                card.style.background = '#ffffff';
                card.style.border = '1px solid #cbd5e1';
                card.style.borderRadius = '8px';
                card.style.padding = '12px';
                card.style.textAlign = 'center';
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.style.alignItems = 'center';
                card.style.boxShadow = '0 1px 3px rgba(0,0,0,0.05)';

                const qrBox = document.createElement('div');
                qrBox.id = 'batch_qr_box_' + idx;
                qrBox.style.width = '140px';
                qrBox.style.height = '140px';
                qrBox.style.display = 'flex';
                qrBox.style.alignItems = 'center';
                qrBox.style.justifyContent = 'center';
                qrBox.style.marginBottom = '8px';

                card.appendChild(qrBox);

                const infoBox = document.createElement('div');
                infoBox.style.width = '100%';
                infoBox.style.fontSize = '0.8rem';
                infoBox.style.color = '#334155';
                infoBox.style.lineHeight = '1.4';
                infoBox.innerHTML = '<div style="font-weight:700;font-size:0.85rem;color:#0f172a;margin-bottom:2px;word-break:break-word;">' + escapeHtml(s.name) + '</div>' +
                    '<div><strong>ID:</strong> ' + escapeHtml(s.studentId) + ' | <strong>Kelas:</strong> ' + escapeHtml(classNameStr) + '</div>' +
                    '<div style="font-family:monospace;font-weight:600;color:#2563eb;font-size:0.8rem;margin-top:2px;">' + escapeHtml(s.qrCodeId) + '</div>';

                card.appendChild(infoBox);
                grid.appendChild(card);

                // Render QRCode using QRCode.js
                try {
                    new QRCode(qrBox, {
                        text: String(s.qrCodeId).trim(),
                        width: 140,
                        height: 140,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    console.error('Error rendering QR for student:', s.studentId, e);
                    qrBox.innerHTML = '<span style="color:#ef4444;font-size:0.75rem;">Gagal Render</span>';
                }
            });

            if (readyNotice) {
                readyNotice.textContent = validStudents.length + ' kartu siap dicetak.';
            }
            if (printBtn) {
                printBtn.disabled = false;
            }
        })
        .withFailureHandler(function() {
            if (emptyNotice) emptyNotice.textContent = 'Gagal menghubungi server untuk memuat siswa.';
        })
        .getStudents();
}

function printBatchQr() {
    const grid = document.getElementById('batchPreviewGrid');
    if (!grid) return;

    const cards = grid.querySelectorAll('.batch-qr-card-preview');
    if (cards.length === 0) {
        alert('Tidak ada kartu QR yang siap dicetak.');
        return;
    }

    const select = document.getElementById('batchClassSelect');
    const classId = select ? select.value : '';
    const classNameStr = (batchClassMap && batchClassMap[classId]) || classId || 'Kelas';

    const printWindow = window.open('', '_blank', 'width=900,height=700');
    if (!printWindow) {
        alert('Popup diblokir oleh browser. Izinkan popup untuk mencetak QR.');
        return;
    }

    let cardsHtml = '';
    cards.forEach(function(card) {
        const img = card.querySelector('img') || card.querySelector('canvas');
        let src = '';
        if (img) {
            src = img.tagName.toLowerCase() === 'img' ? img.src : img.toDataURL('image/png');
        }

        const infoDiv = card.children[1];
        const infoHtml = infoDiv ? infoDiv.innerHTML : '';

        cardsHtml += '<div class="print-qr-card">' +
            '<div class="school-header">SIMATA - MA AT-TAUJIH</div>' +
            '<div class="school-sub">KARTU IDENTITAS PRESENSI SISWA</div>' +
            '<img class="qr-img" src="' + src + '" alt="QR" />' +
            '<div class="card-info">' + infoHtml + '</div>' +
            '</div>';
    });

    const html = '<!DOCTYPE html>' +
        '<html><head><title>Cetak QR Siswa - ' + escapeHtml(classNameStr) + '</title>' +
        '<style>' +
        '@page { size: A4 portrait; margin: 10mm; }' +
        'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #fff; }' +
        '.print-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }' +
        '.print-qr-card { border: 1.5px solid #0f172a; border-radius: 8px; padding: 12px; text-align: center; page-break-inside: avoid; break-inside: avoid; background: #fff; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }' +
        '.school-header { font-size: 11px; font-weight: bold; color: #0f172a; margin-bottom: 2px; }' +
        '.school-sub { font-size: 9px; color: #64748b; margin-bottom: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px; width: 100%; }' +
        '.qr-img { width: 130px; height: 130px; margin: 0 auto 8px auto; display: block; }' +
        '.card-info { font-size: 11px; color: #334155; line-height: 1.3; width: 100%; word-break: break-word; }' +
        '@media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }' +
        '</style></head><body>' +
        '<div class="print-grid">' + cardsHtml + '</div>' +
        '<script>' +
        'window.onload = function() { window.print(); setTimeout(function() { window.close(); }, 500); };' +
        '<' + '/script>' +
        '</body></html>';

    printWindow.document.open();
    printWindow.document.write(html);
    printWindow.document.close();
}

function escapeHtml(s) { if (s === null || s === undefined) return ''; return String(s).replace(/[&<>\"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function escapeAttr(s) { return (s||'').replace(/'/g, "\\'"); }

function loadGrades(filter) {
    const tbody = document.getElementById('gradesTbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="11">Memuat...</td></tr>';

    const filters = {};
    const searchTerm = filter !== undefined ? filter : (document.getElementById('gradeSearch') ? document.getElementById('gradeSearch').value.trim() : '');

    const studentId = document.getElementById('gradeStudentFilter') ? document.getElementById('gradeStudentFilter').value : '';
    const classId = document.getElementById('gradeClassFilter') ? document.getElementById('gradeClassFilter').value : '';
    const subject = document.getElementById('gradeSubjectFilter') ? document.getElementById('gradeSubjectFilter').value : '';
    const assessmentType = document.getElementById('gradeAssessmentTypeFilter') ? document.getElementById('gradeAssessmentTypeFilter').value : '';
    const semester = document.getElementById('gradeSemesterFilter') ? document.getElementById('gradeSemesterFilter').value : '';
    const academicYear = document.getElementById('gradeAcademicYearFilter') ? document.getElementById('gradeAcademicYearFilter').value : '';

    if (studentId) filters.studentId = studentId;
    if (classId) filters.classId = classId;
    if (subject) filters.subject = subject;
    if (assessmentType) filters.assessmentType = assessmentType;
    if (semester) filters.semester = semester;
    if (academicYear) filters.academicYear = academicYear;

    google.script.run.withSuccessHandler(function(result){
        if (!result || !result.success) {
            tbody.innerHTML = '<tr><td colspan="11">Gagal memuat nilai.</td></tr>';
            return;
        }

        let grades = result.grades || [];
        if (searchTerm) {
            const q = searchTerm.toLowerCase();
            grades = grades.filter(function(g){
                return (g.gradeId || '').toLowerCase().includes(q) ||
                    (g.studentId || '').toLowerCase().includes(q) ||
                    (g.classId || '').toLowerCase().includes(q) ||
                    (g.subject || '').toLowerCase().includes(q) ||
                    (g.assessmentType || '').toLowerCase().includes(q) ||
                    (g.semester || '').toLowerCase().includes(q) ||
                    (g.academicYear || '').toLowerCase().includes(q) ||
                    (g.remarks || '').toLowerCase().includes(q);
            });
        }

        if (grades.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11">Tidak ada data.</td></tr>';
            return;
        }

        const subjectFilter = document.getElementById('gradeSubjectFilter');
        const assessmentFilter = document.getElementById('gradeAssessmentTypeFilter');
        const semesterFilter = document.getElementById('gradeSemesterFilter');
        if (subjectFilter) {
            const subjects = Array.from(new Set(grades.map(function(g){ return g.subject || ''; }).filter(Boolean))).sort();
            subjectFilter.innerHTML = '<option value="">(Semua Subject)</option>' + subjects.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (subject) subjectFilter.value = subject;
        }
        if (assessmentFilter) {
            const types = Array.from(new Set(grades.map(function(g){ return g.assessmentType || ''; }).filter(Boolean))).sort();
            assessmentFilter.innerHTML = '<option value="">(Semua Assessment)</option>' + types.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (assessmentType) assessmentFilter.value = assessmentType;
        }
        if (semesterFilter) {
            const semesters = Array.from(new Set(grades.map(function(g){ return g.semester || ''; }).filter(Boolean))).sort();
            semesterFilter.innerHTML = '<option value="">(Semua Semester)</option>' + semesters.map(function(v){ return '<option value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</option>'; }).join('');
            if (semester) semesterFilter.value = semester;
        }

        tbody.innerHTML = grades.map(function(g){
            return '<tr>' +
                '<td style="padding:8px">'+escapeHtml(g.gradeId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.studentId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.classId)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.subject)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.assessmentType)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.score)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.semester)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.academicYear)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.date)+'</td>' +
                '<td style="padding:8px">'+escapeHtml(g.remarks)+'</td>' +
                '<td style="padding:8px">' +
                  '<button onclick="openGradeModal(\'edit\', \' '+escapeAttr(g.gradeId)+'\')" style="margin-right:6px;">Edit</button>' +
                  '<button onclick="openGradeModal(\'view\', \' '+escapeAttr(g.gradeId)+'\')">Detail</button>' +
                '</td>' +
              '</tr>';
        }).join('');
    }).withFailureHandler(function(){ tbody.innerHTML = '<tr><td colspan="11">Gagal memuat nilai.</td></tr>'; }).getGrades(filters);
}

function openGradeModal(mode, gradeId) {
    const modal = document.getElementById('gradeModal'); if (!modal) return;
    const title = document.getElementById('gradeModalTitle');
    const gradeIdField = document.getElementById('g_gradeId');
    const studentField = document.getElementById('g_studentId');
    const classField = document.getElementById('g_classId');
    const saveBtn = document.getElementById('gradeSaveBtn');

    if (mode === 'create') {
        title.textContent = 'Tambah Nilai';
        gradeIdField.disabled = false; gradeIdField.value = '';
        studentField.disabled = false; studentField.value = '';
        classField.disabled = false; classField.value = '';
        ['g_subject','g_assessmentType','g_score','g_semester','g_academicYear','g_date','g_remarks'].forEach(function(k){
            const el = document.getElementById(k); if (el) el.value = '';
        });
        if (saveBtn) saveBtn.style.display = '';
        window.currentGradeModalMode = 'create';
        modal.style.display = 'flex';
        return;
    }

    if (!gradeId) return;

    title.textContent = mode === 'edit' ? 'Edit Nilai' : 'Detail Nilai';
    window.currentGradeModalMode = mode;

    google.script.run.withSuccessHandler(function(res){
        if (!res || !res.success) { alert('Data nilai tidak ditemukan.'); return; }
        const g = res.grade;
        gradeIdField.value = g.gradeId || '';
        studentField.value = g.studentId || '';
        classField.value = g.classId || '';
        document.getElementById('g_subject').value = g.subject || '';
        document.getElementById('g_assessmentType').value = g.assessmentType || '';
        document.getElementById('g_score').value = g.score || '';
        document.getElementById('g_semester').value = g.semester || '';
        document.getElementById('g_academicYear').value = g.academicYear || '';
        document.getElementById('g_date').value = g.date || '';
        document.getElementById('g_remarks').value = g.remarks || '';

        const disableAll = mode === 'view';
        gradeIdField.disabled = true;
        studentField.disabled = true;
        classField.disabled = true;

        ['g_subject','g_assessmentType','g_score','g_semester','g_academicYear','g_date','g_remarks'].forEach(function(k){
            const el = document.getElementById(k); if (el) el.disabled = disableAll;
        });

        if (saveBtn) saveBtn.style.display = mode === 'view' ? 'none' : '';
        modal.style.display = 'flex';

function saveGradeFromModal() {
    const mode = window.currentGradeModalMode || 'create';

    const studentId = document.getElementById('g_studentId').value;
    const classId = document.getElementById('g_classId').value;

    const score = document.getElementById('g_score').value.trim();

    const date = document.getElementById('g_date').value;

    if (!classId) { alert('classId wajib dipilih.'); return; }
    if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('date harus dalam format YYYY-MM-DD.'); return; }

    const payload = {
        gradeId: gradeId,
        studentId: studentId,
        classId: classId,
        subject: subject,
        assessmentType: assessmentType,
        score: score,
        semester: semester,
        academicYear: academicYear,
        date: date,
        remarks: remarks
    };

    const runSave = function(call) { call.withSuccessHandler(function(res){ if (res && res.success) { closeGradeModal(); loadGrades(); alert(mode === 'create' ? 'Nilai berhasil ditambahkan.' : 'Data nilai berhasil diperbarui.'); } else { alert((res && res.message) || 'Gagal menyimpan nilai.'); } }).withFailureHandler(function(){ alert('Gagal menyimpan nilai.'); }).call(); };

    if (mode === 'create') {
        google.script.run.withSuccessHandler(function(res){
            if (res && res.success) {
                closeGradeModal(); loadGrades(); alert('Nilai berhasil ditambahkan.');
            } else {
                alert((res && res.message) || 'Gagal menambahkan nilai.');
            }
        }).withFailureHandler(function(){ alert('Gagal menambahkan nilai.'); }).createGrade(payload);
    } else {
        google.script.run.withSuccessHandler(function(res){
            if (res && res.success) {
                closeGradeModal(); loadGrades(); alert('Data nilai berhasil diperbarui.');
            } else {
                alert((res && res.message) || 'Gagal memperbarui nilai.');
            }
        }).withFailureHandler(function(){ alert('Gagal memperbarui nilai.'); }).updateGrade(payload);
    }
}

function handleResponderCameraFile(e) {
    const file = e && e.target && e.target.files && e.target.files[0];
    if (!file) {
        // User cancelled camera / file picker — silent cancel, keep current state
        return;
    }

    // Validate MIME type
    if (!file.type || !file.type.toLowerCase().startsWith('image/')) {
        if (typeof showToast === 'function') {
            showToast("error", "File Tidak Valid", "File yang dipilih bukan gambar. Silakan gunakan foto yang valid.");
        } else {
            alert("File yang dipilih bukan gambar. Silakan gunakan foto yang valid.");
        }
        return;
    }

    // Size limit guard: 25MB max for raw upload before compression
    if (file.size && file.size > 25 * 1024 * 1024) {
        if (typeof showToast === 'function') {
            showToast("warning", "Ukuran Terlalu Besar", "Ukuran foto terlalu besar. Silakan ambil foto kembali.");
        } else {
            alert("Ukuran foto terlalu besar. Silakan ambil foto kembali.");
        }
        return;
    }

    setCameraBadge("Memproses Foto...", "info");

    const reader = new FileReader();
    reader.onload = function(event) {
        const rawDataUrl = event.target.result;

        // Compress / resize image using canvas to ensure optimal payload size (< 2MB)
        const img = new Image();
        img.onload = function() {
            let w = img.width;
            let h = img.height;
            const maxDim = 1024;

            if (w > maxDim || h > maxDim) {
                if (w >= h) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                } else {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                }
            }

            const canvas = document.getElementById('responderCanvas') || document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // Compress: image/jpeg with ~0.75 quality
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

            currentCapturedEvidenceDataUrl = compressedDataUrl;
            currentEvidenceRecord = null;
            isEvidenceSaved = false;

            const previewImg = document.getElementById('capturedPhotoPreview');
            if (previewImg) {
                previewImg.src = compressedDataUrl;
            }

            setCameraViewMode("captured");
            setEvidenceUploadState("captured");

            if (typeof showToast === 'function') {
                showToast("success", "Foto Diambil", "Foto bukti berhasil diambil. Klik 'Simpan Bukti' untuk menyimpan ke sistem.");
            }
        };

        img.onerror = function() {
            showCameraError("Gagal Memuat Gambar", "Format gambar tidak didukung atau file foto rusak.");
        };

        img.src = rawDataUrl;
    };

    reader.onerror = function() {
        showCameraError("Gagal Membaca File", "Terjadi kesalahan saat membaca file foto dari perangkat.");
    };

    reader.readAsDataURL(file);
}

function uploadAttendanceEvidence() {
    if (isEvidenceUploading) return;

    if (!currentResponderSession || !currentResponderSession.sessionId || currentResponderSession.status !== "ACTIVE") {
        if (typeof showToast === 'function') {
            showToast("error", "Sesi Tidak Aktif", "Hanya sesi responder yang aktif yang dapat menyimpan bukti kehadiran.");
        } else {
            alert("Hanya sesi responder yang aktif yang dapat menyimpan bukti kehadiran.");
        }
        return;
    }

    if (!currentCapturedEvidenceDataUrl) {
        if (typeof showToast === 'function') {
            showToast("warning", "Foto Kosong", "Ambil foto bukti kehadiran terlebih dahulu sebelum menyimpan.");
        } else {
            alert("Ambil foto bukti kehadiran terlebih dahulu sebelum menyimpan.");
        }
        return;
    }

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        if (typeof showToast === 'function') {
            showToast("error", "Autentikasi Diperlukan", "Token sesi tidak ditemukan. Silakan login kembali.");
        } else {
            alert("Token sesi tidak ditemukan. Silakan login kembali.");
        }
        return;
    }

    setEvidenceUploadState("uploading");

    const sessionId = currentResponderSession.sessionId;
    const imagePayload = currentCapturedEvidenceDataUrl;

    google.script.run
        .withSuccessHandler(function(result) {
            if (!result || !result.success) {
                const msg = (result && result.message) || "Gagal menyimpan bukti kehadiran ke server.";
                setEvidenceUploadState("failed", msg);
                if (typeof showToast === 'function') {
                    showToast("error", "Gagal Menyimpan", msg);
                } else {
                    alert(msg);
                }
                return;
            }

            // Success / Idempotent existing reconciliation
            currentEvidenceRecord = result.evidence;
            setEvidenceUploadState("saved");

            if (typeof showToast === 'function') {
                showToast("success", "Bukti Tersimpan", "Foto bukti kehadiran berhasil disimpan ke sistem.");
            }
        })
        .withFailureHandler(function(error) {
            console.error("[SIMATA EVIDENCE] Gagal menyimpan bukti:", error);
            const msg = (error && error.message) || "Terjadi kesalahan jaringan atau server saat menyimpan bukti.";
            setEvidenceUploadState("failed", msg);
            if (typeof showToast === 'function') {
                showToast("error", "Koneksi Gagal", "Tidak dapat menghubungi server untuk menyimpan bukti kehadiran.");
            } else {
                alert("Tidak dapat menghubungi server untuk menyimpan bukti kehadiran.");
            }
        })
        .createAttendanceEvidence(token, sessionId, imagePayload);
}

        if (badgeText) badgeText.textContent = "Foto Berhasil Diambil";
        if (badgeIcon) {
            badgeIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
            badgeIcon.style.stroke = '#4ADE80';
        }
        setCameraBadge("Foto Siap", "info");
        syncQrScannerWithEvidenceState();
    } else if (state === "uploading") {
        isEvidenceUploading = true;
        if (saveBtn) {
            saveBtn.style.display = 'inline-flex';
            saveBtn.disabled = true;
        }
        if (saveBtnText) saveBtnText.textContent = "Menyimpan bukti...";
        if (retryBtn) retryBtn.style.display = 'none';
        if (retakeBtn) retakeBtn.disabled = true;
        if (errorNotice) errorNotice.style.display = 'none';
        if (badgeText) badgeText.textContent = "Menyimpan bukti ke server...";
        if (badgeIcon) {
            badgeIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>';
            badgeIcon.style.stroke = '#FACC15';
        }
        setCameraBadge("Menyimpan Bukti...", "info");
        // Disable finish button during upload to prevent race condition
        const finishBtn = document.getElementById('finishResponderBtn');
        if (finishBtn) finishBtn.disabled = true;
    } else if (state === "saved") {
        isEvidenceSaved = true;
        isEvidenceUploading = false;
        if (saveBtn) {
            saveBtn.style.display = 'inline-flex';
            saveBtn.disabled = true;
        }
        if (saveBtnText) saveBtnText.textContent = "Bukti Tersimpan";
        if (retryBtn) retryBtn.style.display = 'none';
        if (retakeBtn) retakeBtn.disabled = false;
        if (errorNotice) errorNotice.style.display = 'none';
        if (badgeText) badgeText.textContent = "Bukti Kehadiran Tersimpan";
        if (badgeIcon) {
            badgeIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
            badgeIcon.style.stroke = '#4ADE80';
        }
        setCameraBadge("Bukti Tersimpan", "success");
        // Upload complete — re-enable finish button
        const finishBtnSaved = document.getElementById('finishResponderBtn');
        if (finishBtnSaved) finishBtnSaved.disabled = false;
        syncQrScannerWithEvidenceState();
    } else if (state === "failed") {
        isEvidenceSaved = false;
        isEvidenceUploading = false;
        if (saveBtn) saveBtn.style.display = 'none';
        if (retryBtn) {
            retryBtn.style.display = 'inline-flex';
            retryBtn.disabled = false;
        }
        if (retakeBtn) retakeBtn.disabled = false;
        if (errorNotice) {
            errorNotice.style.display = 'block';
            if (errorText) errorText.textContent = message || "Gagal menyimpan bukti kehadiran ke server.";
        }
        if (badgeText) badgeText.textContent = "Bukti Belum Tersimpan";
        if (badgeIcon) {
            badgeIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
            badgeIcon.style.stroke = '#F87171';
        }
        setCameraBadge("Bukti Belum Tersimpan", "danger");
        // Upload failed — re-enable finish button so session can still be closed
        const finishBtnFailed = document.getElementById('finishResponderBtn');
        if (finishBtnFailed) finishBtnFailed.disabled = false;
        syncQrScannerWithEvidenceState();
    }
}

function handleQrScannerMessage(event) {
    // 1. Exact origin validation
    if (!event || event.origin !== QR_SCANNER_ORIGIN) {
        return;
    }

    // 2. Exact source window validation
    if (!qrScannerWindow || event.source !== qrScannerWindow) {
        return;
    }

    // 3. Payload validation
    const data = event.data;
    if (!data || typeof data !== "object") {
        return;
    }

    if (data.type !== "SIMATA_QR_RESULT") {
        return;
    }

    if (typeof data.qrCodeId !== "string") {
        return;
    }

    const trimmedQr = data.qrCodeId.trim();
    if (!trimmedQr) {
        return;
    }

    // 4. Cleanup window
    if (qrScannerPollTimer) {
        clearInterval(qrScannerPollTimer);
        qrScannerPollTimer = null;
    }
    isQrScanning = false;

    try {
        if (qrScannerWindow && !qrScannerWindow.closed) {
            qrScannerWindow.close();
        }
    } catch (e) {
        console.warn("[SIMATA QR] Gagal menutup scanner window:", e);
    }
    qrScannerWindow = null;

    // 5. Proceed to existing lookup flow
    lookupStudentByQrCode(trimmedQr);
}

function syncQrScannerWithEvidenceState() {
    if (currentResponderSession && currentResponderSession.status === "ACTIVE") {
        if (!isQrScanning && !isQrLookingUp) {
            const resultView = document.getElementById('qrResultView');
            const successRecView = document.getElementById('qrSuccessRecordedView');
            const duplicateView = document.getElementById('qrDuplicateView');
            const notFoundView = document.getElementById('qrNotFoundView');
            // If already showing a result or post-scan state, don't overwrite
            if ((!resultView || resultView.style.display === 'none') &&
                (!successRecView || successRecView.style.display === 'none') &&
                (!duplicateView || duplicateView.style.display === 'none') &&
                (!notFoundView || notFoundView.style.display === 'none')) {
                setQrScannerViewMode("idle");
                setQrScannerBadge("Scanner Siap", "info");
            }
        }
    } else {
        stopQrScannerStream();
        setQrScannerViewMode("idle");
        setQrScannerBadge("Belum Aktif", "neutral");
    }
}

function openQrScanner() {
    // GUARD 1: Active session required
    if (!currentResponderSession || !currentResponderSession.sessionId || currentResponderSession.status !== "ACTIVE") {
        if (typeof showToast === 'function') {
            showToast("warning", "Sesi Diperlukan", "Mulai atau buka sesi responder terlebih dahulu sebelum memindai QR.");
        } else {
            alert("Mulai atau buka sesi responder terlebih dahulu sebelum memindai QR.");
        }
        return;
    }

    // Stop evidence camera stream before starting QR scanner
    stopResponderCameraStream();
    stopQrScannerStream();

    // Clean up previous scanner window if open
    if (qrScannerWindow && !qrScannerWindow.closed) {
        try {
            qrScannerWindow.focus();
            return;
        } catch (e) {
            try { qrScannerWindow.close(); } catch (err) {}
        }
    }

    setQrScannerViewMode("scanning");
    setQrScannerBadge("Membuka Scanner...", "info");
    isQrScanning = true;

    // Pass parent origin to external scanner for strictly targeted postMessage return
    const targetUrl = QR_SCANNER_URL + "?simataOrigin=" + encodeURIComponent(window.location.origin);
    qrScannerWindow = window.open(
        targetUrl,
        "simata_qr_scanner",
        "width=500,height=680,menubar=no,toolbar=no,location=no,status=no,resizable=yes"
    );

    if (!qrScannerWindow || qrScannerWindow.closed || typeof qrScannerWindow.closed === "undefined") {
        isQrScanning = false;
        showQrScannerError(
            "Popup Diblokir",
            "Browser memblokir jendela pemindai QR. Izinkan pop-up untuk situs ini pada pengaturan browser lalu klik Coba Lagi."
        );
        return;
    }

    // Monitor for user closing window manually
    if (qrScannerPollTimer) {
        clearInterval(qrScannerPollTimer);
    }
    qrScannerPollTimer = setInterval(function() {
        if (qrScannerWindow && qrScannerWindow.closed) {
            clearInterval(qrScannerPollTimer);
            qrScannerPollTimer = null;
            if (isQrScanning) {
                isQrScanning = false;
                setQrScannerViewMode("idle");
                setQrScannerBadge("Scanner Siap", "info");
            }
        }
    }, 1000);
}

function lookupStudentByQrCode(qrCodeId) {
    if (isQrLookingUp) return;

    if (!currentResponderSession || !currentResponderSession.sessionId || currentResponderSession.status !== "ACTIVE") {
        if (typeof showToast === 'function') {
            showToast("error", "Sesi Tidak Aktif", "Hanya sesi responder yang aktif yang dapat memindai QR.");
        } else {
            alert("Hanya sesi responder yang aktif yang dapat memindai QR.");
        }
        return;
    }

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        if (typeof showToast === 'function') {
            showToast("error", "Autentikasi Diperlukan", "Token sesi tidak ditemukan. Silakan login kembali.");
        } else {
            alert("Token sesi tidak ditemukan. Silakan login kembali.");
        }
        return;
    }

    isQrLookingUp = true;
    lastScannedQrCode = qrCodeId;

    // View mode: looking up
    setQrScannerViewMode("lookup");
    setQrScannerBadge("Mencari Data...", "info");

    const sessionId = currentResponderSession.sessionId;

    google.script.run
        .withSuccessHandler(function(res) {
            isQrLookingUp = false;

            if (!res || !res.success || !res.student) {
                const errMsg = (res && res.message) || ('QR Code "' + qrCodeId + '" tidak terdaftar pada database siswa.');
                setQrScannerViewMode("not_found");
                setQrScannerBadge("QR Tidak Dikenal", "danger");
                const detailEl = document.getElementById('qrNotFoundDetail');
                if (detailEl) {
                    detailEl.textContent = errMsg;
                }
                if (typeof showToast === 'function') {
                    showToast("warning", "QR Tidak Dikenal", errMsg);
                }
                return;
            }

            const s = res.student;

            // Populate student details
            const nameEl = document.getElementById('qrResultName');
            const nisEl = document.getElementById('qrResultNis');
            const classEl = document.getElementById('qrResultClass');
            const idEl = document.getElementById('qrResultStudentId');
            const statusEl = document.getElementById('qrResultStatus');

            if (nameEl) nameEl.textContent = s.name || "--";
            if (nisEl) nisEl.textContent = s.nis || s.nisn || "--";
            if (classEl) classEl.textContent = s.classId || "--";
            if (idEl) idEl.textContent = s.studentId || "--";
            if (statusEl) statusEl.textContent = s.status || "Active";

            setQrScannerViewMode("result");
            setQrScannerBadge("Siswa Ditemukan", "success");

            if (typeof showToast === 'function') {
                showToast("success", "Siswa Ditemukan", (s.name || "Siswa") + " (" + (s.classId || "") + ")");
            }
        })
        .withFailureHandler(function(error) {
            isQrLookingUp = false;
            console.error("[SIMATA QR] Gagal lookup QR:", error);
            showQrScannerError("Koneksi Gagal", "Gagal menghubungi server untuk memverifikasi QR Code.");
        })
        .lookupStudentByQr(token, sessionId, qrCodeId);
}

function submitQrAttendance() {
    if (isAttendanceSubmitting) return;

    if (!currentResponderSession || !currentResponderSession.sessionId || currentResponderSession.status !== "ACTIVE") {
        if (typeof showToast === 'function') {
            showToast("error", "Sesi Tidak Aktif", "Hanya sesi responder yang aktif yang dapat mencatat absensi.");
        } else {
            alert("Hanya sesi responder yang aktif yang dapat mencatat absensi.");
        }
        return;
    }

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        if (typeof showToast === 'function') {
            showToast("error", "Autentikasi Diperlukan", "Token sesi tidak ditemukan. Silakan login kembali.");
        } else {
            alert("Token sesi tidak ditemukan. Silakan login kembali.");
        }
        return;
    }

    if (!lastScannedQrCode) {
        if (typeof showToast === 'function') {
            showToast("warning", "QR Diperlukan", "Pindai QR siswa terlebih dahulu.");
        }
        openQrScanner();
        return;
    }

    isAttendanceSubmitting = true;

    const statusSel = document.getElementById('qrAttendanceStatusSelect');
    const chosenStatus = (statusSel && statusSel.value) ? statusSel.value : "Hadir";

    const submitBtn = document.getElementById('submitAttendanceBtn');
    const submitBtnText = document.getElementById('submitAttendanceBtnText');

    if (submitBtn) submitBtn.disabled = true;
    if (submitBtnText) submitBtnText.textContent = "Menyimpan Absensi...";

    const sessionId = currentResponderSession.sessionId;
    const qrCodeId = lastScannedQrCode;

    google.script.run
        .withSuccessHandler(function(res) {
            isAttendanceSubmitting = false;
            if (submitBtn) submitBtn.disabled = false;
            if (submitBtnText) submitBtnText.textContent = "Konfirmasi & Simpan Absensi";

            if (res && res.success) {
                // Success recorded
                const studentName = (res.student && res.student.name) || "Siswa";
                const studentClass = (res.student && res.student.classId) || "";
                const recordedStatus = (res.attendance && res.attendance.status) || chosenStatus;

                const detailEl = document.getElementById('recordedStudentDetail');
                if (detailEl) detailEl.textContent = studentName + (studentClass ? " (" + studentClass + ")" : "");

                const badgeEl = document.getElementById('recordedStatusBadge');
                if (badgeEl) {
                    badgeEl.textContent = recordedStatus.toUpperCase();
                    badgeEl.className = "simata-badge simata-badge-" + (recordedStatus === "Hadir" ? "success" : (recordedStatus === "Alpa" ? "danger" : "warning"));
                }

                setQrScannerViewMode("success_recorded");
                setQrScannerBadge("Presensi Berhasil", "success");

                if (typeof showToast === 'function') {
                    showToast("success", "Presensi Berhasil", studentName + " berhasil dicatat: " + recordedStatus);
                }
                return;
            }

            // Failure handling
            const errMsg = (res && res.message) || "Gagal mencatat absensi siswa.";

            // Check if duplicate rejection
            if (errMsg.toLowerCase().includes("sudah ada") || errMsg.toLowerCase().includes("sudah absen")) {
                const dupDetailEl = document.getElementById('duplicateStudentDetail');
                if (dupDetailEl) dupDetailEl.textContent = errMsg;

                setQrScannerViewMode("duplicate");
                setQrScannerBadge("Sudah Absen", "warning");

                if (typeof showToast === 'function') {
                    showToast("warning", "Sudah Absen Hari Ini", errMsg);
                }
            } else {
                if (typeof showToast === 'function') {
                    showToast("error", "Gagal Mencatat Absensi", errMsg);
                } else {
                    alert(errMsg);
                }
            }
        })
        .withFailureHandler(function(error) {
            isAttendanceSubmitting = false;
            if (submitBtn) submitBtn.disabled = false;
            if (submitBtnText) submitBtnText.textContent = "Konfirmasi & Simpan Absensi";

            console.error("[SIMATA QR] Gagal mencatat presensi:", error);
            if (typeof showToast === 'function') {
                showToast("error", "Koneksi Gagal", "Gagal menghubungi server untuk mencatat presensi.");
            } else {
                alert("Gagal menghubungi server untuk mencatat presensi.");
            }
        })
        .recordStudentAttendanceFromQr(token, sessionId, qrCodeId, chosenStatus, "");
}

function closeQrScanner() {
    stopQrScannerStream();
    setQrScannerViewMode("idle");
    setQrScannerBadge("Scanner Siap", "info");

function stopQrScannerStream() {
    isQrScanning = false;

    if (qrScannerPollTimer) {
        clearInterval(qrScannerPollTimer);
        qrScannerPollTimer = null;
    }

    if (qrScannerWindow && !qrScannerWindow.closed) {
        try {
            qrScannerWindow.close();
        } catch (e) {}
    }
    qrScannerWindow = null;

    if (qrAnimationFrameId) {
        cancelAnimationFrame(qrAnimationFrameId);
        qrAnimationFrameId = null;
    }

    if (currentQrStream) {
        try {
            currentQrStream.getTracks().forEach(function(track) {
                track.stop();
            });
        } catch (e) {
            console.warn("[SIMATA QR] Gagal menghentikan track:", e);
        }
        currentQrStream = null;
    }

    const video = document.getElementById('qrVideo');
    if (video) {
        video.srcObject = null;
    }
}

function startOrOpenResponder() {
    // If there is already an active session in local state, simply switch to the view
    if (currentResponderSession && currentResponderSession.sessionId) {
        showResponderView();
        return;
    }

    const token = sessionStorage.getItem("SIMATA_TOKEN");
    if (!token) {
        if (typeof showToast === 'function') {
            showToast("error", "Autentikasi Diperlukan", "Token sesi tidak ditemukan. Silakan login kembali.");
        } else {
            alert("Token sesi tidak ditemukan. Silakan login kembali.");
        }
        return;
    }

    if (typeof showToast === 'function') {
        showToast("info", "Memulai Sesi", "Membuka sesi responder...");
    }

    google.script.run
        .withSuccessHandler(function(result) {
            if (!result || !result.success) {
                const msg = (result && result.message) || "Terjadi kesalahan saat memulai sesi responder.";
                if (typeof showToast === 'function') {
                    showToast("error", "Gagal Membuka Sesi", msg);
                } else {
                    alert(msg);
                }
                return;
            }

            currentResponderSession = result.session;

            // Populate Operator & Session UI Information
            const nameEl = document.getElementById('responderOperatorName');
            const roleEl = document.getElementById('responderOperatorRole');
            const sessionEl = document.getElementById('responderSessionIdDisplay');
            const badgeEl = document.getElementById('responderStatusBadge');

            if (nameEl) nameEl.textContent = (currentResponderUser && currentResponderUser.name) || currentResponderSession.operatorId || "--";
            if (roleEl) roleEl.textContent = (currentResponderUser && currentResponderUser.role) || "Operator";
            if (sessionEl) sessionEl.textContent = currentResponderSession.sessionId || "--";
            if (badgeEl) {
                badgeEl.textContent = "STATUS: " + (currentResponderSession.status || "ACTIVE");
                badgeEl.className = "simata-badge simata-badge-success";
            }

            // Reset camera to clean idle state
            resetResponderCameraState();

            showResponderView();

            if (typeof showToast === 'function') {
                showToast("success", "Sesi Aktif", "Sesi responder berhasil dimulai.");
            }
        })
        .withFailureHandler(function(error) {
            console.error("[SIMATA RESPONDER] Gagal memulai sesi:", error);
            if (typeof showToast === 'function') {
                showToast("error", "Koneksi Gagal", "Tidak dapat menghubungi server untuk membuat sesi responder.");
            } else {
                alert("Tidak dapat menghubungi server untuk membuat sesi responder.");
            }
        })
        .createResponderSession(token);
}
